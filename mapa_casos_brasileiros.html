latitude": -25.4298854, "map_longitude": -48.7125431, "cor": "hsl(353.5, 88%, 58%)", "endereco": "Antonina, Paraná, Região Sul, 83370-000, Brasil"}, {"id": 126, "titulo": "OVNIs são vistos por pilotos brasileiros em dois dias diferentes", "ano": 2023, "decada": 2020, "data_ocorrencia": "2023-07-20", "cidade": "Brasília", "estado": "Distrito Federal", "pais": "Brasil", "tipo_objeto": "OVNI", "tem_seres": false, "link": "https://fenomenum.com.br/ovnis-brasilia/", "resumo": "Em 19 de junho e 20 de julho de 2023, pilotos brasileiros relataram avistamentos de objetos luminosos durante voos sobre regiões do Tocantins, Minas Gerais, Bahia e Distrito Federal. Os casos envolveram aeronaves comerciais e particulares, com objetos observados à frente ou ao lado das rotas e comunicação com o Centro Brasília. O episódio chama atenção por reunir testemunhas treinadas, observações em voo e registros em dias diferentes.", "latitude": -15.7939869, "longitude": -47.8828, "map_latitude": -15.7939869, "map_longitude": -47.8828, "cor": "hsl(131.0, 88%, 58%)", "endereco": "Brasília, Plano Piloto, Região Geográfica Intermediária do Distrito Federal, Distrito Federal, Região Centro-Oeste, 70391-900, Brasil"}, {"id": 126, "titulo": "OVNIs são vistos por pilotos brasileiros em dois dias diferentes", "ano": 2023, "decada": 2020, "data_ocorrencia": "2023-07-20", "cidade": "sul do Tocantins", "estado": "Tocantins", "pais": "Brasil", "tipo_objeto": "OVNI", "tem_seres": false, "link": "https://fenomenum.com.br/ovnis-brasilia/", "resumo": "Em 19 de junho e 20 de julho de 2023, pilotos brasileiros relataram avistamentos de objetos luminosos durante voos sobre regiões do Tocantins, Minas Gerais, Bahia e Distrito Federal. Os casos envolveram aeronaves comerciais e particulares, com objetos observados à frente ou ao lado das rotas e comunicação com o Centro Brasília. O episódio chama atenção por reunir testemunhas treinadas, observações em voo e registros em dias diferentes.", "latitude": -10.8855129,       return marker;
    }

    function drawCaseLines(visiblePoints) {
      const groups = new Map();
      for (const point of visiblePoints) {
        const lat = Number(point.map_latitude);
        const lon = Number(point.map_longitude);
        if (!Number.isFinite(lat) || !Number.isFinite(lon)) continue;
        if (!groups.has(point.id)) groups.set(point.id, []);
        groups.get(point.id).push(point);
      }

      for (const group of groups.values()) {
        if (group.length < 2) continue;
        const coords = group.map(point => [point.map_latitude, point.map_longitude]);
        const color = group[0].cor || '#22d3ee';

        L.polyline(coords, {
          color: '#e2e8f0',
          weight: 4,
          opacity: 0.12,
          lineCap: 'round',
          lineJoin: 'round',
          interactive: false
        }).addTo(routeLayer);

        L.polyline(coords, {
          color,
          weight: 1.4,
          opacity: 0.62,
          dashArray: '6 7',
          lineCap: 'round',
          lineJoin: 'round',
          interactive: false
        }).addTo(routeLayer);
      }
    }

    function mapPadding() {
      const panelOpen = !els.panel.classList.contains('collapsed') && window.innerWidth > 720;
      const detailOpen = !els.detailPanel.classList.contains('hidden') && window.innerWidth > 960;
      return {
        paddingTopLeft: [panelOpen ? 430 : 32, 32],
        paddingBottomRight: [detailOpen ? 440 : 32, 32],
        maxZoom: 7
      };
    }

    function settleMap(bounds) {
      requestAnimationFrame(() => {
        map.invalidateSize({ pan: false });
        if (bounds.length === 1) {
          map.setView(bounds[0], 9, { animate: false });
        } else {
          map.fitBounds(bounds, mapPadding());
        }
      });
    }

    function render() {
      routeLayer.clearLayers();
      cluster.clearLayers();
      markerByKey.clear();
      els.results.textContent = '';

      const visible = points.filter(matches);
      const bounds = [];

      drawCaseLines(visible);

      for (const point of visible) {
        const marker = makeMarker(point);
        cluster.addLayer(marker);
        markerByKey.set(keyFor(point), marker);
        bounds.push([point.map_latitude, point.map_longitude]);

        const item = document.createElement('button');
        item.type = 'button';
        item.className = 'case';
        item.innerHTML = `
          <span class="swatch" style="--c:${point.cor}"></span>
          <span>
            <span class="case-title">${escapeHtml(point.titulo)}</span>
            <span class="case-place">${escapeHtml(place(point))}</span>
            <span class="case-date">${escapeHtml(point.data_ocorrencia || '')}</span>
          </span>
        `;
        item.addEventListener('click', () => {
          cluster.zoomToShowLayer(marker, () => {
            map.setView([point.map_latitude, point.map_longitude], Math.max(map.getZoom(), 8), { animate: true });
            openCase(point);
          });
        });
        els.results.appendChild(item);
      }

      if (!visible.length) {
        const empty = document.createElement('div');
        empty.className = 'case-place';
        empty.style.padding = '14px 16px';
        empty.textContent = 'Nenhum ponto encontrado.';
        els.results.appendChild(empty);
        return;
      }

      settleMap(bounds);
    }

    populateFilters();
    render();

    els.search.addEventListener('input', render);
    els.state.addEventListener('change', () => applyStateSelection(els.state.value));
    els.decade.addEventListener('change', render);
    els.detail.addEventListener('change', updateBaseMap);
    els.labels.addEventListener('change', render);
    els.beings.addEventListener('change', render);
    els.detailClose.addEventListener('click', () => {
      els.detailPanel.classList.add('hidden');
      setTimeout(() => map.invalidateSize({ pan: false }), 80);
    });
    els.collapse.addEventListener('click', () => {
      els.panel.classList.toggle('collapsed');
      els.collapse.textContent = els.panel.classList.contains('collapsed') ? '+' : '−';
      setTimeout(render, 180);
    });
    window.addEventListener('resize', () => setTimeout(render, 150));
  </script>
</body>
</html>
