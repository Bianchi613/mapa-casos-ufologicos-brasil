"tem_seres": true, "link": "https://fenomenum.com.br/contato-em-venancio-aires/", "resumo": "Em dezembro de 1954, na zona rural de Venâncio Aires (RS), ocorreram dois relatos próximos envolvendo objetos discoidais e tripulantes. No primeiro, o agricultor Olmiro da Costa e Rosa trabalhava na lavoura quando viu um objeto claro, em forma de chapéu, flutuando a cerca de um metro do solo, com um tripulante do lado de fora e outro no interior. O episódio teria provocado medo nos animais e na testemunha; em outro relato da região, seres teriam recolhido um pé de fumo antes de decolar em alta velocidade.", "latitude": -29.614306, "longitude": -52.193159, "map_latitude": -29.614306, "map_longitude": -52.193159, "cor": "hsl(157.6, 88%, 58%)", "endereco": "Venâncio Aires, Rio Grande do Sul, Região Sul, Brasil"}, {"id": 11, "titulo": "O dia em que Discos Voadores Assustaram Curitiba", "ano": 1954, "decada": 1950, "data_ocorrencia": "1954-12-14", "cidade": "Curitiba", "estado": "Paraná", "pais": "Brasil", "tipo_objeto": "Disco voador", "tem_seres": false, "link": "https://fenomenum.com.br/o-dia-em-que-discos-voadores-assustaram-curitiba/", "resumo": "Em 14 de dezembro de 1954, por volta das 11h, três pontos brilhantes surgiram sobre Curitiba (PR) e, ao longo do dia, passaram a ser descritos por moradores como discos metálicos e reluzentes. Por volta do meio-dia, os objetos baixaram de altitude e puderam ser observados de vários pontos da cidade; mais tarde, dois seguiram para o sul e um terceiro aproximou-se de prédios no centro, provocando correria, lojas fechadas antes do horário e cobertura ao vivo de rádios locais. Testemunhas como o coronel Carlos Assunção relataram um objeto redondo, avermelhado e azulado, deslocando-se com grande velocidade. A narrativa também menciona tentativa de aproximação por aeronave da FAB, envolvimento da Marinha, fotografias feitas por Maxim Cicaida e avistamentos no mesmo dia em São José dos Pinhais, Ponta Grossa e Joinville.", "latitude": -25.4295963, "longitude": -49.2712724, "map_latitude": -25.4295963, "map_longitude": -49.2712724, "cor": "hsl(295.1, 88%, 58%)", "endereco": "Curitiba, Paraná, Região Sul, Brasil"}, {"id": 12, "titulo": "O Caso da Rua Equador", "ano": 1955, "decada": 1950, "data_ocorrencia": "1955-01-01", "cidade": "Curitiba", "estado": "Paraná", "pais": "Brasil", "tipo_objeto": "Disco voador", "tem_seres": false, "link": "https://fenomenum.com.br/o-caso-da-rua-equador/", "resumo": "Em um domingo de agosto, na Rua Equador, bairro Bacacheri, em Curitiba (PR), o Sr. L.A.B., sua esposa e outras quatro pessoas viram no céu um objeto luminoso de aspecto ovoide, inicialmente parecido com uma estrela. O objeto realizava movimentos rápidos e incomuns até se aproximar de modo repentino, ficando a cerca de 150 metros das testemunhas e pouco acima de árvores próximas. Nesse momento, o grupo percebeu que ele tinha formato semelhante a um chapéu de safári e emitia pela parte inferior feixes paralelos de luz colorida. Após alguns segundos de observação próxima, o objeto acelerou de forma abrupta e desapareceu em velocidade descrita como extremamente alta.", "latitude": -25.4295963, "longitude": -49.2712724, "map_latitude": -25.4295963, "map_longitude": -49.2712724, "cor": "hsl(72.6, 88%, 58%)", "endereco": "Curitiba, Paraná, Região Sul, Brasil"}, {"id": 14, "titulo": "Caso Lança-Chamas", "ano": 1956, "decada": 1950, "data_ocorrencia": "1956-01-01", "cidade": "Campinas", "estado": "São Paulo", "pais": "Brasil", "tipo_objeto": "Disco voador", "tem_seres": true, "link": "https://fenomenum.com.br/caso-lanca-chamas/", "resumo": "Em setembro de 1957, em uma fazenda na região de Campinas (SP), Hélio Penteado e o capataz Zeca Sabiá foram verificar uma cerca rompida quando o cachorro da propriedade começou a rosnar para a plantação de hortelã. Os dois ouviram um som forte e agudo e viram um objeto discoidal de mais de 15 metros apoiado em tripé, com esferas nas pontas que giravam e perfuravam o solo. Hélio aproximou-se e relatou dois tripulantes saindo do aparelho, usando trajes inteiriços verde-folha que cobriam inclusive a cabeça, botas metálicas e luvas grossas. Um deles carregava um objeto parecido com lança-chamas, e ambos desceram em direção ao Rio Tietê levando uma vasilha. Marcas circulares deixadas no solo, com cerca de um metro de diâmetro, foram apontadas depois como vestígios do pouso.", "latitude": -22.9056391, "longitude": -47.059564, "map_latitude": -22.9056391, "map_longitude": -47.059564, "cor": "hsl(210.1, 88%, 58%)", "endereco": "Campinas, São Paulo, Região Sudeste, Brasil"}, {"id": 15, "titulo": "O Caso João de Freitas Guimarães", "ano": 1956, "decada": 1950, "data_ocorrencia": "1956-07-16", "cidade": "Caraguatatuba", "estado": "São Paulo", "pais": "Brasil", "tipo_objeto": "Disco voador", "tem_seres": true, "link": "https://fenomenum.com.br/o-caso-joao-de-freitas-guimaraes/", "resumo": "Em 16 de julho de 1956, em Caraguatatuba, São Paulo, o advogado João de Freitas Guimarães teve um contato amistoso com tripulantes de um disco voador, na região de Caraguatatuba, litoral de São Paulo. Em dia 16 de julho de 1956, o advogado João de Freitas Guimarães estava em Caraguatatuba, por ocasião de uma viagem a serviço. Ao chegar na cidade, encontrou o fórum cível fechado, pois já era final de tarde. Após jantar, João Guimarães foi caminhar pela praia quando, por volta das 19 horas, parou para observar o mar.", "latitude": -23.62028, "longitude": -45.41306, "map_latitude": -23.62028, "map_longitude": -45.41306, "cor": "hsl(347.6, 88%, 58%)", "endereco": "Caraguatatuba, São Paulo, Região Sudeste, Brasil"}, {"id": 13, "titulo": "Abdução em Niterói", "ano": 1956, "decada": 1950, "data_ocorrencia": "1956-09-11", "cidade": "Niterói", "estado": "Rio de Janeiro", "pais": "Brasil", "tipo_objeto": "Disco voador", "tem_seres": true, "link": "https://fenomenum.com.br/abducao-em-niteroi/", "resumo": "Em setembro de 1956, na praia do Saco de São Francisco, em Niterói (RJ), Clélia T. R. relatou ter visto um objeto luminoso e ruidoso pairar sobre o mar, provocando pânico entre banhistas. Ela afirmou ter sofrido um lapso de memória e acordado dentro do disco, onde viu outro rapaz inconsciente e foi levada por tripulantes de traje metálico para exames. Um dos seres teria falado em português, explicado que ela seria devolvida com amnésia parcial e mostrado compartimentos internos da nave antes de seu retorno à beira da estrada.", "latitude": -22.9181, "longitude": -43.0864, "map_latitude": -22.9181, "map_longitude": -43.0864, "cor": "hsl(125.1, 88%, 58%)", "endereco": "S?o Francisco, Niter?i, Rio de Janeiro, Brasil"}, {"id": 18, "titulo": "Caso Lagoa Negra", "ano": 1957, "decada": 1950, "data_ocorrencia": "1957-01-01", "cidade": "Viamão", "estado": "Rio Grande do Sul", "pais": "Brasil", "tipo_objeto": "Disco voador", "tem_seres": true, "link": "https://fenomenum.com.br/caso-lagoa-negra/", "resumo": "Entre dezembro de 1957 e janeiro de 1958, a região da Lagoa Negra, em Viamão (RS), registrou relatos de objetos multicoloridos sobre a área rural. No episódio principal, um disco intensamente iluminado teria pousado a cerca de 400 metros de uma casa de fazenda, levando o proprietário e o capataz a se aproximarem enquanto a mulher e as crianças ficaram observando da residência. Ao lado do objeto, eles relataram dois seres altos, de cerca de 2 metros, pele clara, cabelos negros compridos, mãos alongadas e macacões brancos com faixa larga na cintura, que caminhavam de forma rígida sem dobrar os joelhos. Depois surgiram mais três tripulantes menores, com cerca de 1,40 metro, macacões marrons e pequenas botas. Os seres se aproximaram da casa até cerca de 60 metros, sem provocar reação dos cães, e em seguida voltaram para o disco, que decolou e desapareceu.", "latitude": -30.0819338, "longitude": -51.0261927, "map_latitude": -30.0819338, "map_longitude": -51.0261927, "cor": "hsl(262.6, 88%, 58%)", "endereco": "Viamão, Região Geográfica Intermediária de Porto Alegre, Rio Grande do Sul, Região Sul, Brasil"}, {"id": 21, "titulo": "O Caso Ubatuba", "ano": 1957, "decada": 1950, "data_ocorrencia": "1957-01-01", "cidade": "Ubatuba", "estado": "São Paulo", "pais": "Brasil", "tipo_objeto": "Disco voador", "tem_seres": false, "link": "https://fenomenum.com.br/o-caso-ubatuba/", "resumo": "Em 1957, em Ubatuba, São Paulo, em setembro de 1957 vários banhistas observaram um OVNI descer rapidamente dos céus, manobrar sobre a praia e posteriormente explodir liberando diversos fragmentos de metal que foram coletados e enviados para análise em laboratórios especializados. Em setembro de 1957, vários banhistas observaram um disco voador se aproximar da Praia das Toninhas, em Ubatuba (SP). O objeto vinha numa velocidade incrível, e quando estava prestes a se chocar contra a água, deu uma guinada subindo em seguida. Foi quando explodiu em chamas e fragmentos sobre o mar, próximo aos banhistas.", "latitude": -23.433162, "longitude": -45.083415, "map_latitude": -23.433162, "map_longitude": -45.083415, "cor": "hsl(40.1, 88%, 58%)", "endereco": "Ubatuba, São Paulo, Região Sudeste, Brasil"}, {"id": 17, "titulo": "Caso Ceres", "ano": 1957, "decada": 1950, "data_ocorrencia": "1957-10-10", "cidade": "Ceres", "estado": "Goiás", "pais": "Brasil", "tipo_objeto": "Disco voador", "tem_seres": true, "link": "https://fenomenum.com.br/caso-ceres/", "resumo": "Em 10 de outubro de 1957, na região de Quebra-Coco, em Ceres (GO), Miguel Espanhol Navarrete e seu motorista trafegavam de caminhão quando avistaram uma luz muito intensa durante uma subida íngreme. Ao se aproximar, o objeto sobrevoou o veículo, paralisou o motor e pousou a cerca de 40 metros dali. Miguel descreveu um disco de grandes dimensões, ovalado como dois pratos superpostos, com aproximadamente 140 metros de diâmetro por 40 de altura, que apagou sua luz ao parar próximo ao solo. Uma porta se abriu e sete figuras aparentemente humanas, vestidas com trajes luminosos, saíram e olharam fixamente para o caminhão; depois retornaram ao objeto, que decolou, liberou um aparelho menor rumo ao norte e partiu em outra direção. O relato foi levado ao juiz de Direito de Ceres e a autoridades estaduais, ganhando documentação e repercussão na imprensa da época.", "latitude": -15.3103568, "longitude": -49.6032054, "map_latitude": -15.3103568, "map_longitude": -49.6032054, "cor": "hsl(177.6, 88%, 58%)", "endereco": "Ceres, Região Geográfica Imediata de Ceres - Rialma - Goianésia, Região Geográfica Intermediária de Porangatu-Uruaçu, Goiás, Região Centro-Oeste, Brasil"}, {"id": 16, "titulo": "Caso Antônio Villas-Boas", "ano": 1957, "decada": 1950, "data_ocorrencia": "1957-10-15", "cidade": "São Francisco de Sales", "estado": "Minas Gerais", "pais": "Brasil", "tipo_objeto": "Não identificado", "tem_seres": true, "link": "https://fenomenum.com.br/caso-antonio-villas-boas/", "resumo": "Em 15 de outubro de 1957, na zona rural de São Francisco de Sales (MG), Antônio Villas-Boas arava o campo de madrugada quando viu uma luz vermelha se aproximar e pousar como um objeto ovalado sustentado por hastes. Ele relatou ter sido dominado por pequenos tripulantes com escafandros, levado para o interior da nave, despido, examinado e submetido à coleta de sangue. O caso ficou famoso pela descrição de contato sexual forçado com uma tripulante humanoide e pelos sintomas físicos posteriores, investigados por ufólogos e médicos.", "latitude": -19.863056, "longitude": -49.773889, "map_latitude": -19.863056, "map_longitude": -49.773889, "cor": "hsl(315.1, 88%, 58%)", "endereco": "São Francisco de Sales, Minas Gerais, Região Sudeste, 38260-000, Brasil"}, {"id": 20, "titulo": "O Caso do Forte de Itaipu", "ano": 1957, "decada": 1950, "data_ocorrencia": "1957-11-03", "cidade": "Praia Grande", "estado": "São Paulo", "pais": "Brasil", "tipo_objeto": "Objeto luminoso", "tem_seres": false, "link": "https://fenomenum.com.br/o-caso-do-forte-de-itaipu/", "resumo": "Na madrugada de 3 de novembro de 1957, no Forte de Itaipu, em Praia Grande (SP), duas sentinelas relataram a aproximação de um objeto circular avermelhado vindo do mar. O objeto teria pairado sobre um dos canhões da base e emitido forte calor, causando dor de cabeça, desmaio em um dos soldados e queimaduras sob a farda dos militares expostos. Outros soldados acordaram com os gritos e ainda teriam visto uma luz subindo rapidamente enquanto as instalações do forte passavam por uma queda de energia. A versão clássica do episódio menciona atendimento médico, comunicação ao comando do Exército e posterior encaminhamento do caso a autoridades brasileiras e norte-americanas, embora pesquisas posteriores tenham discutido divergências e lacunas na documentação disponível.", "latitude": -24.008979, "longitude": -46.4144939, "map_latitude": -24.008979, "map_longitude": -46.4144939, "cor": "hsl(92.7, 88%, 58%)", "endereco": "Praia Grande, São Paulo, Região Sudeste, Brasil"}, {"id": 19, "titulo": "Caso Pedro Zilli", "ano": 1957, "decada": 1950, "data_ocorrencia": "1957-11-18", "cidade": "Criciúma", "estado": "Santa Catarina", "pais": "Brasil", "tipo_objeto": "Disco voador", "tem_seres": false, "link": "https://fenomenum.com.br/caso-pedro-zilli/", "resumo": "Em 18 de novembro de 1957, em Criciúma (SC), Pedro Zilli trabalhava na construção de uma estufa de fumo quando ouviu um chiado parecido com o de uma chaleira sob pressão. Ao observar a baixada do terreno com um companheiro, viu dois aparelhos redondos, cor de alumínio, parados a cerca de um metro do chão perto de um laranjal e de um bosque de eucaliptos. Quando os dois se aproximaram, seis indivíduos de roupa cinza saíram da área e os objetos desapareceram pouco depois.", "latitude": -28.6789941, "longitude": -49.3695627, "map_latitude": -28.6789941, "map_longitude": -49.3695627, "cor": "hsl(230.2, 88%, 58%)", "endereco": "Criciúma, Santa Catarina, Região Sul, Brasil"}, {"id": 22, "titulo": "O Caso da Ilha de Trindade", "ano": 1958, "decada": 1950, "data_ocorrencia": "1958-01-16", "cidade": "Ilha de Trindade", "estado": "Espírito Santo", "pais": "Brasil", "tipo_objeto": "Disco voador", "tem_seres": false, "link": "https://fenomenum.com.br/o-caso-da-ilha-de-trindade/", "resumo": "Em 16 de janeiro de 1958, o navio Almirante Saldanha, da Marinha do Brasil, estava próximo à Ilha de Trindade, no litoral do Espírito Santo, durante atividades ligadas ao Ano Geofísico Internacional, quando um objeto discoidal voltou a ser observado na região. O fotógrafo Almiro Baraúna, que estava a bordo, registrou uma sequência de imagens do objeto enquanto militares e tripulantes acompanhavam sua passagem sobre a ilha. A matéria relaciona esse episódio a aparições anteriores entre dezembro de 1957 e janeiro de 1958, quando operários, marinheiros, oficiais e técnicos teriam observado objetos circulares metálicos fazendo manobras rápidas e baixas perto das instalações locais. As fotografias, a presença de testemunhas militares e a posterior disputa sobre a autenticidade das imagens fizeram o episódio permanecer como um dos registros fotográficos mais debatidos da ufologia brasileira.", "latitude": -20.1880663, "longitude": -40.2627103, "map_latitude": -20.1880663, "map_longitude": -40.2627103, "cor": "hsl(7.7, 88%, 58%)", "endereco": "Condomínio Ilha de Trindade, Residencial Vista do Mestre, Laranjeiras Velha, Região de Anchieta, Serra, Região Geográfica Imediata de Vitória, Região Metropolitana da Grande Vitória, Região Geográfica Intermediária de Vitória, Espírito Santo, Região Sudeste, Brasil"}, {"id": 25, "titulo": "Soldado é abduzido dentro de um quartel do Exército", "ano": 1962, "decada": 1960, "data_ocorrencia": "1962-08-26", "cidade": "Três Corações", "estado": "Minas Gerais", "pais": "Brasil", "tipo_objeto": "Disco voador", "tem_seres": true, "link": "https://fenomenum.com.br/soldado-e-abduzido-dentro-de-um-quartel/", "resumo": "Na noite de 26 de agosto de 1962, em Três Corações (MG), o soldado Geraldo Simões Bichara fazia guarda na Escola de Sargentos das Armas, próximo ao paiol de munições, quando a cidade teria ficado sem luz e um foco azulado apareceu sobre sua posição. Segundo seu relato, a luz, com cerca de 12 metros de diâmetro, projetou-se sobre o chão e as árvores, paralisando seu corpo antes que ele conseguisse disparar o fuzil de alarme. Mesmo sem conseguir se mover, Bichara disse ter ouvido portas metálicas e objetos do quartel vibrarem com força, além de cavalos assustados nas baias. A narrativa segue com perda de controle físico, lembranças fragmentadas e a ideia de que o soldado teria sido levado ou examinado durante o episódio, tornando o caso incomum por ocorrer dentro de instalações militares do Exército Brasileiro.", "latitude": -21.695625, "longitude": -45.2543675, "map_latitude": -21.695625, "map_longitude": -45.2543675, "cor": "hsl(145.2, 88%, 58%)", "endereco": "Três Corações, Minas Gerais, Região Sudeste, 37410-000, Brasil"}, {"id": 23, "titulo": "Caso Itabirito", "ano": 1962, "decada": 1960, "data_ocorrencia": "1962-08-30", "cidade": "Itabirito", "estado": "Minas Gerais", "pais": "Brasil", "tipo_objeto": "Disco voador", "tem_seres": true, "link": "https://fenomenum.com.br/caso-itabirito/", "resumo": "Em 30 de agosto de 1962, por volta das 23h, em Itabirito (MG), três homens saíram do cinema e conversavam na esquina das ruas Artur Bernardes e Queiroz quando ouviram um chiado e viram um disco voador parado sobre uma plantação de eucaliptos. O objeto flutuava a cerca de 30 metros de altura e iluminava a região. Em seguida, Geraldo Liberato chamou a atenção dos amigos para um pequeno ser que caminhava em direção ao grupo. A criatura foi descrita como baixa, com cerca de 1,20 m a 1,30 m, tronco volumoso, braços curtos, cabeça pequena e traje inflado ou semelhante a uma carapaça. Depois de andar alguns metros, desapareceu diante das testemunhas. Quando a luz do objeto aumentou, Luís Gonzaga do Carmo ficou paralisado e, após o episódio, relatou fortes dores de cabeça por cerca de um mês.", "latitude": -20.2519724, "longitude": -43.8029171, "map_latitude": -20.2519724, "map_longitude": -43.8029171, "cor": "hsl(282.7, 88%, 58%)", "endereco": "Itabirito, Minas Gerais, Região Sudeste, Brasil"}, {"id": 24, "titulo": "O Misterioso Caso Duas Pontes", "ano": 1962, "decada": 1960, "data_ocorrencia": "1962-08-30", "cidade": "Duas Pontes", "estado": "Minas Gerais", "pais": "Brasil", "tipo_objeto": "Não identificado", "tem_seres": false, "link": "https://fenomenum.com.br/o-misterioso-caso-duas-pontes/", "resumo": "Entre 19 e 20 de agosto de 1962, em Duas Pontes, distrito rural de Diamantina (MG), o garoto Raimundo Mafra, de 12 anos, afirmou ter visto o desaparecimento de seu pai, Rivalino Mafra da Silva, diante do casebre onde a família vivia. Segundo o relato do menino, dois pequenos objetos voadores teriam se colocado perto da porta e levantado um redemoinho de poeira amarela que envolveu Rivalino até ele sumir. Um morador chamado João Madalena de Miranda, chamado logo depois, teria encontrado a área da desaparição como se estivesse varrida em um raio de cerca de 5 metros. A polícia realizou buscas com cães e moradores, mas não encontrou rastros imediatos; meses depois, restos mortais atribuídos a Rivalino foram achados nas proximidades, mantendo o episódio como uma narrativa de desaparecimento associada a fenômeno ufológico.", "latitude": -19.5288666, "longitude": -43.1806094, "map_latitude": -19.5288666, "map_longitude": -43.1806094, "cor": "hsl(60.2, 88%, 58%)", "endereco": "Duas Pontes, Itabira, Minas Gerais, Região Sudeste, Brasil"}, {"id": 27, "titulo": "Caso Canhotinho", "ano": 1965, "decada": 1960, "data_ocorrencia": "1965-01-01", "cidade": "Canhotinho", "estado": "Pernambuco", "pais": "Brasil", "tipo_objeto": "Disco voador", "tem_seres": true, "link": "https://fenomenum.com.br/caso-canhotinho/", "resumo": "Em uma tarde de outubro de 1965, em Canhotinho (PE), José Camilo Filho, mecânico de 57 anos, caminhava por um cerrado perto do cemitério quando encontrou dois pequenos humanoides, com cerca de 90 cm, ao lado de um tubo apoiado no solo. Os seres foram descritos com cabeça grande, cabelos claros esbranquiçados, mãos e pés pequenos, aparência envelhecida e feições que lembravam japoneses; um deles usava boné, enquanto o outro apontou para Camilo um canudo de aproximadamente 50 cm. Assustado, ele passou correndo pelos dois e depois voltou para tentar observá-los melhor, mas não encontrou mais ninguém. No mesmo horário, o agricultor Oscar Passos teria visto um OVNI cruzar os céus da Fazenda Camboim, a cerca de 6 km ao norte.", "latitude": -8.876519, "longitude": -36.197935, "map_latitude": -8.876519, "map_longitude": -36.197935, "cor": "hsl(197.7, 88%, 58%)", "endereco": "Canhotinho, Pernambuco, Região Nordeste, Brasil"}, {"id": 28, "titulo": "Caso Sagrada Família", "ano": 1965, "decada": 1960, "data_ocorrencia": "1965-01-01", "cidade": "Belo Horizonte", "estado": "Minas Gerais", "pais": "Brasil", "tipo_objeto": "OVNI", "tem_seres": true, "link": "https://fenomenum.com.br/caso-sagrada-familia/", "resumo": "Em 28 de agosto de 1963, no bairro Sagrada Família, em Belo Horizonte (MG), Fernando Eustáquio Gualberto, Ronaldo Eustáquio Gualberto e José Marcos Gomes Vidal foram ao quintal de casa à noite e viram uma esfera transparente e iluminada pairando sobre um abacateiro, a poucos metros do chão. Dentro do objeto, os meninos disseram ter visto quatro ocupantes sentados, usando roupas semelhantes a escafandros. Um deles desceu entre dois feixes de luz amarela, aproximou-se da cisterna e foi descrito como um humanoide muito alto, calvo, de pele avermelhada e com apenas um olho grande e escuro. Quando Fernando tentou atirar um pedaço de tijolo, o ser teria disparado uma luz amarela a partir do peito, fazendo a mão do garoto tremer e derrubar o objeto.", "latitude": -19.9227318, "longitude": -43.9450948, "map_latitude": -19.9227318, "map_longitude": -43.9450948, "cor": "hsl(335.2, 88%, 58%)", "endereco": "Belo Horizonte, Minas Gerais, Região Sudeste, Brasil"}, {"id": 29, "titulo": "Contato Imediato em Carazinho (RS)", "ano": 1965, "decada": 1960, "data_ocorrencia": "1965-07-26", "cidade": "Carazinho", "estado": "Rio Grande do Sul", "pais": "Brasil", "tipo_objeto": "Objeto luminoso", "tem_seres": true, "link": "https://fenomenum.com.br/contato-imediato-em-carazinho-rs/", "resumo": "Em 26 de julho de 1965, em Carazinho (RS), o estudante Adilon Batista de Azevedo, de 14 anos, saiu para ir ao cinema com amigos quando viu um foco de luz em forma de cone vindo de uma nuvem. Ele parou para observar e relatou ter visto um objeto ovalado, com cerca de 5 metros de comprimento, aterrissar em um terreno baldio a poucos metros de distância. O caso ficou marcado pelo pouso próximo, pela presença de tripulantes e por efeitos fisiológicos relatados pela testemunha.", "latitude": -28.2981634, "longitude": -52.7942363, "map_latitude": -28.2981634, "map_longitude": -52.7942363, "cor": "hsl(112.7, 88%, 58%)", "endereco": "Carazinho, Rio Grande do Sul, Região Sul, Brasil"}, {"id": 26, "titulo": "Caso Antônio Pau Ferro", "ano": 1965, "decada": 1960, "data_ocorrencia": "1965-09-10", "cidade": "Garanhuns", "estado": "Pernambuco", "pais": "Brasil", "tipo_objeto": "Disco voador", "tem_seres": true, "link": "https://fenomenum.com.br/caso-antonio-pau-ferro/", "resumo": "Em 10 de setembro de 1965, em Garanhuns (PE), o tratorista Antônio Pau Ferro trabalhava em sua pequena lavoura quando ouviu ruídos no milharal e viu dois objetos metálicos descerem sincronizados a baixa altura. Cada aparelho tocou o solo e deixou um pequeno ser, com cerca de 70 a 80 centímetros, antes de subir novamente e pairar a poucos metros. Assustado, Antônio observou os seres se aproximarem, recuarem, olharem para ele com expressão amistosa e caminharem entre as plantações. Um deles teria recolhido um tomate, mostrado ao companheiro e depois descartado o fruto. Quando a testemunha perguntou de onde vinham e o que queriam, não obteve resposta; os seres sorriram, voltaram aos pontos de pouso e foram recolhidos pelos objetos, que decolaram emitindo um som que começou como chiado leve e ficou mais grave.", "latitude": -8.8905889, "longitude": -36.4930896, "map_latitude": -8.8905889, "map_longitude": -36.4930896, "cor": "hsl(250.2, 88%, 58%)", "endereco": "Garanhuns, Região Geográfica Imediata de Garanhuns, Região Geográfica Intermediária de Caruaru, Pernambuco, Região Nordeste, Brasil"}, {"id": 30, "titulo": "Contato Imediato em Mogi-Guaçu", "ano": 1965, "decada": 1960, "data_ocorrencia": "1965-10-18", "cidade": "Mogi Guaçu", "estado": "São Paulo", "pais": "Brasil", "tipo_objeto": "OVNI", "tem_seres": true, "link": "https://fenomenum.com.br/contato-imediato-em-mogi-guacu/", "resumo": "Em 18 de outubro de 1965, na Fazenda São Luís, zona rural de Mogi Guaçu (SP), Lúcia Anhaia observou uma luz alaranjada aproximar-se da casa e descer no cercado de gado, sem tocar o solo. O objeto, de formato cônico, oscilava a cerca de meio metro do chão e emitia faíscas luminosas. Ao lado dele, Lúcia viu um pequeno tripulante de aproximadamente 1,20 m caminhando entre os animais. Poucos minutos depois, o objeto voltou ao mesmo ponto e outro ser, com roupa branca na parte superior e marrom na inferior, recolheu galhos de jurubeba e os levou para o aparelho. Mais tarde, duas luzes surgiram no céu; uma delas projetou em um pilar da casa a imagem de um humanoide sentado, e depois enviou um feixe horizontal em direção ao segundo objeto, produzindo um clarão e um estrondo antes de ambos desaparecerem.", "latitude": -22.372222, "longitude": -46.9425, "map_latitude": -22.372222, "map_longitude": -46.9425, "cor": "hsl(27.7, 88%, 58%)", "endereco": "Mogi Guaçu, São Paulo, Região Sudeste, Brasil"}, {"id": 32, "titulo": "Ufonautas em Quipapá (PE)", "ano": 1966, "decada": 1960, "data_ocorrencia": "1966-02-25", "cidade": "Quipapá", "estado": "Pernambuco", "pais": "Brasil", "tipo_objeto": "Disco voador", "tem_seres": true, "link": "https://fenomenum.com.br/ufonautas-em-quipapa-pe/", "resumo": "Em 25 de fevereiro de 1966, perto da Usina Água Branca, em Quipapá (PE), as irmãs Maria Marluce e Maria Marilucy da Silva caminhavam com a amiga Ofélia Versoa pela linha férrea quando viram uma luz em uma estrada lateral. Ao se aproximarem, perceberam um objeto em forma de prato emborcado, com cerca de 4 metros de diâmetro, suspenso a poucos centímetros do solo. Ao lado dele havia um ser de aproximadamente 2 metros e outros menores, com cerca de 1,50 m, todos usando roupas inteiriças e faixas luminosas no peito. Marilucy e Ofélia correram em pânico, enquanto Marluce tentou observar melhor. Mais tarde, a mãe das irmãs acompanhou as jovens até a porteira da fazenda e também teria visto o objeto voando baixo pela região.", "latitude": -8.8269434, "longitude": -36.011622, "map_latitude": -8.8269434, "map_longitude": -36.011622, "cor": "hsl(165.2, 88%, 58%)", "endereco": "Quipapá, Região Geográfica Imediata de Garanhuns, Região Geográfica Intermediária de Caruaru, Pernambuco, 55415-000, Brasil"}, {"id": 31, "titulo": "O Caso das Máscaras de Chumbo", "ano": 1966, "decada": 1960, "data_ocorrencia": "1966-08-20", "cidade": "Niterói", "estado": "Rio de Janeiro", "pais": "Brasil", "tipo_objeto": "OVNI", "tem_seres": false, "link": "https://fenomenum.com.br/o-caso-das-mascaras-de-chumbo/", "resumo": "Em 20 de agosto de 1966, no Morro do Vintém, em Niterói (RJ), foram encontrados os corpos de Miguel José Viana e Manoel Pereira da Cruz, dois técnicos em eletrônica que haviam saído de Campos dos Goytacazes. Os homens estavam de terno, com capas impermeáveis e máscaras de chumbo sobre os olhos, além de bilhetes com instruções enigmáticas. O caso entrou na ufologia por relatos de luzes estranhas na região e pela ausência de uma explicação conclusiva para as mortes.", "latitude": -22.882, "longitude": -43.0859, "map_latitude": -22.882, "map_longitude": -43.0859, "cor": "hsl(302.7, 88%, 58%)", "endereco": "Regi?o urbana de Niter?i, Rio de Janeiro, Brasil"}, {"id": 34, "titulo": "Contatos em Alexânia (GO)", "ano": 1967, "decada": 1960, "data_ocorrencia": "1967-01-01", "cidade": "Alexânia", "estado": "Goiás", "pais": "Brasil", "tipo_objeto": "OVNI", "tem_seres": true, "link": "https://fenomenum.com.br/contatos-em-alexania-go/", "resumo": "A partir de setembro de 1967, a Fazenda Vale do Rio do Ouro, em Alexânia (GO), passou a concentrar relatos de luzes e objetos observados por moradores, empregados, curiosos e pesquisadores. O proprietário Wilson Gusmão começou vendo pequenas luzes que se aproximavam da casa, permaneciam por alguns minutos a cerca de 200 metros e depois se afastavam. Em 27 de setembro, seu irmão Eunápio Gusmão, ao sair para caçar, relatou ter visto um objeto em forma de prato descer do céu, imobilizá-lo e abrir uma porta pela qual três seres o observaram antes de o disco subir em alta velocidade. Em fevereiro de 1968, empregados e visitantes relataram um objeto no alto do morro projetando um facho de luz que permaneceu no ar mesmo depois de o aparelho apagar, sendo depois \"recolhido\" por novo feixe. A sequência de episódios atraiu jornalistas, médicos, advogados e pesquisadores para acompanhar as vigílias na fazenda.", "latitude": -16.0834049, "longitude": -48.5077803, "map_latitude": -16.0834049, "map_longitude": -48.5077803, "cor": "hsl(80.3, 88%, 58%)", "endereco": "Alexânia, Goiás, Região Centro-Oeste, Brasil"}, {"id": 37, "titulo": "Rapto em Sarandi (RS)", "ano": 1967, "decada": 1960, "data_ocorrencia": "1967-01-01", "cidade": "Sarandi", "estado": "Rio Grande do Sul", "pais": "Brasil", "tipo_objeto": "Não identificado", "tem_seres": true, "link": "https://fenomenum.com.br/rapto-em-sarandi-rs/", "resumo": "Era biscateiro. Às 21 horas de uma noite fria de junho de 1967, ele voltava do trabalho quando, a uns 200 metros de sua residência, viu uma bola luminosa a 30 metros de altura e pensou que fosse o que os habitantes daquela região chamam de “Boi-ta-tá” ou “Mãe d’Ouro”. Aquilo desceu até uns 10 metros do chão e parou, projetando um facho de luz para baixo e, em movimento helicoidal em torno desse raio, guardando sempre a distância de 30 ou 40 centímetros do mesmo, desceram rapidamente dois seres de uns 85 centímetros de altura. Paralisado pela surpresa, não pode reagir quando os pequeninos passaram-lhe por baixo dos braços uma fita, içando-o para dentro da bola luminosa, através de um buraco circular na parte inferior do aparelho. Um terceiro tripulante pegou-o em cima e o colocou num pequeno assento de um pé só, soltando-o sem seguida a fita que o amarrava.", "latitude": -27.9310978, "longitude": -52.8630798, "map_latitude": -27.9310978, "map_longitude": -52.8630798, "cor": "hsl(217.8, 88%, 58%)", "endereco": "Sarandi, Região Geográfica Imediata de Carazinho, Rio Grande do Sul, Região Sul, Brasil, Região Geográfica Intermediária de Passo Fundo"}, {"id": 33, "titulo": "Caso São Benedito", "ano": 1967, "decada": 1960, "data_ocorrencia": "1967-07-19", "cidade": "São Benedito do Sul", "estado": "Pernambuco", "pais": "Brasil", "tipo_objeto": "Disco voador", "tem_seres": true, "link": "https://fenomenum.com.br/caso-sao-benedito/", "resumo": "Em 19 de julho de 1967, em São Benedito do Sul (PE), Maria de Figueiredo, então com 18 anos, relatou ter encontrado um pequeno ser de cerca de 1 metro de altura enquanto estava com dois irmãos menores. Atrás da criatura havia um aparelho metálico alongado, com cúpula transparente, dentro do qual ela percebeu outro ocupante. O encontro teria causado efeitos físicos na testemunha e passou a ser citado como caso de pouso com avistamento de tripulantes.", "latitude": -8.8107294, "longitude": -35.9334035, "map_latitude": -8.8107294, "map_longitude": -35.9334035, "cor": "hsl(355.3, 88%, 58%)", "endereco": "São Benedito do Sul, Região Geográfica Imediata de Palmares, Região Geográfica Intermediária do Recife, Pernambuco, Brasil"}, {"id": 36, "titulo": "O Trágico Caso Crixás", "ano": 1967, "decada": 1960, "data_ocorrencia": "1967-08-13", "cidade": "Crixás", "estado": "Goiás", "pais": "Brasil", "tipo_objeto": "Disco voador", "tem_seres": true, "link": "https://fenomenum.com.br/o-tragico-caso-crixas/", "resumo": "Em 13 de agosto de 1967, na Fazenda Santa Maria, entre Pilar de Goiás e Crixás (GO), o capataz Inácio de Sousa e sua esposa Maria voltavam para casa quando viram um disco voador pousado na pista da propriedade. O objeto foi descrito como uma bacia invertida de cerca de 35 metros de diâmetro, com três tripulantes de aparência humana nas proximidades. Inácio contou que os seres pareciam carecas, brincavam em silêncio e começaram a correr em sua direção quando perceberam o casal. Ele mandou a esposa fugir, disparou a espingarda contra o tripulante mais próximo e, em seguida, foi atingido no peito por uma luz verde emitida pelo aparelho. O objeto decolou verticalmente com som semelhante ao de abelhas, e Inácio adoeceu nos dias seguintes, morrendo 59 dias depois com diagnóstico de leucemia.", "latitude": -14.5424536, "longitude": -49.9694813, "map_latitude": -14.5424536, "map_longitude": -49.9694813, "cor": "hsl(132.8, 88%, 58%)", "endereco": "Crixás, Goiás, Região Centro-Oeste, 76510-000, Brasil"}, {"id": 35, "titulo": "O Caso da Baleia", "ano": 1967, "decada": 1960, "data_ocorrencia": "1967-09-14", "cidade": "Belo Horizonte", "estado": "Minas Gerais", "pais": "Brasil", "tipo_objeto": "Disco voador", "tem_seres": true, "link": "https://fenomenum.com.br/o-caso-da-baleia/", "resumo": "Em 14 de setembro de 1967, às 10h30, nas proximidades do Hospital da Baleia, em Belo Horizonte (MG), o jovem Fábio J. Diniz caminhava para vender persianas quando encontrou um objeto enorme em forma de cogumelo perto de um campo de futebol. O aparelho teria cerca de 20 metros de diâmetro, cor marrom, vigias laterais e luzes vermelhas, amarelas e azuis piscando na base. Dele saíram dois seres com mais de 2 metros de altura, roupas verdes colantes e tubos ligados ao corpo; um portava uma antena na cabeça e outro parecia carregar uma arma. Ao tentar fugir, Fábio ouviu uma voz mandando-o voltar, e um dos seres o intimou a comparecer no dia seguinte no mesmo horário, ameaçando levar sua família. Depois da decolagem do objeto, pesquisadores e policiais recolheram amostras de terra no local, que foram analisadas na UFMG.", "latitude": -19.9227318, "longitude": -43.9450948, "map_latitude": -19.9227318, "map_longitude": -43.9450948, "cor": "hsl(270.3, 88%, 58%)", "endereco": "Belo Horizonte, Minas Gerais, Região Sudeste, Brasil"}, {"id": 42, "titulo": "O Fantástico Caso Lins", "ano": 1968, "decada": 1960, "data_ocorrencia": "1968-08-25", "cidade": "Lins", "estado": "São Paulo", "pais": "Brasil", "tipo_objeto": "Não identificado", "tem_seres": true, "link": "https://fenomenum.com.br/o-fantastico-caso-lins/", "resumo": "Na madrugada de 25 de agosto de 1968, no Hospital Serafim Correa, em Lins (SP), Maria José Cintra ouviu ruídos semelhantes a estalos no pátio e encontrou uma mulher desconhecida diante da porta. A visitante falava em idioma incompreensível, usava uma capa azul-clara brilhante e entregou um frasco, que Maria interpretou como pedido de água. Depois de encher o recipiente e uma pequena caneca, a mulher retornou ao pátio, onde uma luz difusa revelou um objeto em forma de pera flutuando a menos de 1 metro do chão. Maria relatou ter visto mãos operando um painel por uma vigia antes de o objeto decolar com o mesmo som de estalos. No gramado, foram descritas marcas de pegadas e uma depressão circular de cerca de 2 metros, com grama chamuscada.", "latitude": -21.6741873, "longitude": -49.7518932, "map_latitude": -21.6741873, "map_longitude": -49.7518932, "cor": "hsl(47.8, 88%, 58%)", "endereco": "Lins, São Paulo, Região Sudeste, Brasil"}, {"id": 40, "titulo": "Contato Imediato em Joinville (SC)", "ano": 1968, "decada": 1960, "data_ocorrencia": "1968-09-27", "cidade": "Joinville", "estado": "Santa Catarina", "pais": "Brasil", "tipo_objeto": "Disco voador", "tem_seres": true, "link": "https://fenomenum.com.br/contato-imediato-em-joinville-sc/", "resumo": "Na madrugada de 26 ou 27 de setembro de 1968, em Vila Baumer, Joinville (SC), o químico industrial Henrique Schneider Júnior levantou-se para verificar o forno de sua olaria e encontrou um objeto pousado no pátio, a cerca de 5 metros. Ele descreveu o aparelho como afunilado, com aproximadamente 4 metros de altura e 2,5 metros de diâmetro na base, apoiado em tripé e iluminado por uma luz bruxuleante na parte inferior. Schneider afirmou ter ficado paralisado enquanto observava uma esteira ou rampa e vultos acinzentados ligados ao objeto, incluindo um tripulante de morfologia retangular, detalhe que tornou o episódio especialmente estranho dentro dos relatos de contato. Após o recolhimento da esteira, a entrada se fechou com ruído semelhante a faísca elétrica e o aparelho subiu verticalmente, emitindo um som agudo e luz azulada na parte inferior.", "latitude": -26.3044898, "longitude": -48.8486726, "map_latitude": -26.3044898, "map_longitude": -48.8486726, "cor": "hsl(185.3, 88%, 58%)", "endereco": "Joinville, Região Geográfica Imediata de Joinville, Região Geográfica Intermediária de Joinville, Santa Catarina, Região Sul, Brasil"}, {"id": 39, "titulo": "Caso Turíbio Pereira", "ano": 1968, "decada": 1960, "data_ocorrencia": "1968-10-02", "cidade": "Lins", "estado": "São Paulo", "pais": "Brasil", "tipo_objeto": "Não identificado", "tem_seres": true, "link": "https://fenomenum.com.br/caso-turibio-pereira/", "resumo": "Em 2 de outubro de 1968, em Lins (SP), o tratorista Turíbio Pereira chegou ao trabalho no fim da Avenida da Saudade e encontrou um pequeno veículo dourado, ovalado, flutuando perto do trator. O objeto teria cerca de 5 metros de comprimento, uma cúpula transparente, quatro assentos e um painel incomum. Turíbio viu quatro seres muito parecidos entre si, usando túnicas azuis, saias vermelhas e sandálias com tiras nas pernas: um estava na plataforma do aparelho, outro recolhia terra, um examinava o motor do trator e o quarto permanecia no interior, junto ao painel. Quando perceberam sua presença, um deles disparou uma pequena esfera luminosa que o atingiu no abdômen, causando dor intensa e paralisia até a partida silenciosa do objeto.", "latitude": -21.6741873, "longitude": -49.7518932, "map_latitude": -21.6741873, "map_longitude": -49.7518932, "cor": "hsl(322.8, 88%, 58%)", "endereco": "Lins, São Paulo, Região Sudeste, Brasil"}, {"id": 38, "titulo": "Avistamento na Estrada", "ano": 1968, "decada": 1960, "data_ocorrencia": "1968-11-19", "cidade": "Pirassununga", "estado": "São Paulo", "pais": "Brasil", "tipo_objeto": "Disco voador", "tem_seres": true, "link": "https://fenomenum.com.br/avistamento-na-estrada/", "resumo": "Em 19 de novembro de 1968, por volta das 23h, quatro estudantes, Jaime, Luís, Walter e Osmar, viajavam de Volkswagen em direção a Pirassununga (SP) quando viram uma luz azulada na estrada. Ao piscar os faróis, o motorista relatou que a luz respondeu com a mesma sequência, aumentando o nervosismo do grupo. Mais adiante, os jovens observaram um foco luminoso iluminando a mata e, logo depois, um redemoinho ocupando a pista. Ao reduzir a velocidade, encontraram um homem parado no meio da estrada, com o braço estendido, e mais três figuras alinhadas na margem direita. Os quatro foram descritos como altos, de feições humanas normais, vestindo macacões azul-claros, sem falar ou se mover enquanto o carro passava.", "latitude": -21.9980468, "longitude": -47.4280861, "map_latitude": -21.9980468, "map_longitude": -47.4280861, "cor": "hsl(100.3, 88%, 58%)", "endereco": "Pirassununga, São Paulo, Região Sudeste, Brasil"}, {"id": 41, "titulo": "Luta Livre em Bauru (SP)", "ano": 1968, "decada": 1960, "data_ocorrencia": "1968-12-25", "cidade": "Bauru", "estado": "São Paulo", "pais": "Brasil", "tipo_objeto": "Não identificado", "tem_seres": true, "link": "https://fenomenum.com.br/luta-livre-em-bauru-sp/", "resumo": "Na madrugada de 23 de julho de 1968, na subestação da CESP em Bauru (SP), o vigia Daildo de Oliveira fazia sua ronda quando viu figuras estranhas perto dos escritórios. Armado apenas com um pedaço de conduite, ele tentou surpreender um dos intrusos, mas seus golpes foram aparados com rapidez e começou uma luta corporal. Outros dois seres se juntaram ao confronto; um deles estava sem máscara, tinha pele clara e cabelos arruivados de textura rígida. Após vários minutos, os três dominaram Daildo, arrancaram parte de suas roupas e o atiraram repetidas vezes ao chão. Ao se afastar para chamar outro vigia, ele ouviu uma porta bater e viu um objeto de formato semelhante a um furgão vertical decolar com brilho azulado e ruído parecido com fritura. A investigação posterior registrou marcas no local e danos em objetos pessoais do vigia.", "latitude": -22.3173803, "longitude": -49.0689778, "map_latitude": -22.3173803, "map_longitude": -49.0689778, "cor": "hsl(237.8, 88%, 58%)", "endereco": "Bauru, São Paulo, Região Sudeste, Brasil"}, {"id": 44, "titulo": "Caso K11", "ano": 1969, "decada": 1960, "data_ocorrencia": "1969-01-01", "cidade": "Nova Iguaçu", "estado": "Rio de Janeiro", "pais": "Brasil", "tipo_objeto": "Disco voador", "tem_seres": true, "link": "https://fenomenum.com.br/caso-k11/", "resumo": "No início de abril de 1969, em Nova Iguaçu (RJ), João David de Souza estava no terraço de sua casa quando viu um objeto luminoso cair nas encostas do morro Maxambomba, próximo ao km 11 da antiga rodovia Rio-São Paulo. De início pensou em um pequeno avião em pane, pois o objeto girava como um pião e soltava fumaça, mas depois percebeu que ele ficou pousado em posição oblíqua. Duas pequenas criaturas teriam saído do aparelho e examinado sua parte externa. João chamou familiares e vizinhos, enquanto algumas pessoas seguiram para o morro e os bombeiros foram avisados. Antes que a equipe chegasse, o objeto aumentou a luminosidade, encolheu visualmente até virar um ponto de luz, moveu-se lateralmente e desapareceu. No local, não foram encontrados vestígios.", "latitude": -22.7592175, "longitude": -43.4508728, "map_latitude": -22.7592175, "map_longitude": -43.4508728, "cor": "hsl(15.3, 88%, 58%)", "endereco": "Nova Iguaçu, Rio de Janeiro, Região Sudeste, Brasil"}, {"id": 45, "titulo": "Caso Tiago Machado", "ano": 1969, "decada": 1960, "data_ocorrencia": "1969-02-06", "cidade": "Pirassununga", "estado": "São Paulo", "pais": "Brasil", "tipo_objeto": "Disco voador", "tem_seres": true, "link": "https://fenomenum.com.br/caso-tiago-machado/", "resumo": "Em 6 de fevereiro de 1969, no bairro Pinheiro, em Pirassununga (SP), moradores viram um objeto luminoso descer em uma área de mata. Tiago Machado, então com 19 anos, foi até o local com um binóculo e encontrou uma nave metálica arredondada, de cerca de 1,50 m de altura. Uma porta se abriu e dois pequenos tripulantes flutuaram até o solo, enquanto outros dois observavam de dentro. Eles tinham cerca de 1,50 m, roupas aluminizadas, visor transparente, pele amarelada, olhos escuros sem pupila aparente e cicatrizes nas bochechas. Tiago tentou comunicação por gestos e chegou a oferecer cigarros, que um dos seres recolheu de modo estranho. Após cerca de 15 minutos, os tripulantes recuaram para a nave; um deles disparou uma chama azul na coxa do jovem, que perdeu os sentidos. No local, depois foram observadas marcas circulares na vegetação e três buracos associados ao pouso.", "latitude": -21.9980468, "longitude": -47.4280861, "map_latitude": -21.9980468, "map_longitude": -47.4280861, "cor": "hsl(152.8, 88%, 58%)", "endereco": "Pirassununga, São Paulo, Região Sudeste, Brasil"}, {"id": 47, "titulo": "O Caso dos Mata-Formigas", "ano": 1969, "decada": 1960, "data_ocorrencia": "1969-02-06", "cidade": "Pirassununga", "estado": "São Paulo", "pais": "Brasil", "tipo_objeto": "Disco voador", "tem_seres": true, "link": "https://fenomenum.com.br/o-caso-dos-mata-formigas/", "resumo": "Em 6 de fevereiro de 1969, na Chácara dos Morais, em Pirassununga (SP), Bárbara Mina da Silva trabalhava em uma plantação de arroz quando dois meninos chamaram sua atenção para uma espécie de “barraquinha” reluzente a cerca de 500 metros. A testemunha viu uma forma triangular e três homens de capacete nas proximidades, imaginando tratar-se de trabalhadores combatendo formigas saúvas. Os garotos, porém, insistiram que as roupas brilhavam intensamente. Pouco depois, a suposta barraca e os homens desapareceram, e os meninos apontaram uma bola luminosa, do tamanho aparente do Sol, parada acima do mato. A luz permaneceu por cerca de meia hora e desapareceu. O episódio ocorreu no mesmo dia e na mesma região do contato vivido por Tiago Machado, reforçando a sequência de relatos ufológicos registrados em Pirassununga naquele período.", "latitude": -21.9980468, "longitude": -47.4280861, "map_latitude": -21.9980468, "map_longitude": -47.4280861, "cor": "hsl(290.4, 88%, 58%)", "endereco": "Pirassununga, São Paulo, Região Sudeste, Brasil"}, {"id": 48, "titulo": "Pouso na Fazenda Bela Aliança", "ano": 1969, "decada": 1960, "data_ocorrencia": "1969-02-06", "cidade": "Pirassununga", "estado": "São Paulo", "pais": "Brasil", "tipo_objeto": "Disco voador", "tem_seres": true, "link": "https://fenomenum.com.br/pouso-na-fazenda-bela-alianca/", "resumo": "Em 6 de fevereiro de 1969, ao anoitecer, José Antônio Fioco, administrador da Fazenda Bela Aliança, a cerca de 8 km de Pirassununga (SP), ouviu os porcos agitados e saiu para verificar. A aproximadamente 20 metros da casa, viu uma nave pousar apoiada em tripé, com cerca de 5 metros de altura por 4 de largura. De uma abertura surgiram três tripulantes, que permaneceram em uma balaustrada ao redor do aparelho. Eles tinham cerca de 1,60 m, roupas inteiriças com grandes botões no peito e calçados de aparência metálica. Um portava um tubo que projetava luz até o galinheiro distante, outro observava por um aparelho parecido com câmera e o terceiro segurava um bastão mais grosso, vigiando o entorno. Quando Fioco tentou chamar testemunhas e a porteira rangeu, a nave decolou e desapareceu em poucos segundos.", "latitude": -21.9980468, "longitude": -47.4280861, "map_latitude": -21.9980468, "map_longitude": -47.4280861, "cor": "hsl(67.9, 88%, 58%)", "endereco": "Pirassununga, São Paulo, Região Sudeste, Brasil"}, {"id": 49, "titulo": "Tripulantes Atacam em Pirassununga (SP)", "ano": 1969, "decada": 1960, "data_ocorrencia": "1969-02-12", "cidade": "Pirassununga", "estado": "São Paulo", "pais": "Brasil", "tipo_objeto": "Não identificado", "tem_seres": true, "link": "https://fenomenum.com.br/tripulantes-atacam-em-pirassununga-sp/", "resumo": "Em 12 de fevereiro de 1969, em Pirassununga (SP), o lavrador Luiz Flauzino de Oliveira seguia cedo para a roça de arroz quando ouviu ruídos na mata e foi agarrado por trás. Ele relatou ter sido arremessado contra um barranco por dois seres pequenos, com cerca de 1,40 m, olhos assimétricos, barba e cabelos negros muito compridos, pele clara e roupas simples compostas por calção, blusa branca e pequenas botas pretas. Durante a luta, os seres demonstraram força e agilidade incomuns, comunicando-se em uma língua desconhecida. Flauzino conseguiu derrubá-los com uma rasteira, após o que os dois disseram em português que iriam embora porque não podiam com ele. O cão da testemunha, chamado Nervoso, tentou atacar os seres, mas caiu uivando e depois ficou tonto; no local, a polícia encontrou vestígios de luta.", "latitude": -21.9980468, "longitude": -47.4280861, "map_latitude": -21.9980468, "map_longitude": -47.4280861, "cor": "hsl(205.4, 88%, 58%)", "endereco": "Pirassununga, São Paulo, Região Sudeste, Brasil"}, {"id": 46, "titulo": "O Caso de Bebedouro (MG)", "ano": 1969, "decada": 1960, "data_ocorrencia": "1969-05-04", "cidade": "Bebedouro", "estado": "Minas Gerais", "pais": "Brasil", "tipo_objeto": "Não identificado", "tem_seres": true, "link": "https://fenomenum.com.br/o-caso-de-bebedouro-mg/", "resumo": "Em 4 de maio de 1969, em Bebedouro, próximo a Matozinhos (MG), o soldado da Polícia Militar José Antônio da Silva pescava em uma lagoa quando foi atingido por um facho de luz esverdeada no centro e avermelhada nas bordas. Paralisado, foi levado por dois seres de cerca de 1,20 m até um aparelho em forma de carretel, com plataformas circulares e compartimento interno iluminado. Os tripulantes usavam roupas claras, capacetes rígidos com orifícios nos olhos e tubos ligados a pequenos bujões nas costas. Durante a viagem, José teve dificuldade de respirar e depois foi conduzido a um salão onde viu seres sem capacete, de cabelos avermelhados, barbas longas, orelhas pontudas e boca larga. Eles tentaram se comunicar por gestos, desenhos e palavras repetidas, parecendo pedir ajuda relacionada a armas terrestres. Após recusar-se a acompanhá-los, José foi devolvido perto de Vitória (ES), ferido e desorientado, em 9 de maio.", "latitude": -19.1205068, "longitude": -44.0016067, "map_latitude": -19.1205068, "map_longitude": -44.0016067, "cor": "hsl(342.9, 88%, 58%)", "endereco": "Bebedouro, Jequitibá, Minas Gerais, Região Sudeste, Brasil"}, {"id": 43, "titulo": "Abdução na Vila Operária", "ano": 1969, "decada": 1960, "data_ocorrencia": "1969-05-20", "cidade": "Nova Lima", "estado": "Minas Gerais", "pais": "Brasil", "tipo_objeto": "Não identificado", "tem_seres": true, "link": "https://fenomenum.com.br/abducao-na-vila-operaria/", "resumo": "Em 20 de maio de 1969, por volta de 1h da madrugada, José Pereira Sacramento, morador da Vila Operária em Nova Lima (MG), acordou com um ruído que associou à sua lambreta. Ao sair para verificar, viu um reflexo circular de luz no quintal e, em seguida, um objeto enorme descer silenciosamente diante da casa. Paralisado, José disse ter sido atraído para uma abertura e levado a um compartimento circular iluminado. Ali observou seis seres de cerca de 80 cm, posicionados de bruços em cilindros, com corpos cobertos por material transparente e linguagem semelhante a guinchos agudos. Quando um deles acionou uma peça no painel, a luz aumentou até José perder a consciência. Ele acordou às 6h em sua cama, com dores no ombro, olhos vermelhos, pálpebras inchadas e dificuldades de visão que teriam persistido por semanas.", "latitude": -19.9854089, "longitude": -43.8470691, "map_latitude": -19.9854089, "map_longitude": -43.8470691, "cor": "hsl(120.4, 88%, 58%)", "endereco": "Nova Lima, Minas Gerais, Região Sudeste, Brasil"}, {"id": 50, "titulo": "Abdução em Pelotas – Caso José Inácio Álvaro", "ano": 1970, "decada": 1970, "data_ocorrencia": "1970-01-01", "cidade": "Pelotas", "estado": "Rio Grande do Sul", "pais": "Brasil", "tipo_objeto": "Objeto luminoso", "tem_seres": true, "link": "https://fenomenum.com.br/abducao-em-pelotas-caso-jose-inacio-alvaro/", "resumo": "Na noite de 2 para 3 de março de 1978, em Pelotas (RS), José Inácio Álvaro e outras testemunhas viram um objeto luminoso circular no céu durante uma falta de energia no bairro Simões Lopes. Mais tarde, depois de passar pelo centro da cidade e retornar à casa do pai, José Inácio observou o mesmo objeto se aproximar e emitir um facho de luz em sua direção. Ele relatou ter recebido imagens mentais de guerras, mortes e conflitos familiares, ficando como que hipnotizado. A lembrança seguinte foi acordar em um capinzal, a cerca de 1 km da casa, tonto e ouvindo uma voz mental dizer que uma tarefa estava se cumprindo. Ao voltar, encontrou a casa aberta e as luzes acesas, percebendo um intervalo de mais de uma hora sem explicação. Depois, já em casa, ouviu novamente a frase “tua tarefa foi cumprida” e procurou investigação ufológica, que incluiu sessões de hipnose regressiva.", "latitude": -31.7699736, "longitude": -52.3410161, "map_latitude": -31.7699736, "map_longitude": -52.3410161, "cor": "hsl(257.9, 88%, 58%)", "endereco": "Pelotas, Rio Grande do Sul, Região Sul, Brasil"}, {"id": 52, "titulo": "O Caso do Bezerro Arrebatado", "ano": 1970, "decada": 1970, "data_ocorrencia": "1970-01-01", "cidade": "Alegrete", "estado": "Rio Grande do Sul", "pais": "Brasil", "tipo_objeto": "Não identificado", "tem_seres": false, "link": "https://fenomenum.com.br/o-caso-do-bezerro-arrebatado/", "resumo": "No fim de outubro de 1970, na estância Palma Velha, a cerca de 18 quilômetros de Alegrete (RS), Pedro Trajano Machado e seu filho Eurípedes cuidavam do gado quando notaram forte inquietação dos animais. A vaca que haviam separado começou a mugir e a olhar repetidamente para o filhote, um bezerro de cerca de um mês e aproximadamente 20 quilos. Ao se voltar, Pedro viu o animal suspenso no ar, a cerca de 1 metro do chão, com as patas voltadas para baixo. Segundo as testemunhas, o bezerro deslocou-se lentamente por baixo de galhos, afastou-se da mãe e depois iniciou uma subida vertical de três a quatro minutos, até desaparecer no alto, sem ruído, vento ou mudança perceptível de temperatura. O animal não foi recuperado, e o caso foi investigado como um relato raro de possível arrebatamento animal.", "latitude": -29.790166, "longitude": -55.794862, "map_latitude": -29.790166, "map_longitude": -55.794862, "cor": "hsl(35.4, 88%, 58%)", "endereco": "Alegrete, Rio Grande do Sul, Região Sul, Brasil"}, {"id": 51, "titulo": "O Caso da Barragem do Funil", "ano": 1970, "decada": 1970, "data_ocorrencia": "1970-08-30", "cidade": "Resende", "estado": "Rio de Janeiro", "pais": "Brasil", "tipo_objeto": "Não identificado", "tem_seres": false, "link": "https://fenomenum.com.br/o-caso-da-barragem-do-funil/", "resumo": "Na noite de 30 de agosto de 1970, na Barragem do Funil, em Resende (RJ), o guarda Almiro Martins de Freitas fazia ronda na área da subestação quando foi surpreendido por um objeto em forma de charuto, estimado em cerca de 20 metros de comprimento. Após perceber faíscas nos transformadores e a aproximação do objeto, Almiro teria disparado duas vezes contra ele e, em seguida, foi atingido por uma luz intensa que o deixou paralisado e sem visão. A testemunha relatou forte suor, sensação de onda refrescante pelo corpo e recuperação gradual dos movimentos, mas continuou temporariamente cega e precisou gritar por socorro para evitar caminhar às cegas perto dos transformadores e do Rio Paraíba. Colegas o encontraram com a arma em punho e o levaram em busca de atendimento médico, enquanto o episódio passou a ser lembrado pelos efeitos fisiológicos atribuídos ao contato.", "latitude": -22.4418699, "longitude": -44.4204847, "map_latitude": -22.4418699, "map_longitude": -44.4204847, "cor": "hsl(172.9, 88%, 58%)", "endereco": "Resende, Rio de Janeiro, Região Sudeste, Brasil"}, {"id": 53, "titulo": "Revoada de UFOs na Região Sudeste", "ano": 1970, "decada": 1970, "data_ocorrencia": "1970-11-24", "cidade": "Rio de Janeiro", "estado": "Rio de Janeiro", "pais": "Brasil", "tipo_objeto": "Objeto luminoso", "tem_seres": false, "link": "https://fenomenum.com.br/revoada-de-ufos-na-regiao-sudeste/", "resumo": "Em 24 de novembro de 1970, uma ampla onda de avistamentos atingiu cidades do Rio de Janeiro, São Paulo e Minas Gerais. A partir do fim da tarde, luzes e objetos luminosos foram relatados em Barra Mansa, Miracema, Santo Antônio de Pádua, Itaocara, Caconde, Belo Horizonte, Varginha, Andrelândia, Bicas e Sete Lagoas, com maior concentração de testemunhas na cidade do Rio de Janeiro. Na capital fluminense, moradores e motoristas observaram uma forte luz azulada sobre áreas como Jardim Botânico, Lagoa Rodrigo de Freitas e Ipanema. Durante treinamento da Força Aérea Brasileira a partir da Base Aérea de Santa Cruz, militares também relataram um objeto ovalado, luminoso e de manobras erráticas sobre a região entre Campo Grande e Recreio dos Bandeirantes. O caso ganhou repercussão em jornais e foi associado a centenas de testemunhas na Região Sudeste.", "latitude": -22.9110137, "longitude": -43.2093727, "map_latitude": -22.9110137, "map_longitude": -43.2093727, "cor": "hsl(310.4, 88%, 58%)", "endereco": "Rio de Janeiro, Região Sudeste, Bra ete Lagoas, Minas Gerais, Região Sudeste, Brasil"}, {"id": 57, "titulo": "OVNI Acompanha Ônibus em Itaperuna (RJ)", "ano": 1971, "decada": 1970, "data_ocorrencia": "1971-01-01", "cidade": "Itaperuna", "estado": "Rio de Janeiro", "pais": "Brasil", "tipo_objeto": "Disco voador", "tem_seres": false, "link": "https://fenomenum.com.br/ovni-acompanha-onibus-em-itaperuna-rj/", "resumo": "Em outubro de 1971, um ônibus que fazia o trajeto entre Campos e Itaperuna (RJ) teria sido acompanhado por um objeto luminoso durante cerca de 31 km. À altura da Fazenda Santa Ictéria, depois de Italva, o cobrador e o motorista notaram uma luz entre vermelho vivo e amarelo alaranjado, com cerca de 2 metros de diâmetro aparente. O motorista parou o veículo, acordou os passageiros e todos puderam observar o objeto parado no céu. Quando a viagem continuou, a luz acompanhou o ônibus, fazendo evoluções à frente do veículo. Por sugestão de um passageiro, o motorista piscou os faróis; a cada sinal, o objeto desaparecia rapidamente e reaparecia minutos depois. O episódio atrasou a chegada a Itaperuna e ainda teria sido observado por pessoas na rodoviária e nas ruas da cidade.", "latitude": -21.215816, "longitude": -41.879813, "map_latitude": -21.215816, "map_longitude": -41.879813, "cor": "hsl(87.9, 88%, 58%)", "endereco": "Itaperuna, Região Geográfica Imediata de Itaperuna, Região Geográfica Intermediária de Campos dos Goytacazes, Rio de Janeiro, Região Sudeste, Brasil"}, {"id": 58, "titulo": "UFO é Fotografado no Rio de Janeiro (RJ)", "ano": 1971, "decada": 1970, "data_ocorrencia": "1971-01-01", "cidade": "Rio de Janeiro", "estado": "Rio de Janeiro", "pais": "Brasil", "tipo_objeto": "Disco voador", "tem_seres": false, "link": "https://fenomenum.com.br/ufo-e-fotografado-no-rio-de-janeiro-rj/", "resumo": "Em 1º ou 2 de outubro de 1971, na Vila Cardoso, rua Bomfim, bairro de São Cristóvão, no Rio de Janeiro (RJ), um pequeno disco luminoso foi observado por moradores no início da noite. Vânia, de 9 anos, e sua madrinha Vera, de 21, foram as primeiras a notar o objeto aproximando-se lentamente, sem ruído, com apêndices luminosos em cores como amarelo, azul e vermelho. Ao perceberem que não se tratava de avião ou helicóptero, correram para dentro da vila chamando outras pessoas, enquanto o objeto as acompanhava por cima dos telhados. Cerca de dez moradores teriam visto o fenômeno, e Nelson Schubsky, fotógrafo amador presente no local, registrou duas imagens antes de o disco se afastar e subir até sumir atrás dos edifícios. O objeto foi descrito como pequeno, com cerca de 2 a 3 metros de diâmetro, e reaparecimentos teriam ocorrido nos meses seguintes.", "latitude": -22.9110137, "longitude": -43.2093727, "map_latitude": -22.9110137, "map_longitude": -43.2093727, "cor": "hsl(225.4, 88%, 58%)", "endereco": "Rio de Janeiro, Região Sudeste, Brasil"}, {"id": 54, "titulo": "Caso Benedito Miranda", "ano": 1971, "decada": 1970, "data_ocorrencia": "1971-02-25", "cidade": "Itaperuna", "estado": "Rio de Janeiro", "pais": "Brasil", "tipo_objeto": "Não identificado", "tem_seres": true, "link": "https://fenomenum.com.br/caso-benedito-miranda/", "resumo": "Em 25 de fevereiro de 1971, na região de Itaperuna (RJ), o caminhoneiro Benedito Miranda relatou ter encontrado um objeto redondo bloqueando a estrada durante a madrugada. Segundo seu depoimento, pequenos seres saíram do aparelho e ele perdeu a consciência, acordando depois em outro ponto e com lembranças fragmentadas do interior da nave. O caso ocorreu em uma fase de intensa atividade ufológica na região e passou a ser citado como uma das abduções brasileiras mais conhecidas.", "latitude": -21.215816, "longitude": -41.879813, "map_latitude": -21.215816, "map_longitude": -41.879813, "cor": "hsl(2.9, 88%, 58%)", "endereco": "Itaperuna, Região Geográfica Imediata de Itaperuna, Região Geográfica Intermediária de Campos dos Goytacazes, Rio de Janeiro, Região Sudeste, Brasil"}, {"id": 56, "titulo": "Disco Voador Pousa em Itaperuna (RJ)", "ano": 1971, "decada": 1970, "data_ocorrencia": "1971-09-20", "cidade": "Itaperuna", "estado": "Rio de Janeiro", "pais": "Brasil", "tipo_objeto": "Disco voador", "tem_seres": true, "link": "https://fenomenum.com.br/disco-voador-pousa-em-itaperuna-rj/", "resumo": "Em 20 de setembro de 1971, em Itaperuna (RJ), Manuel da Silva e Souza, administrador de um campo de aviação, percebeu ao anoitecer uma luz intensa se aproximando e pensou tratar-se de um avião. Ao sair para observar, viu a cerca de 100 metros uma nave ovalada ou arredondada, transparente e iluminada por luz azulada, já pousada no campo. Aproximando-se até uma cerca, notou um pequeno tripulante de aproximadamente 90 cm, roupa esverdeada e cabeça descoberta, dando uma volta ao redor do aparelho. Ao perceber a testemunha, o ser ficou imóvel por alguns minutos e depois levitou até a parte superior da nave, entrando por uma abertura como se afundasse na cúpula. Pela transparência do objeto, Manuel viu outros dois tripulantes sentados. Em seguida, o aparelho decolou e desapareceu atrás de morros distantes.", "latitude": -21.215816, "longitude": -41.879813, "map_latitude": -21.215816, "map_longitude": -41.879813, "cor": "hsl(140.4, 88%, 58%)", "endereco": "Itaperuna, Região Geográfica Imediata de Itaperuna, Região Geográfica Intermediária de Campos dos Goytacazes, Rio de Janeiro, Região Sudeste, Brasil"}, {"id": 55, "titulo": "Caso Paulo Caetano", "ano": 1971, "decada": 1970, "data_ocorrencia": "1971-09-23", "cidade": "Itaperuna", "estado": "Rio de Janeiro", "pais": "Brasil", "tipo_objeto": "Disco voador", "tem_seres": true, "link": "https://fenomenum.com.br/caso-paulo-caetano/", "resumo": "Em 23 de setembro de 1971, Paulo Caetano Silveira voltava de Carangola para Itaperuna (RJ) quando começou a ser seguido por um objeto luminoso. O aparelho se aproximou de sua Vemaguet, circulou o carro e, mais tarde, na região de Bananeiras e Serraria, fez o veículo parar sem controle da testemunha. Paulo viu uma porta se abrir, um facho de luz atingi-lo e três pequenas criaturas, com cerca de 1 metro de altura e movimentos lentos, descerem do objeto. Ele foi conduzido para dentro por uma espécie de pá e relatou uma sala iluminada, teto hexagonal e um feixe amarelo oscilante, como se estivesse sendo examinado sem contato físico. Após retornar à estrada, foi encontrado fraco e desorientado. Nas semanas seguintes, afirmou ter vivido novos contatos, incluindo mensagens de tripulantes, suspensão por um raio de luz e fotografias de objetos luminosos na região de Itaperuna.", "latitude": -21.215816, "longitude": -41.879813, "map_latitude": -21.215816, "map_longitude": -41.879813, "cor": "hsl(278.0, 88%, 58%)", "endereco": "Itaperuna, Região Geográfica Imediata de Itaperuna, Região Geográfica Intermediária de Campos dos Goytacazes, Rio de Janeiro, Região Sudeste, Brasil"}, {"id": 59, "titulo": "OVNI Luminoso Sobre o Forte dos Andradas: Um Encontro Inexplicável no Litoral Paulista", "ano": 1973, "decada": 1970, "data_ocorrencia": "1973-01-01", "cidade": "Guarujá", "estado": "São Paulo", "pais": "Brasil", "tipo_objeto": "Objeto luminoso", "tem_seres": false, "link": "https://fenomenum.com.br/ovni-luminoso-sobre-o-forte-dos-andradas-um-encontro-inexplicavel-no-litoral-paulista/", "resumo": "Em uma madrugada de 1973, no Forte dos Andradas, no Guarujá (SP), o militar Luiz Silva estava de serviço durante chuva forte, vento e mar agitado quando um alarme indicou movimentação no posto voltado para o mar. Ao chegar, encontrou o sentinela nervoso apontando para um objeto de luz alaranjada que pairava sobre a água e se movia lentamente na horizontal. O sargento de dia também observou o fenômeno e a hipótese de farol foi descartada pelas testemunhas, que conheciam a luz branca e intermitente do Farol da Moela. O objeto permaneceu visível por cerca de cinco a dez minutos e, depois, acelerou verticalmente em silêncio, desaparecendo entre nuvens pesadas. Anos depois, Luiz relatou que outros militares lembravam do episódio e mencionavam ocorrências semelhantes na área do forte.", "latitude": -23.9927768, "longitude": -46.2558332, "map_latitude": -23.9927768, "map_longitude": -46.2558332, "cor": "hsl(55.5, 88%, 58%)", "endereco": "Guarujá, São Paulo, Região Sudeste, Brasil"}, {"id": 60, "titulo": "O Caso de Votorantim", "ano": 1974, "decada": 1970, "data_ocorrencia": "1974-05-23", "cidade": "Votorantim", "estado": "São Paulo", "pais": "Brasil", "tipo_objeto": "Objeto luminoso", "tem_seres": false, "link": "https://fenomenum.com.br/o-caso-de-votorantim/", "resumo": "Na noite de 23 de maio de 1974, em Votorantim (SP), operários da Fábrica de Cimentos Votorantim trabalhavam nas pedreiras próximas à Vila Santa Helena quando Rafael Fernandes dos Santos, operador de escavadeira, observou um objeto circular sobre a área. O aparelho tinha luzes verdes, amarelas e vermelhas nas bordas, dois focos inferiores semelhantes a holofotes e emitia um zumbido baixo. Depois de sobrevoar a pedreira, afastou-se, e Rafael avisou colegas que também passaram a acompanhar o fenômeno. A movimentação levou à paralisação parcial da fábrica e ao acionamento da polícia, que abriu investigação; as páginas do procedimento foram encaminhadas à Força Aérea Brasileira. O texto ainda relaciona o caso a outros avistamentos posteriores em Votorantim, especialmente na área que passou a ser chamada de Mirante dos OVNIs.", "latitude": -23.5380539, "longitude": -47.4422137, "map_latitude": -23.5380539, "map_longitude": -47.4422137, "cor": "hsl(193.0, 88%, 58%)", "endereco": "Votorantim, São Paulo, Região Sudeste, Brasil"}, {"id": 62, "titulo": "Contato Imediato em Brusque (SC)", "ano": 1976, "decada": 1970, "data_ocorrencia": "1976-09-03", "cidade": "Brusque", "estado": "Santa Catarina", "pais": "Brasil", "tipo_objeto": "Disco voador", "tem_seres": true, "link": "https://fenomenum.com.br/contato-imediato-em-brusque-sc/", "resumo": "Em 3 de setembro de 1976, em Brusque (SC), o lavrador João Romeu Klein, então com 19 anos, voltava para casa por volta das 19h quando viu um objeto em forma de prato fundo girando lentamente e mudando a cor do foco superior conforme se deslocava. O aparelho, cinza e com cerca de 3 metros de diâmetro, passou sobre sua cabeça, parou à frente e projetou pela base um facho vermelho pelo qual desceram três pequenos tripulantes de aproximadamente 1 metro. Os seres alinharam-se no caminho como se bloqueassem a passagem, comunicando-se em língua desconhecida, enquanto a nave recuava e pairava perto das árvores. João arremessou uma faca na direção deles, mas o objeto desviou no ar; em resposta, o tripulante central apontou um bastão e emitiu um feixe azul claro que atingiu sua coxa esquerda. Ele desmaiou e foi encontrado depois com a perna enrijecida, sendo levado ao Hospital Azambuja.", "latitude": -27.0964628, "longitude": -48.9136323, "map_latitude": -27.0964628, "map_longitude": -48.9136323, "cor": "hsl(330.5, 88%, 58%)", "endereco": "Brusque, Santa Catarina, Região Sul, Brasil"}, {"id": 61, "titulo": "Caso Hermelindo da Silva", "ano": 1976, "decada": 1970, "data_ocorrencia": "1976-09-09", "cidade": "Vargem Grande", "estado": "Minas Gerais", "pais": "Brasil", "tipo_objeto": "OVNI", "tem_seres": true, "link": "https://fenomenum.com.br/caso-hermelindo-da-silva/", "resumo": "Em 9 de setembro de 1976, por volta das 2h, em Vargem Grande (MG), o comerciante Hermelindo da Silva voltava do bar para casa quando um objeto luminoso surgiu sobre ele, emitindo clarão e zumbido. O cão que o acompanhava ficou agressivo e depois fugiu assustado. Hermelindo tentou se abrigar, mas o objeto reacendeu e dele desceram cabos com ganchos, além de um pequeno ser de cerca de 1 metro, vestido com uniforme cinza rígido e brilhante. A criatura tentou prender a testemunha aos ganchos, e os dois entraram em luta corporal por vários minutos. Um gancho agarrou o tornozelo de Hermelindo, que foi içado de cabeça para baixo em direção a uma abertura quente na parte inferior do objeto. Seu cunhado viu a cena da janela. Perto da abertura, Hermelindo apoiou o pé no aparelho, soltou-se e caiu de cerca de 6 metros sobre uma planta cortante, chegando em casa com cortes, inchaço e hematomas.", "latitude": -22.3212428, "longitude": -44.726787, "map_latitude": -22.3212428, "map_longitude": -44.726787, "cor": "hsl(108.0, 88%, 58%)", "endereco": "Vargem Grande, Itamonte, Minas Gerais, Região Sudeste, Brasil"}, {"id": 63, "titulo": "Caso Chupa-Chupa e Operação Prato", "ano": 1977, "decada": 1970, "data_ocorrencia": "1977-01-01", "cidade": "Colares", "estado": "Pará", "pais": "Brasil", "tipo_objeto": "OVNI", "tem_seres": false, "link": "https://fenomenum.com.br/caso-chupa-chupa-e-operacao-prato/", "resumo": "A partir de 1977, moradores de Colares e de outras localidades do Pará relataram ataques de luzes conhecidas como chupa-chupa, que se aproximavam durante a noite e emitiam feixes capazes de causar queimaduras, fraqueza e marcas no corpo. A quantidade de relatos levou a Força Aérea Brasileira a realizar a Operação Prato, com militares coletando depoimentos, fotos e observações de campo. O caso se tornou um dos maiores episódios ufológicos do Brasil por envolver população civil, efeitos físicos e investigação oficial.", "latitude": -0.936423, "longitude": -48.280254, "map_latitude": -0.936423, "map_longitude": -48.280254, "cor": "hsl(245.5, 88%, 58%)", "endereco": "Colares, Região Geográfica Imediata de Belém, Região Geográfica Intermediária de Belém, Pará, Região Norte, 68785-000, Brasil"}, {"id": 65, "titulo": "Gravações do CINDACTA registram OVNIs na região Sudeste", "ano": 1977, "decada": 1970, "data_ocorrencia": "1977-05-21", "cidade": "São José dos Campos", "estado": "São Paulo", "pais": "Brasil", "tipo_objeto": "OVNI", "tem_seres": false, "link": "https://fenomenum.com.br/gravacoes-do-cindacta-registram-ovnis-na-regiao-sudeste/", "resumo": "Na noite de 21 de maio de 1977, pilotos de várias aeronaves comerciais relataram luzes e objetos não identificados em trechos entre São Paulo, Minas Gerais, Espírito Santo, Goiás e Bahia. A movimentação teria sido acompanhada por radares do CINDACTA, em Brasília, com registros de áudio das comunicações entre controladores e tripulações. O material mencionado na matéria reúne casos em São José dos Campos, no litoral, em Belo Horizonte e em Anápolis, além de análises sobre a operação do sistema de defesa aérea e controle de tráfego. A importância do episódio está na combinação de testemunhas qualificadas, acompanhamento radar e documentação ligada ao controle aéreo brasileiro, em um período de intensificação dos registros oficiais de OVNIs.", "latitude": -23.1867782, "longitude": -45.8854538, "map_latitude": -23.1867782, "map_longitude": -45.8854538, "cor": "hsl(23.0, 88%, 58%)", "endereco": "São José dos Campos, São Paulo, Região Sudeste, Brasil"}, {"id": 65, "titulo": "Gravações do CINDACTA registram OVNIs na região Sudeste", "ano": 1977, "decada": 1970, "data_ocorrencia": "1977-05-21", "cidade": "Rio de Janeiro", "estado": "Rio de Janeiro", "pais": "Brasil", "tipo_objeto": "OVNI", "tem_seres": false, "link": "https://fenomenum.com.br/gravacoes-do-cindacta-registram-ovnis-na-regiao-sudeste/", "resumo": "Na noite de 21 de maio de 1977, pilotos de várias aeronaves comerciais relataram luzes e objetos não identificados em trechos entre São Paulo, Minas Gerais, Espírito Santo, Goiás e Bahia. A movimentação teria sido acompanhada por radares do CINDACTA, em Brasília, com registros de áudio das comunicações entre controladores e tripulações. O material mencionado na matéria reúne casos em São José dos Campos, no litoral, em Belo Horizonte e em Anápolis, além de análises sobre a operação do sistema de defesa aérea e controle de tráfego. A importância do episódio está na combinação de testemunhas qualificadas, acompanhamento radar e documentação ligada ao controle aéreo brasileiro, em um período de intensificação dos registros oficiais de OVNIs.", "latitude": -22.9110137, "lon r": "hsl(23.0, 88%, 58%)", "endereco": "Anápolis, Região Geográfica Imediata de Anápolis, Região Geográfica Intermediária de Goiânia, Goiás, Região Centro-Oeste, Brasil"}, {"id": 65, "titulo": "Gravações do CINDACTA registram OVNIs na região Sudeste", "ano": 1977, "decada": 1970, "data_ocorrencia": "1977-05-21", "cidade": "Brasília", "estado": "Distrito Federal", "pais": "Brasil", "tipo_objeto": "OVNI", "tem_seres": false, "link": "https://fenomenum.com.br/gravacoes-do-cindacta-registram-ovnis-na-regiao-sudeste/", "resumo": "Na noite de 21 de maio de 1977, pilotos de várias aeronaves comerciais relataram luzes e objetos não identificados em trechos entre São Paulo, Minas Gerais, Espírito Santo, Goiás e Bahia. A movimentação teria sido acompanhada por radares do CINDACTA, em Brasília, com registros de áudio das comunicações entre controladores e tripulações. O material mencionado na matéria reúne casos em São José dos Campos, no litoral, em Belo Horizonte e em Anápolis, além de análises sobre a operação do sistema de defesa aérea e controle de tráfego. A importância do episódio está na combinação de testemunhas qualificadas, acompanhamento radar e documentação ligada ao controle aéreo brasileiro, em um período de intensificação dos registros oficiais de OVNIs.", "latitude": -15.7939869, "longitude": -47.8828, "map_latitude": -15.7939869, "map_longitude": -47.8828, "cor": "hsl(23.0, 88%, 58%)", "endereco": "Brasília, Plano Piloto, Região Geográfica Intermediária do Distrito Federal, Distrito Federal, Região Centro-Oeste, 70391-900, Brasil"}, {"id": 67, "titulo": "O Polêmico Caso Paciência", "ano": 1977, "decada": 1970, "data_ocorrencia": "1977-10-04", "cidade": "Paciência", "estado": "Rio de Janeiro", "pais": "Brasil", "tipo_objeto": "Disco voador", "tem_seres": true, "link": "https://fenomenum.com.br/o-polemico-caso-paciencia/", "resumo": "Na madrugada de 19 de setembro de 1977, em Paciência, bairro da zona oeste do Rio de Janeiro, o motorista de ônibus Antônio Bogado La Rubia saiu de casa para iniciar o trabalho quando teria sido interceptado a cerca de 500 metros de sua residência. Segundo seu relato, foi levado para um disco voador por criaturas de aparência incomum, descritas como possíveis entidades unipedais ou robóticas, e permaneceu cerca de uma hora submetido a uma experiência marcada por silêncio, imagens projetadas e forte estranhamento. Em um momento, ao conseguir gritar, os ocupantes teriam sido derrubados como se sofressem uma onda de choque. Após ser libertado alguns quilômetros adiante, Antônio tentou seguir sua rotina, mas apresentou febre alta e outros efeitos físicos, o que levou pesquisadores da SBEDV a investigarem o episódio em várias entrevistas entre 1977 e 1978.", "latitude": -22.8987, "longitude": -43.6369556, "map_latitude": -22.8987, "map_longitude": -43.6369556, "cor": "hsl(160.5, 88%, 58%)", "endereco": "Paciência, Rio de Janeiro, Região Sudeste, Brasil"}, {"id": 66, "titulo": "O Gigante de Paty do Alferes (RJ)", "ano": 1977, "decada": 1970, "data_ocorrencia": "1977-10-31", "cidade": "Paty do Alferes", "estado": "Rio de Janeiro", "pais": "Brasil", "tipo_objeto": "Disco voador", "tem_seres": true, "link": "https://fenomenum.com.br/o-gigante-de-paty-do-alferes-rj/", "resumo": "Em 31 de outubro de 1977, na rua Belvedere, em Paty do Alferes (RJ), Moacir Elias de França, conhecido como Moacir Baiano, saiu de casa para ir ao velório de um amigo quando foi abordado por um ser de aparência humana com cerca de 3 metros de altura. Segundo seu relato, a criatura conversou com ele e o levou até um disco voador pousado em um descampado próximo. No dia seguinte, o mesmo ser teria aparecido dentro da casa da testemunha, tornando o caso conhecido pelo relato do 'gigante' de Paty do Alferes.", "latitude": -22.3775383, "longitude": -43.3970506, "map_latitude": -22.3775383, "map_longitude": -43.3970506, "cor": "hsl(298.0, 88%, 58%)", "endereco": "Paty do Alferes, Rio de Janeiro, Região Sudeste, 26980-000, Brasil"}, {"id": 64, "titulo": "Caso Joaquim Murtinho", "ano": 1977, "decada": 1970, "data_ocorrencia": "1977-11-02", "cidade": "Joaquim Murtinho", "estado": "Minas Gerais", "pais": "Brasil", "tipo_objeto": "Não identificado", "tem_seres": true, "link": "https://fenomenum.com.br/caso-joaquim-murtinho/", "resumo": "Em 2 de novembro de 1977, em Joaquim Murtinho (MG), o jovem L.C.J.A., de 16 anos, estava sozinho na casa da tia assistindo televisão quando ouviu ruído de vento e passos dentro da residência. Um pequeno aparelho em forma de Saturno, com esfera azulada e anel dourado, entrou pela cozinha, aproximou-se da televisão e desligou o aparelho ao fazer o plugue sair da tomada. Pouco depois, um homem de mais de 2 metros apareceu ao lado do jovem e desapareceu após um gesto. No quintal, o rapaz viu o mesmo homem acompanhado de uma mulher e um menino; os três se comunicaram telepaticamente, chamando-o pelo nome e acalmando-o. Eles entraram na casa, examinaram móveis e objetos e depois conduziram o jovem para fora, onde ele percebeu uma grande escada ligada a um veículo. O homem foi descrito com capacete, antenas, pele amarelada, olhos azuis e roupa esverdeada; a mulher e o menino tinham aparência mais comum.", "latitude": -20.5573832, "longitude": -43.8142099, "map_latitude": -20.5573832, "map_longitude": -43.8142099, "cor": "hsl(75.5, 88%, 58%)", "endereco": "Joaquim Murtinho, Alto Maranhão, Congonhas, Minas Gerais, Região Sudeste, Brasil"}, {"id": 68, "titulo": "A Onda Ufológica de 1978", "ano": 1978, "decada": 1970, "data_ocorrencia": "1978-03-12", "cidade": "São Paulo", "estado": "São Paulo", "pais": "Brasil", "tipo_objeto": "Disco voador", "tem_seres": false, "link": "https://fenomenum.com.br/a-onda-ufologica-de-1978/", "resumo": "Entre 11 e 13 de março de 1978, uma onda ufológica foi relatada em várias regiões do Brasil, com destaque para Rio de Janeiro, São Paulo e Brasília. Na madrugada principal, entre 1h e 2h, testemunhas descreveram discos ou formações luminosas sobre a capital fluminense, cidades serranas como Nova Friburgo e Teresópolis, São Gonçalo, Cabo Frio, Brasília, Goiânia, Santarém e Manaus. Em Brasília, moradores e tripulações de aviões comerciais da Varig e da Pan American relataram luzes incomuns, e jornais mencionaram possíveis registros em radar. Em São Paulo, os relatos foram ligados a um episódio anterior nas matas da Cantareira, onde teria havido queda ou explosão de objeto, seguido de buscas do COE. No Rio, dias depois, três objetos foram novamente observados sobre o Campo dos Afonsos, reforçando a ideia de uma onda nacional de avistamentos.", "latitude": -23.5506507, "longitude": -46.6333824, "map_latitude": -23.5506507, "map_longitude": -46.6333824, "cor": "hsl(213.0, 88%, 58%)", "endereco": "São Paulo, Região Sudeste, Brasil"}, {"id": 68, "titulo": "A Onda Ufológica de 1978", "ano": 1978, "decada": 1970, "data_ocorrencia": "1978-03-12", "cidade": "Rio de Janeiro", "estado": "Rio de Janeiro", "pais": "Brasil", "tipo_objeto": "Disco voador", "tem_seres": false, "link": "https://fenomenum.com.br/a-onda-ufologica-de-1978/", "resumo": "Entre 11 e 13 de março de 1978, uma onda ufológica foi relatada em várias regiões do Brasil, com destaque para Rio de Janeiro, São Paulo e Brasília. Na madrugada principal, entre 1h e 2h, testemunhas descreveram discos ou formações luminosas sobre a capital fluminense, cidades serranas como Nova Friburgo e Teresópolis, São Gonçalo, Cabo Frio, Brasília, Goiânia, Santarém e Manaus. Em Brasília, moradores e tripulações de aviões comerciais da Varig e da Pan American relataram luzes incomuns, e jornais mencionaram possíveis registros em radar. Em São Paulo, os relatos foram ligados a um episódio anterior nas matas da Cantareira, onde teria havido queda ou explosão de objeto, seguido de buscas do COE. No Rio, dias depois, três objetos foram novamente observados sobre o Campo dos Afonsos, reforçando a ideia de uma onda nacional de avistamentos.", "latitude": -22.9110137, "longitude": -43
