<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapa de Casos Ufológicos Brasileiros</title>
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="vendor/MarkerCluster.css">
  <link rel="stylesheet" href="vendor/MarkerCluster.Default.css">
  <style>
    .leaflet-pane,
    .leaflet-tile,
    .leaflet-marker-icon,
    .leaflet-marker-shadow,
    .leaflet-tile-container,
    .leaflet-pane > svg,
    .leaflet-pane > canvas,
    .leaflet-zoom-box,
    .leaflet-image-layer,
    .leaflet-layer {
      position: absolute;
      left: 0;
      top: 0;
    }
    .leaflet-container {
      overflow: hidden;
      touch-action: pan-x pan-y;
      outline: none;
    }
    .leaflet-container:focus,
    .leaflet-container *:focus,
    .leaflet-interactive:focus {
      outline: none !important;
    }
    .leaflet-zoom-box {
      display: none !important;
    }
    .leaflet-tile,
    .leaflet-marker-icon,
    .leaflet-marker-shadow {
      user-select: none;
      -webkit-user-drag: none;
    }
    .leaflet-tile {
      filter: inherit;
      visibility: hidden;
      border: 0;
    }
    .leaflet-tile-loaded {
      visibility: inherit;
    }
    .leaflet-zoom-animated {
      transform-origin: 0 0;
    }
    .leaflet-pane {
      z-index: 400;
    }
    .leaflet-tile-pane {
      z-index: 200;
    }
    .leaflet-overlay-pane {
      z-index: 400;
    }
    .leaflet-shadow-pane {
      z-index: 500;
    }
    .leaflet-marker-pane {
      z-index: 600;
    }
    .leaflet-tooltip-pane {
      z-index: 650;
    }
    .leaflet-popup-pane {
      z-index: 700;
    }
    .leaflet-control {
      position: relative;
      z-index: 800;
      float: left;
      clear: both;
      pointer-events: auto;
    }
    .leaflet-top,
    .leaflet-bottom {
      position: absolute;
      z-index: 1000;
      pointer-events: none;
    }
    .leaflet-top {
      top: 0;
    }
    .leaflet-right {
      right: 0;
    }
    .leaflet-bottom {
      bottom: 0;
    }
    .leaflet-left {
      left: 0;
    }
    .leaflet-right .leaflet-control {
      float: right;
      margin-right: 10px;
    }
    .leaflet-left .leaflet-control {
      margin-left: 10px;
    }
    .leaflet-top .leaflet-control {
      margin-top: 10px;
    }
    .leaflet-bottom .leaflet-control {
      margin-bottom: 10px;
    }
    .leaflet-control-zoom {
      border: 1px solid rgba(148,163,184,.28);
      border-radius: 8px;
      box-shadow: 0 8px 22px rgba(0,0,0,.42);
      overflow: hidden;
      background: rgba(15,23,42,.92);
    }
    .leaflet-control-zoom a {
      display: block;
      width: 32px;
      height: 32px;
      color: #e5f3ff;
      line-height: 31px;
      text-align: center;
      text-decoration: none;
      font: bold 18px/32px Arial, sans-serif;
      background: rgba(15,23,42,.92);
    }
    .leaflet-control-zoom a + a {
      border-top: 1px solid rgba(148,163,184,.22);
    }
    .leaflet-control-attribution {
      padding: 3px 7px;
      border-radius: 6px 0 0 0;
      background: rgba(2,6,23,.72);
      color: #94a3b8;
      font-size: 10px;
    }
    .leaflet-popup {
      position: absolute;
      text-align: center;
      margin-bottom: 20px;
    }
    .leaflet-popup-content-wrapper {
      text-align: left;
      background: #fff;
    }
    .leaflet-popup-content {
      line-height: 1.35;
    }
    .leaflet-popup-tip-container {
      position: absolute;
      left: 50%;
      width: 40px;
      height: 20px;
      margin-left: -20px;
      overflow: hidden;
      pointer-events: none;
    }
    .leaflet-popup-tip {
      width: 17px;
      height: 17px;
      padding: 1px;
      margin: -10px auto 0;
      transform: rotate(45deg);
      background: #fff;
      box-shadow: 0 3px 14px rgba(15,23,42,.22);
    }
    .leaflet-popup-close-button {
      position: absolute;
      top: 4px;
      right: 6px;
      width: 24px;
      height: 24px;
      color: #64748b;
      text-align: center;
      text-decoration: none;
      font: 18px/24px Arial, sans-serif;
      z-index: 2;
    }
    .leaflet-tooltip {
      position: absolute;
      white-space: nowrap;
      pointer-events: none;
      user-select: none;
    }
    :root {
      color-scheme: dark;
      --panel: rgba(7,11,22,.86);
      --panel-strong: rgba(10,16,31,.96);
      --line: rgba(148,163,184,.24);
      --ink: #f8fafc;
      --muted: #a3b3c7;
      --accent: #22d3ee;
      --accent-strong: #facc15;
      --shadow: 0 22px 60px rgba(0,0,0,.58);
    }
    html, body, #map {
      width: 100%;
      height: 100%;
      margin: 0;
      box-sizing: border-box;
    }
    *, *::before, *::after {
      box-sizing: inherit;
    }
    body {
      overflow: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 78% 18%, rgba(34,211,238,.20), transparent 30%),
        radial-gradient(circle at 35% 72%, rgba(56,189,248,.13), transparent 26%),
        linear-gradient(135deg, #09213a, #0f3150 45%, #071b31);
    }
    #map {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: #0c2942;
    }
    #map::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 350;
      pointer-events: none;
      background:
        radial-gradient(circle at 70% 18%, rgba(56,189,248,.18), transparent 35%),
        linear-gradient(0deg, rgba(14,52,85,.34), rgba(18,64,98,.28));
      mix-blend-mode: screen;
    }
    .leaflet-container {
      width: 100vw;
      height: 100vh;
      background: #0c2942;
    }
    .leaflet-tile-pane {
      filter: brightness(1.42) saturate(1.28) sepia(.12) hue-rotate(172deg);
    }
    .brazil-state {
      transition: fill .16s ease, stroke .16s ease;
      cursor: pointer;
    }
    .state-label {
      color: rgba(203,213,225,.82);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .08em;
      text-align: center;
      text-shadow:
        0 1px 2px rgba(2,6,23,.96),
        0 -1px 2px rgba(2,6,23,.96),
        1px 0 2px rgba(2,6,23,.96),
        -1px 0 2px rgba(2,6,23,.96);
      pointer-events: none;
    }
    .panel {
      position: fixed;
      left: 18px;
      top: 18px;
      bottom: 18px;
      z-index: 500;
      width: min(390px, calc(100vw - 36px));
      display: grid;
      grid-template-rows: auto auto 1fr;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      scrollbar-color: rgba(34,211,238,.55) rgba(15,23,42,.45);
    }
    .panel.collapsed {
      bottom: auto;
      width: min(390px, calc(100vw - 36px));
      grid-template-rows: auto;
    }
    .panel.collapsed .controls,
    .panel.collapsed .results {
      display: none;
    }
    .head {
      padding: 16px 16px 12px;
      border-bottom: 1px solid var(--line);
    }
    .title-row {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 12px;
    }
    h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.15;
      letter-spacing: 0;
    }
    .collapse {
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(15,23,42,.88);
      color: #e2e8f0;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
    }
    .stats {
      display: grid;
      grid-template-columns: 74px 1fr;
      gap: 8px;
      margin-top: 10px;
      align-items: stretch;
    }
    .stat-total,
    .chart-card {
      min-width: 0;
      border: 1px solid rgba(148,163,184,.18);
      border-radius: 7px;
      background: rgba(15,23,42,.54);
    }
    .stat-total {
      display: grid;
      align-content: center;
      padding: 8px;
    }
    .stat-total b {
      display: block;
      font-size: 24px;
      line-height: .9;
      letter-spacing: 0;
    }
    .stat-total span {
      display: block;
      margin-top: 4px;
      color: #dbeafe;
      font-size: 11px;
      font-weight: 750;
    }
    .stat-total small {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 9px;
      line-height: 1.15;
    }
    .charts {
      display: grid;
      gap: 5px;
    }
    .chart-card {
      display: grid;
      grid-template-columns: 88px 1fr 46px;
      gap: 8px;
      align-items: center;
      padding: 6px 8px;
    }
    .chart-head {
      display: contents;
      margin-bottom: 0;
      font-size: 10px;
      color: #dbeafe;
      font-weight: 750;
    }
    .chart-head span:first-child {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .chart-head span:last-child {
      color: var(--muted);
      font-weight: 650;
      text-align: right;
    }
    .stack-bar {
      display: flex;
      width: 100%;
      height: 6px;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(51,65,85,.72);
      box-shadow: inset 0 0 0 1px rgba(148,163,184,.15);
    }
    .stack-part {
      min-width: 2px;
      height: 100%;
    }
    .stack-part.main {
      background: linear-gradient(90deg, #22d3ee, #38bdf8);
    }
    .stack-part.alt {
      background: linear-gradient(90deg, #a855f7, #ec4899);
    }
    .stack-part.soft {
      background: linear-gradient(90deg, #64748b, #94a3b8);
    }
    .chart-legend {
      display: none;
    }
    .chart-legend span {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
    }
    .dot {
      width: 6px;
      height: 6px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: #22d3ee;
    }
    .dot.alt {
      background: #ec4899;
    }
    .dot.soft {
      background: #94a3b8;
    }
    .controls {
      display: grid;
      grid-template-columns: 1fr 132px;
      gap: 9px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
    }
    .controls .wide {
      grid-column: 1 / -1;
    }
    input, select {
      width: 100%;
      min-height: 38px;
      box-sizing: border-box;
      border: 1px solid rgba(148,163,184,.32);
      border-radius: 8px;
      padding: 9px 10px;
      background: rgba(15,23,42,.78);
      color: var(--ink);
      font: inherit;
      font-size: 13px;
      letter-spacing: 0;
    }
    input::placeholder {
      color: #94a3b8;
    }
    option {
      background: #0f172a;
      color: #e2e8f0;
    }
    input[type="checkbox"] {
      accent-color: var(--accent);
    }
    .switches {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #cbd5e1;
      font-size: 12px;
    }
    label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      user-select: none;
    }
    label input {
      width: auto;
      min-height: auto;
    }
    .results {
      overflow: auto;
      padding: 7px 0;
    }
    .case {
      width: 100%;
      display: grid;
      grid-template-columns: 17px 1fr;
      gap: 10px;
      padding: 10px 16px;
      border: 0;
      border-bottom: 1px solid rgba(15,23,42,.07);
      border-bottom-color: rgba(148,163,184,.12);
      background: transparent;
      color: inherit;
      text-align: left;
      cursor: pointer;
    }
    .case:hover {
      background: rgba(34,211,238,.11);
    }
    .swatch {
      width: 10px;
      height: 10px;
      margin-top: 4px;
      border: 1px solid rgba(248,250,252,.56);
      border-radius: 50%;
      background: var(--c);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--c), transparent 78%);
    }
    .case-title {
      display: block;
      font-size: 13px;
      font-weight: 750;
      line-height: 1.22;
    }
    .case-place {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
    }
    .case-date {
      display: inline-block;
      margin-top: 5px;
      color: #94a3b8;
      font-size: 11px;
    }
    .marker-pin {
      width: 14px;
      height: 14px;
      transform: translate(-7px, -7px);
      border: 1.5px solid rgba(226,245,255,.78);
      border-radius: 50%;
      background: var(--c);
      box-shadow:
        0 0 0 2px rgba(4,18,31,.54),
        0 0 8px color-mix(in srgb, var(--c), transparent 68%);
    }
    .marker-pin::after {
      display: none;
    }
    .leaflet-tooltip.case-label {
      border: 0;
      border-radius: 7px;
      padding: 5px 7px;
      background: rgba(2,6,23,.92);
      color: #e0f2fe;
      box-shadow: 0 6px 18px rgba(0,0,0,.45);
      font-size: 11px;
      font-weight: 700;
      line-height: 1.15;
    }
    .leaflet-popup-content-wrapper {
      border-radius: 10px;
      box-shadow: 0 14px 32px rgba(15,23,42,.24);
    }
    .leaflet-popup-content {
      min-width: 245px;
      margin: 14px 16px;
      font-size: 13px;
      line-height: 1.35;
    }
    .popup-title {
      margin-bottom: 8px;
      font-size: 15px;
      font-weight: 800;
      line-height: 1.2;
    }
    .popup-meta {
      margin: 4px 0;
      color: #334155;
    }
    .popup-link {
      display: inline-block;
      margin-top: 10px;
      color: #155e75;
      font-weight: 700;
      text-decoration: none;
    }
    .detail-panel {
      position: fixed;
      right: 18px;
      top: 18px;
      bottom: 18px;
      z-index: 520;
      width: min(420px, calc(100vw - 36px));
      display: grid;
      grid-template-rows: auto 1fr;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel-strong);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      scrollbar-color: rgba(34,211,238,.55) rgba(15,23,42,.45);
    }
    .detail-panel.hidden {
      display: none;
    }
    .detail-head {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 18px 13px;
      border-bottom: 1px solid var(--line);
    }
    .detail-title {
      margin: 0;
      font-size: 19px;
      line-height: 1.18;
      letter-spacing: 0;
    }
    .detail-close {
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(15,23,42,.88);
      color: #e2e8f0;
      cursor: pointer;
      font-size: 20px;
      line-height: 1;
    }
    .detail-body {
      overflow: auto;
      padding: 14px 18px 18px;
    }
    .detail-grid {
      display: grid;
      gap: 8px;
      margin-bottom: 14px;
    }
    .detail-row {
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 8px;
      font-size: 13px;
      line-height: 1.35;
    }
    .detail-row strong {
      color: #e2e8f0;
    }
    .detail-row span {
      color: #a3b3c7;
    }
    .detail-summary-title {
      margin: 15px 0 7px;
      font-size: 12px;
      font-weight: 800;
      color: #67e8f9;
      text-transform: uppercase;
      letter-spacing: .08em;
    }
    .detail-summary {
      margin: 0;
      color: #e5e7eb;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .cluster-icon {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border: 1px solid rgba(103,232,249,.72);
      border-radius: 50%;
      background: rgba(8,32,50,.78);
      color: #a5f3fc;
      box-shadow:
        0 0 0 1px rgba(3,16,27,.62),
        0 5px 14px rgba(2,6,23,.30);
      font-weight: 800;
      font-size: 11px;
    }
    @media (max-width: 720px) {
      .panel {
        left: 10px;
        right: 10px;
        top: 10px;
        bottom: auto;
        max-height: 46vh;
        width: auto;
      }
      .stats {
        grid-template-columns: 70px 1fr;
      }
      .controls {
        grid-template-columns: 1fr;
      }
      .detail-panel {
        left: 10px;
        right: 10px;
        top: auto;
        bottom: 10px;
        max-height: 48vh;
        width: auto;
      }
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <section class="panel" id="panel">
    <div class="head">
      <div class="title-row">
        <h1>Mapa de Casos Ufológicos Brasileiros</h1>
        <button class="collapse" id="collapse" type="button" title="Recolher painel">−</button>
      </div>
      <div class="stats" aria-label="Resumo visual dos casos">
        <div class="stat-total">
          <b>127</b>
          <span>casos</span>
          <small>174 pontos no mapa</small>
        </div>
        <div class="charts">
          <div class="chart-card" title="75 casos com seres e 52 sem seres">
            <div class="chart-head"><span>Seres</span><span>75/127</span></div>
            <div class="stack-bar" aria-hidden="true">
              <i class="stack-part main" style="width:59.06%"></i>
              <i class="stack-part soft" style="width:40.94%"></i>
            </div>
            <div class="chart-legend"><span><i class="dot"></i>com</span><span><i class="dot soft"></i>sem</span></div>
          </div>
          <div class="chart-card" title="9 casos com mais de uma localização">
            <div class="chart-head"><span>Multi-local</span><span>9/127</span></div>
            <div class="stack-bar" aria-hidden="true">
              <i class="stack-part alt" style="width:7.09%"></i>
              <i class="stack-part soft" style="width:92.91%"></i>
            </div>
            <div class="chart-legend"><span><i class="dot alt"></i>multi</span><span><i class="dot soft"></i>1 local</span></div>
          </div>
          <div class="chart-card" title="47 pontos extras por casos com múltiplas localizações">
            <div class="chart-head"><span>Pontos</span><span>+47</span></div>
            <div class="stack-bar" aria-hidden="true">
              <i class="stack-part main" style="width:72.99%"></i>
              <i class="stack-part alt" style="width:27.01%"></i>
            </div>
            <div class="chart-legend"><span><i class="dot"></i>casos</span><span><i class="dot alt"></i>extras</span></div>
          </div>
        </div>
      </div>
    </div>
    <div class="controls">
      <input class="wide" id="search" type="search" placeholder="Buscar título, cidade ou estado">
      <select id="stateFilter"><option value="">Todos os estados</option></select>
      <select id="decadeFilter"><option value="">Todas as décadas</option></select>
      <div class="switches wide">
        <label><input id="detailMap" type="checkbox" checked> Mapa detalhado</label>
        <label><input id="showLabels" type="checkbox"> Títulos fixos</label>
        <label><input id="onlyBeings" type="checkbox"> Com seres</label>
      </div>
    </div>
    <div class="results" id="results"></div>
  </section>
  <aside class="detail-panel hidden" id="detailPanel" aria-live="polite">
    <div class="detail-head">
      <h2 class="detail-title" id="detailTitle">Caso</h2>
      <button class="detail-close" id="detailClose" type="button" title="Fechar ficha">×</button>
    </div>
    <div class="detail-body">
      <div class="detail-grid">
        <div class="detail-row"><strong>Local</strong><span id="detailPlace"></span></div>
        <div class="detail-row"><strong>Data</strong><span id="detailDate"></span></div>
        <div class="detail-row"><strong>Década</strong><span id="detailDecade"></span></div>
        <div class="detail-row"><strong>Objeto</strong><span id="detailObject"></span></div>
        <div class="detail-row"><strong>Seres</strong><span id="detailBeings"></span></div>
      </div>
      <div class="detail-summary-title">Resumo</div>
      <p class="detail-summary" id="detailSummary"></p>
    </div>
  </aside>

  <script src="vendor/leaflet.js"></script>

  <script>

Higgins", "ano": 1947, "decada": 1940, "data_ocorrencia": "1947-07-23", "cidade": "Pitanga", "estado": "Paraná", "pais": "Brasil", "tipo_objeto": "OVNI", "tem_seres": true, "link": "https://fenomenum.com.br/o-classico-caso-higgins/", "resumo": "Em 23 de julho de 1947, na Colônia Goio-Bang, então ligada a Pitanga e hoje à região de Luiziana (PR), o topógrafo José C. Higgins trabalhava com ajudantes quando ouviu um silvo agudo e viu um objeto discoidal cinzento-esbranquiçado, com cerca de 30 metros de diâmetro, pousar apoiado em pés metálicos recurvados. Enquanto os auxiliares fugiram, Higgins permaneceu observando e relatou ter visto uma janela com vultos humanos e, depois, três seres de aproximadamente 2,10 metros saindo por uma porta. Segundo a narrativa, os tripulantes usavam macacões transparentes inflados, mochilas metálicas nas costas e tinham cabeças grandes, olhos redondos, membros compridos e aparência quase idêntica entre si. Um deles teria apontado um pequeno tubo para convidá-lo a entrar e desenhado sete círculos no chão, pronunciando palavras como \"Álamo\" e \"Orque\"; Higgins fingiu buscar a esposa, escondeu-se na vegetação e viu os seres saltarem grandes distâncias antes de retornarem ao aparelho, que decolou rumo ao norte.", "latitude": -24.757677, "longitude": -51.7592351, "map_latitude": -24.757677, "map_longitude": -51.7592351, "cor": "hsl(275.0, 88%, 58%)", "endereco": "Pitanga, Paraná, Região Sul, Brasil"}, {"id": 4, "titulo": "Caso Mário Restier", "ano": 1949, "decada": 1940, "data_ocorrencia": "1949-12-04", "cidade": "Volta Redonda", "estado": "Rio de Janeiro", "pais": "Brasil", "tipo_objeto": "Disco voador", "tem_seres": true, "link": "https://fenomenum.com.br/caso-mario-restier/", "resumo": "Em 4 de dezembro de 1949, por volta das 17h, Mário Restier, morador de Barra Mansa, voltava do sítio de seu pai, em Volta Redonda, RJ, quando teria visto um objeto discoidal silencioso sobrevoar árvores e pousar a cerca de 10 a 15 metros da estrada; segundo a narrativa, havia seres/tripulantes, inicialmente dois, com cerca de 1,65 m, usando uma espécie de saiote romano e gorro ou capacete, que o chamaram amistosamente e o convidaram a entrar no disco, dizendo frases como “Não tenha medo” e, ao serem perguntados sobre Deus, “Deus é um só”; dentro da nave, Restier relatou ter visto corredores, painéis, telas, quadros e botões, além de uma espécie de urna ou banheira com líquido, onde foi colocado para suportar a aceleração, hidratar e alimentar o corpo durante a viagem; após adormecer, teria acordado em um local semelhante a um hangar, com vários discos parecidos, e depois sido recebido por outros seres que o levaram a uma espécie de cidade e a um museu, onde lhe mostraram imagens sobre a humanidade, sua violência, ambições e comportamento; depois de algumas horas subjetivas, foi levado de volta ao disco, colocado novamente na urna e retornou ao ponto de partida, mas ao chegar ao sítio descobriu que já era 14 de abril de 1950, embora para ele a experiência tivesse durado cerca de seis horas, deixando um intervalo de quase quatro meses desaparecido; o caso foi posteriormente registrado em boletins da Sociedade Brasileira de Estudos de Discos Voadores, especialmente na edição 60/61 de 15 de abril de 1968, com desenhos atribuídos ao próprio Restier mostrando o disco, seu interior e os tripulantes.", "latitude": -22.521856, "longitude": -44.1040128, "map_latitude": -22.521856, "map_longitude": -44.1040128, "cor": "hsl(52.5, 88%, 58%)", "endereco": "Volta Redonda, Região Geográfica Intermediária de Volta Redonda-Barra Mansa, Rio de Janeiro, Região Sudeste, Brasil"}, {"id": 5, "titulo": "Caso Lucci Gallucci", "ano": 1950, "decada": 1950, "data_ocorrencia": "1950-01-01", "cidade": "Santanésia", "estado": "Rio de Janeiro", "pais": "Brasil", "tipo_objeto": "OVNI", "tem_seres": true, "link": "https://fenomenum.com.br/caso-lucci-gallucci/", "resumo": "Em 1950, em Santanésia, RJ, a senhora Lucci Galluci teria vivido um contato com um ser humanoide enquanto lia um livro às margens de uma barragem; segundo a narrativa, o ser parecia inicialmente um homem comum, mas apresentava características incomuns, como roupa branca ajustada ao corpo, testa ampla, cabelos brancos, ralos e lisos, orelhas pontudas sem lóbulos, nariz afilado, olhos entre amarelo e castanho e ausência de pestanas e sobrancelhas; durante a conversa, ele teria falado sobre vida em outros planetas, civilizações mais avançadas que a terrestre e a possibilidade de povos extraterrestres espalharem vida por mundos habitáveis, inclusive modificando planetas hostis para servir de destino a civilizações superpovoadas; conforme o relato, a Terra teria recebido no passado civilizações vindas de três planetas, cujos descendentes enfrentaram dificuldades de adaptação, com alguns povos avançando científica e tecnologicamente enquanto outros regrediram; o ser também afirmou que o grupo mais desenvolvido teria se rebelado contra seu planeta de origem, levando um conselho responsável pela Terra a cortar os laços com os terrestres por tempo indeterminado e a apenas acompanhar o planeta à distância; depois de cataclismos, a humanidade teria regredido ainda mais e esquecido suas origens, tornando o caso uma narrativa de contato marcada por explicações sobre a origem extraterrestre da humanidade e sua perda de memória histórica.", "latitude": -22.5213, "longitude": -43.8144, "map_latitude": -22.5213, "map_longitude": -43.8144, "cor": "hsl(190.0, 88%, 58%)", "endereco": "Santanésia, Piraí, Região Geográfica Intermediária de Volta Redonda-Barra Mansa, Rio de Janeiro, Região Sudeste, Brasil"}, {"id": 8, "titulo": "O Caso Alfredo", "ano": 1953, "decada": 1950, "data_ocorrencia": "1953-01-01", "cidade": "Joinville", "estado": "Santa Catarina", "pais": "Brasil", "tipo_objeto": "Disco voador", "tem_seres": true, "link": "https://fenomenum.com.br/o-caso-alfredo/", "resumo": "Em 1953, próximo ao Morro da Tromba, em Joinville, SC, o jovem Alfredo, de 15 anos, teria visto um objeto metálico em forma de disco pairando a cerca de 3 metros do chão, com escotilhas e luzes coloridas; da nave teriam descido dois seres humanoides de cerca de 1,50 m, com cabeças grandes e pontudas, além de um terceiro ser de aparência feminina, que se comunicavam entre si em língua desconhecida e com Alfredo em português incomum. Segundo a narrativa, os seres tentaram coletar material biológico da testemunha, que reagiu, foi paralisada por uma espécie de raio e depois liberada; Alfredo ainda relatou ter visto no interior da nave cadeiras incomuns, manivelas, painéis e botões coloridos, antes de os tripulantes partirem em alta velocidade e o ameaçarem para que não contasse o ocorrido.", "latitude": -26.3044898, "longitude": -48.8486726, "map_latitude": -26.3044898, "map_longitude": -48.8486726, "cor": "hsl(327.5, 88%, 58%)", "endereco": "Joinville, Região Geográfica Imediata de Joinville, Região Geográfica Intermediária de Joinville, Santa Catarina, Região Sul, Brasil"}, {"id": 7, "titulo": "Caso Maurício Ramos Bessa", "ano": 1953, "decada": 1950, "data_ocorrencia": "1953-01-12", "cidade": "Santana dos Montes", "estado": "Minas Gerais", "pais": "Brasil", "tipo_objeto": "Disco voador", "tem_seres": true, "link": "https://fenomenum.com.br/caso-mauricio-ramos-bessa/", "resumo": "Em 12 de janeiro de 1953, perto da fazenda Guarará, em Santana dos Montes (MG), Maurício Ramos Bessa relatou ter encontrado um pequeno veículo metálico pairando a pouca altura do chão. Segundo ele, uma porta se abriu e dois tripulantes baixos, vestidos com roupa cinza brilhante e capacetes, saíram do objeto enquanto outro permanecia no interior. A aproximação causou forte dor de cabeça na testemunha, que depois encontrou uma pequena perfuração no solo no ponto onde um dos seres teria recolhido material.", "latitude": -20.7864702, "longitude": -43.6912683, "map_latitude": -20.7864702, "map_longitude": -43.6912683, "cor": "hsl(105.0, 88%, 58%)", "endereco": "Santana dos Montes, Minas Gerais, Região Sudeste, Brasil"}, {"id": 6, "titulo": "Caso Guaporé", "ano": 1953, "decada": 1950, "data_ocorrencia": "1953-11-28", "cidade": "Pedras Negras", "estado": "Rondônia", "pais": "Brasil", "tipo_objeto": "Disco voador", "tem_seres": true, "link": "https://fenomenum.com.br/caso-guapore/", "resumo": "Em 28 de novembro de 1953, na Baía dos Patos, região de Pedras Negras, no Rio Guaporé (RO), Pedro Serrate e Francisco de Assis Teixeira caçavam patos quando observaram um aparelho azul escuro pousar silenciosamente sobre a água. Pedro, que estava de tocaia em uma árvore, ficou a poucos metros do objeto e descreveu uma estrutura em forma de bacia, com cobertura curva, parte transparente ao redor e uma espécie de leme semelhante a cauda de boto. Pelo material transparente, as testemunhas disseram ver seis ocupantes, quatro homens e duas mulheres, de aparência humana, pele clara e rosada, cabelos ruivos e roupas azuladas. Ao perceberem os caçadores, os tripulantes manobraram o aparelho, que levantou voo sem ruído e desapareceu em alta velocidade.", "latitude": -12.8501835, "longitude": -62.9022569, "map_latitude": -12.8501835, "map_longitude": -62.9022569, "cor": "hsl(242.6, 88%, 58%)", "endereco": "Pedras Negras, São Francisco do Guaporé, Rondônia, Região Norte, Brasil"}, {"id": 9, "titulo": "A Onda Ufológica de 1954", "ano": 1954, "decada": 1950, "data_ocorrencia": "1954-01-01", "cidade": "Cachoeira do Sul", "estado": "Rio Grande do Sul", "pais": "Brasil", "tipo_objeto": "Não identificado", "tem_seres": false, "link": "https://fenomenum.com.br/onda-ufologica-de-rs/", "resumo": "Ao longo de 1954, o Rio Grande do Sul concentrou uma sequência de avistamentos em cidades como Cachoeira do Sul, Caxias do Sul, Pelotas, Rio Grande, Passo Fundo, Osório, Quaraí, Ijuí, Santa Maria, Santa Cruz do Sul, Novo Hamburgo e Canoas/Gravataí. O ponto mais citado ocorreu em 24 de outubro, na então Base Aérea de Canoas, quando militares de várias patentes observaram um objeto discoide pairando por mais de quatro horas, quase imóvel, às vezes oscilando em movimento de \"folha seca\". Depois de um breve deslocamento, o disco teria retornado acompanhado de outro objeto semelhante, também visto pelos presentes. A repercussão levou testemunhas militares a relatarem o episódio à imprensa gaúcha, gerou debate nacional e resultou em investigação militar, tornando a onda de 1954 no estado uma coleção de avistamentos coletivos, com destaque para observações em área militar.", "latitude": -30.0482234, "longitude": -52.8901686, "map_latitude": -30.0482234, "map_longitude": -52.8901686, "cor": "hsl(20.1, 88%, 58%)", "endereco": "Cachoeira do Sul, Região Geográfica Intermediária de Santa Maria, Rio Grande do Sul, Região Sul, Brasil"}, {"id": 9, "titulo": "A Onda Ufológica de 1954", "ano": 1954, "decada": 1950, "data_ocorrencia": "1954-01-01", "cidade": "Caxias do Sul", "estado": "Rio Grande do Sul", "pais": "Brasil", "tipo_objeto": "Não identificado", "tem_seres": false, "link": "https://fenomenum.com.br/onda-ufologica-de-rs/", "resumo": "Ao longo de 1954, o Rio Grande do Sul concentrou uma sequência de avistamentos em cidades como Cachoeira do Sul, Caxias do Sul, Pelotas, Rio Grande, Passo Fundo, Osório, Quaraí, Ijuí, Santa Maria, Santa Cruz do Sul, Novo Hamburgo e Canoas/Gravataí. O ponto mais citado ocorreu em 24 de outubro, na então Base Aérea de Canoas, quando militares de várias patentes observaram um objeto discoide pairando por mais de quatro horas, quase imóvel, às vezes oscilando em movimento de \"folha seca\". Depois de um breve deslocamento, o disco teria retornado acompanhado de outro objeto semelhante, também visto pelos presentes. A repercussão levou testemunhas militares a relatarem o episódio à imprensa gaúcha, gerou debate nacional e resultou em investigação militar, tornando a onda de 1954 no estado uma coleção de avistamentos coletivos, com destaque para observações em área militar.", "latitude": -29.1685045, "longitude": -51.179
