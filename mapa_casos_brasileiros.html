ionaram possíveis registros em radar. Em São Paulo, os relatos foram ligados a um episódio anterior nas matas da Cantareira, onde teria havido queda ou explosão de objeto, seguido de buscas do COE. No Rio, dias depois, três objetos foram novamente observados sobre o Campo dos Afonsos, reforçando a ideia de uma onda nacional de avistamentos.", "latitude": -3.1316333, "longitude": -59.9825041, "map_latitude": -3.1316333, "map_longitude": -59.9825041, "cor": "hsl(213.0, 88%, 58%)", "endereco": "Manaus, Região Geográfica Imediata de Manaus, Região Geográfica Intermediária de Manaus, Amazonas, Região Norte, 69000-000, Brasil"}, {"id": 69, "titulo": "Caso Luis Carlos Serra", "ano": 1978, "decada": 1970, "data_ocorrencia": "1978-03-24", "cidade": "Penalva", "estado": "Maranhão", "pais": "Brasil", "tipo_objeto": "Não identificado", "tem_seres": true, "link": "https://fenomenum.com.br/caso-luis-carlos-serra/", "resumo": "Em 24 de março de 1978, em Penalva (MA), o jovem Luís Carlos Serra, de 16 anos, colhia goiabas em uma área de mata quando ouviu um som agudo e viu uma luz branca muito brilhante acima das palmeiras. Ele relatou ter caído paralisado e depois sido erguido no ar em direção a um objeto redondo, com uma cúpula superior, três janelas e estruturas arredondadas na parte inferior. Dentro do aparelho, ainda sem conseguir se mover, viu três pequenos seres de cerca de 1 metro, usando escafandros metálicos com mochila, luvas, botas e visores. Luís Carlos perdeu a consciência a bordo e foi encontrado dias depois em estado alterado, com dificuldades de reação e necessidade de atendimento médico; segundo relato médico, ficou vários dias sem se alimentar normalmente e precisou de soro. A experiência é associada ao contexto de intensa atividade ufológica no Maranhão após a onda conhecida como chupa-chupa.", "latitude": -3.2881215, "longitude": -45.1742086, "map_latitude": -3.2881215, "map_longitude": -45.1742086, "cor": "hsl(350.5, 88%, 58%)", "endereco": "Penalva, Região Geográfica Imediata de Viana, Região Geográfica Intermediária de São Luís, Maranhão, Região Nordeste, 65213-000, Brasil"}, {"id": 70, "titulo": "Militares da FAB dispararam contra OVNIs, próximo à Brasília", "ano": 1978, "decada": 1970, "data_ocorrencia": "1978-06-20", "cidade": "Brasília", "estado": "Distrito Federal", "pais": "Brasil", "tipo_objeto": "Objeto luminoso", "tem_seres": true, "link": "https://fenomenum.com.br/o-caso-gama/", "resumo": "Em 20 de junho de 1978, em Brasília, Distrito Federal, militares da Força Aérea Brasileira abriram fogo contra um OVNI e vultos escuros que se aproximaram da instalação de radar do Gama, no Distrito Federal, em 20 de junho de 1978. Tudo começou por volta de 20h30, quando um objeto voador luminoso, de cor alongada surgiu sobre a região do Gama, no Distrito Federal. O vigilante Paulino Bezerra de Souza ouviu sons estranhos fora do posto THF, na instalação de radar do Gama (atual Destacamento de Controle do Espaço Aéreo – GAMA (DTCEA -GA). Mais tarde, em sua ronda, ele encontrou o 3º Sargento Odilon Menezes dos Santos, à quem relatou o ocorrido.", "latitude": -15.7939869, "longitude": -47.8828, "map_latitude": -15.7939869, "map_longitude": -47.8828, "cor": "hsl(128.1, 88%, 58%)", "endereco": "Brasília, Plano Piloto, Região Geográfica Intermediária do Distrito Federal, Distrito Federal, Região Centro-Oeste, 70391-900, Brasil"}, {"id": 71, "titulo": "O Caso da Usina de Marimbondo", "ano": 1978, "decada": 1970, "data_ocorrencia": "1978-12-06", "cidade": "Icém", "estado": "São Paulo", "pais": "Brasil", "tipo_objeto": "Disco voador", "tem_seres": true, "link": "https://fenomenum.com.br/o-caso-da-usina-de-marimbondo/", "resumo": "Em 6 de dezembro de 1978, na Usina Hidrelétrica de Marimbondo, na divisa entre São Paulo e Minas Gerais, o vigia Jesus Antunes Moreira fazia guarda na crista da barragem quando observou um objeto luminoso aproximar-se em silêncio. A nave, descrita como um cone arredondado de cerca de 3 metros de diâmetro, parou a poucos metros da guarita. Uma portinhola se abriu e uma silhueta humana observou a testemunha; em seguida, três ocupantes saíram para uma plataforma externa. Um deles era uma mulher, e todos tinham pele cor de jambo avermelhada, cabelos pretos, sobrancelhas espessas, macacões azul-metálicos e luvas rosadas. Jesus tentou chamar alguém por telefone, mas os seres gesticularam para que não o fizesse. Ao disparar um tiro de advertência no chão, sua arma não funcionou. Um dos tripulantes falou em português, dizendo que não havia motivo para medo e que realizavam pesquisas. Após a partida do objeto, o vigia sentiu tontura, náusea e ardência nos olhos.", "latitude": -20.3413103, "longitude": -49.1970982, "map_latitude": -20.3413103, "map_longitude": -49.1970982, "cor": "hsl(265.6, 88%, 58%)", "endereco": "Icém, São Paulo, Região Sudeste, 15460-000, Brasil"}, {"id": 71, "titulo": "O Caso da Usina de Marimbondo", "ano": 1978, "decada": 1970, "data_ocorrencia": "1978-12-06", "cidade": "Fronteira", "estado": "Minas Gerais", "pais": "Brasil", "tipo_objeto": "Disco voador", "tem_seres": true, "link": "https://fenomenum.com.br/o-caso-da-usina-de-marimbondo/", "resumo": "Em 6 de dezembro de 1978, na Usina Hidrelétrica de Marimbondo, na divisa entre São Paulo e Minas Gerais, o vigia Jesus Antunes Moreira fazia guarda na crista da barragem quando observou um objeto luminoso aproximar-se em silêncio. A nave, descrita como um cone arredondado de cerca de 3 metros de diâmetro, parou a poucos metros da guarita. Uma portinhola se abriu e uma silhueta humana observou a testemunha; em seguida, três ocupantes saíram para uma plataforma externa. Um deles era uma mulher, e todos tinham pele cor de jambo avermelhada, cabelos pretos, sobrancelhas espessas, macacões azul-metálicos e luvas rosadas. Jesus tentou chamar alguém por telefone, mas os seres gesticularam para que não o fizesse. Ao disparar um tiro de advertência no chão, sua arma não funcionou. Um dos tripulantes falou em português, dizendo que não havia motivo para medo e que realizavam pesquisas. Após a partida do objeto, o vigia sentiu tontura, náusea e ardência nos olhos.", "latitude": -20.286111, "longitude": -49.202778, "map_latitude": -20.286111, "map_longitude": -49.202778, "cor": "hsl(265.6, 88%, 58%)", "endereco": "Fronteira, Minas Gerais, Região Sudeste, 38230-000, Brasil"}, {"id": 74, "titulo": "Caso Amador Antônio de Lima", "ano": 1979, "decada": 1970, "data_ocorrencia": "1979-01-01", "cidade": "Santo Antônio", "estado": "Rio Grande do Norte", "pais": "Brasil", "tipo_objeto": "Disco voador", "tem_seres": true, "link": "https://fenomenum.com.br/caso-amador-antonio-de-lima/", "resumo": "Em uma noite de novembro de 1979, na zona rural de Santo Antônio (RN), o agricultor Antônio Amador de Lima voltava para casa quando viu uma luz aproximar-se e projetar sobre ele um feixe azul. Lembrando histórias sobre discos voadores, deitou-se no chão, mas sentiu que era puxado para cima. Uma espécie de corda com quatro ganchos desceu do objeto, e um dos ganchos prendeu sua camisa pelas costas, deixando-o suspenso. Antônio disse ter visto uma janela no aparelho e três ocupantes: duas mulheres e um homem barbudo, de aparência humana, mas com rostos estranhos. Uma das mulheres teria dito que poderiam levar “um velho bom” para seu mundo. A testemunha segurou uma planta com força até a camisa rasgar, caiu no chão e viu o objeto girar e afastar-se com uma luz vermelha na parte traseira. Depois ficou doente por cerca de uma semana e, segundo familiares, nunca voltou à rotina normal.", "latitude": -6.3124831, "longitude": -35.4815907, "map_latitude": -6.3124831, "map_longitude": -35.4815907, "cor": "hsl(43.1, 88%, 58%)", "endereco": "Santo Antônio, Rio Grande do Norte, Região Nordeste, Brasil"}, {"id": 75, "titulo": "Caso Beato", "ano": 1979, "decada": 1970, "data_ocorrencia": "1979-01-01", "cidade": "Santa Cruz", "estado": "Rio Grande do Norte", "pais": "Brasil", "tipo_objeto": "Não identificado", "tem_seres": true, "link": "https://fenomenum.com.br/caso-beato/", "resumo": "Em 1979, durante o período de seca, Benedito Henrique de Sousa, conhecido como Beato, voltava para casa em Santa Cruz (RN) quando um objeto apareceu repentinamente sobre sua cabeça, a poucos metros de altura. Ao olhar para cima, viu uma abertura no fundo do aparelho, de onde saía uma luz intensa, como se fosse dia. A luz produzia uma força de sucção, e Beato agarrou-se a uma catingueira para não ser puxado para dentro do objeto. Apesar da claridade dolorosa, ele afirmou ter visto três ocupantes, possivelmente dois homens e uma mulher, um deles com cabelo vermelho até os ombros. Durante a tentativa de captura, um líquido quente semelhante a óleo caiu sobre seus ombros, causando queimaduras. Quando a luz apagou, o puxão cessou e o objeto desapareceu. Beato ficou temporariamente cego pela intensidade da luz e demorou meses para voltar a sair à noite sozinho.", "latitude": -6.224752, "longitude": -36.019297, "map_latitude": -6.224752, "map_longitude": -36.019297, "cor": "hsl(180.6, 88%, 58%)", "endereco": "Santa Cruz, Rio Grande do Norte, Região Nordeste, 59200-000, Brasil"}, {"id": 77, "titulo": "Caso Janúncio", "ano": 1979, "decada": 1970, "data_ocorrencia": "1979-01-01", "cidade": "Santa Cruz", "estado": "Rio Grande do Norte", "pais": "Brasil", "tipo_objeto": "Não identificado", "tem_seres": true, "link": "https://fenomenum.com.br/caso-januncio/", "resumo": "No início de janeiro de 1979, em Santa Cruz (RN), Francisco Henrique de Sousa, conhecido como Janúncio, voltava para casa à noite quando acendeu um cigarro e viu um aparelho enorme posicionar-se silenciosamente a cerca de 3 metros acima de sua cabeça. O objeto, comparado a um silo, abriu uma porta inferior de onde saiu uma luz intensa e quente. Pela abertura, Janúncio disse ver um homem e uma mulher sentados como em um banco de carro. A luz passou a puxá-lo para cima como um ímã, e ele se agarrou a uma palmeira, enrolando braços e pernas no tronco. Por várias vezes foi erguido e puxado de volta, até que os ocupantes derramaram um líquido quente semelhante a óleo, causando queimaduras em seus braços e arranhões no peito. Como ele não soltou a árvore, a porta se fechou, a luz apagou e o aparelho partiu rapidamente. Depois, Janúncio ficou doente por dois dias e nunca mais quis sair à noite.", "latitude": -6.224752, "longitude": -36.019297, "map_latitude": -6.224752, "map_longitude": -36.019297, "cor": "hsl(318.1, 88%, 58%)", "endereco": "Santa Cruz, Rio Grande do Norte, Região Nordeste, 59200-000, Brasil"}, {"id": 72, "titulo": "Abdução em Maringá (PR)", "ano": 1979, "decada": 1970, "data_ocorrencia": "1979-04-13", "cidade": "Maringá", "estado": "Paraná", "pais": "Brasil", "tipo_objeto": "OVNI", "tem_seres": true, "link": "https://fenomenum.com.br/abducao-em-maringa-pr/", "resumo": "Na noite de 13 de abril de 1979, no Jardim Alvorada, em Maringá (PR), o eletricista Jocelino Mattos, de 21 anos, caminhava com o irmão Roberto Carlos, de 13, quando ambos perceberam uma luz que parecia acompanhá-los. Perto de uma árvore em um terreno arado, os dois foram derrubados por uma força desconhecida enquanto um objeto intensamente iluminado pairava silenciosamente a cerca de 15 metros deles. Roberto teria ficado inconsciente, e Jocelino relatou lembranças fragmentadas de ter sido levado para o interior do UFO, onde recebeu mensagens sobre uma missão de observação do comportamento humano. Em regressão hipnótica, descreveu ocupantes, diálogos e a devolução ao local onde o irmão estava caído. Os dois voltaram para casa sujos de terra, fracos e com fome intensa, estimando que o episódio tenha durado das 23h até cerca de 1h30 da madrugada.", "latitude": -23.425269, "longitude": -51.9382078, "map_latitude": -23.425269, "map_longitude": -51.9382078, "cor": "hsl(95.6, 88%, 58%)", "endereco": "Maringá, Paraná, Região Sul, Brasil"}, {"id": 76, "titulo": "Caso Francisca de Assis", "ano": 1979, "decada": 1970, "data_ocorrencia": "1979-04-27", "cidade": "Santa Cruz", "estado": "Rio Grande do Norte", "pais": "Brasil", "tipo_objeto": "Objeto luminoso", "tem_seres": false, "link": "https://fenomenum.com.br/caso-francisca-de-assis/", "resumo": "Em 27 de abril de 1979, na região de Santa Cruz (RN), Francisca Bispo de Assis e sua filha Josefa voltavam de uma visita a vizinhos quando viram uma luz grande sobre um morro. O objeto, descrito como uma estrela que aumentou de tamanho até parecer um fogo maior que um guarda-sol, aproximou-se e lançou um raio luminoso para baixo. Francisca foi envolvida pela luz e começou a ser erguida do chão, enquanto Josefa tentava puxá-la de volta. Em seguida, um vento forte vindo do objeto a arrastou pelo ar em direção à colina, levantando seu vestido e deixando seu corpo amortecido. Francisca disse ter sido levada a cerca de 20 metros de altura e deslocada por aproximadamente 40 metros antes de ser baixada novamente ao solo. A luz permaneceu por alguns segundos e desapareceu. Depois do episódio, ela ficou paralisada por algum tempo, sofreu dores de cabeça e desenvolveu forte medo de sair à noite.", "latitude": -6.224752, "longitude": -36.019297, "map_latitude": -6.224752, "map_longitude": -36.019297, "cor": "hsl(233.1, 88%, 58%)", "endereco": "Santa Cruz, Rio Grande do Norte, Região Nordeste, 59200-000, Brasil"}, {"id": 78, "titulo": "O Caso do Embornal", "ano": 1979, "decada": 1970, "data_ocorrencia": "1979-05-16", "cidade": "Baependi", "estado": "Minas Gerais", "pais": "Brasil", "tipo_objeto": "Disco voador", "tem_seres": true, "link": "https://fenomenum.com.br/o-caso-do-embornal/", "resumo": "Em 16 de maio de 1979, em Baependi, no sul de Minas Gerais, o sitiante Arlindo Gabriel dos Santos saiu para caçar com dois amigos levando uma câmera, uma espingarda, um revólver e um embornal de pano com alimentos. Ao se separar do grupo em um planalto, viu um objeto descer rapidamente atrás de uma crista e, ao se aproximar, fotografou pequenos aparelhos pousados no terreno, incluindo um cilindro amarelo com esfera luminosa no topo. Mais tarde, segundo seu relato, encontrou uma nave maior e tripulada, foi levado para o interior por seres uniformizados e observou uma sala circular com luzes, instrumentos e ocupantes que falavam uma língua desconhecida. O embornal carregado por Arlindo, junto com fotografias, croquis e relatórios de pesquisa do CEVAPPA e da SBEDV, passou a ser tratado como parte das evidências físicas relacionadas ao episódio.", "latitude": -21.9575733, "longitude": -44.8891463, "map_latitude": -21.9575733, "map_longitude": -44.8891463, "cor": "hsl(10.6, 88%, 58%)", "endereco": "Baependi, Minas Gerais, Região Sudeste, 37443-000, Brasil"}, {"id": 73, "titulo": "Abdução em Mirassol", "ano": 1979, "decada": 1970, "data_ocorrencia": "1979-06-28", "cidade": "Mirassol", "estado": "São Paulo", "pais": "Brasil", "tipo_objeto": "Objeto luminoso", "tem_seres": true, "link": "https://fenomenum.com.br/abducao-em-mirassol/", "resumo": "Na madrugada de 28 de junho de 1979, em Mirassol (SP), Antônio Carlos Ferreira fazia guarda na Indústria de Móveis Fafá quando viu uma esfera vermelha descer no pátio. Ao investigar, encontrou três seres de cerca de 1 metro, usando macacões brancos cintilantes e capacetes que ocultavam o rosto. Seu cão pastor alemão tentou avançar, mas caiu como se tivesse sido neutralizado. Antônio foi atingido por uma luz vermelha, ficou paralisado e foi levado para um objeto metálico cônico, apoiado em tripé. Dentro da nave, sentiu frio e ouviu um zumbido. Depois relatou ter sido transportado para um ambiente maior, iluminado por várias cores, com numerosos seres de baixa estatura e dois tipos físicos diferentes: alguns de pele escura, cabelo avermelhado e olhos pretos, outros de pele esverdeada e olhos verdes. O caso teve marcas físicas, lapso no relógio de ponto, queimaduras, hematomas, alteração no comportamento do cão e testemunho de outro vigia que viu o objeto descer.", "latitude": -20.8141411, "longitude": -49.507449, "map_latitude": -20.8141411, "map_longitude": -49.507449, "cor": "hsl(148.1, 88%, 58%)", "endereco": "Mirassol, São Paulo, Região Sudeste, Brasil"}, {"id": 79, "titulo": "UFOnautas em Caçapava Velha", "ano": 1979, "decada": 1970, "data_ocorrencia": "1979-11-08", "cidade": "Caçapava", "estado": "São Paulo", "pais": "Brasil", "tipo_objeto": "OVNI", "tem_seres": true, "link": "https://fenomenum.com.br/ufonautas-em-cacapava-velha/", "resumo": "Em agosto de 1978, na Fazenda São Pedro, a cerca de 5 quilômetros de Caçapava Velha (SP), o tratorista Benedito Cristóvão da Silva saiu de casa por volta de 1h da madrugada para preparar a alimentação do gado. Ao chegar ao rancho onde ficavam o trator e a carreta, viu uma figura sentada sobre a carreta, segurando um farol e fazendo sinais para que ele seguisse em frente. A entidade parecia humana, tinha cerca de 1,80 metro e usava capacete não transparente que impedia ver o rosto. Benedito seguiu com o trator e, durante a sequência do relato, observou um objeto e outros ocupantes ligados ao episódio, descrevendo uma experiência de contato próximo em ambiente rural. A SBEDV investigou o caso em setembro de 1979 e voltou ao local em junho de 1980, registrando o depoimento e detalhes do cenário.", "latitude": -23.099204, "longitude": -45.707645, "map_latitude": -23.099204, "map_longitude": -45.707645, "cor": "hsl(285.6, 88%, 58%)", "endereco": "Caçapava, São Paulo, Região Sudeste, Brasil"}, {"id": 82, "titulo": "O Caso do Navio Caiobá Seahorse", "ano": 1980, "decada": 1980, "data_ocorrencia": "1980-07-27", "cidade": "Pititinga", "estado": "Rio Grande do Norte", "pais": "Brasil", "tipo_objeto": "Não identificado", "tem_seres": false, "link": "https://fenomenum.com.br/o-caso-do-navio-caioba-seahorse/", "resumo": "Em 27 de julho de 1980, a 24 milhas de Pititinga (RN), marinheiros do rebocador Caiobá Seahorse seguiam para Natal acompanhados pela lancha Teche Seahorse quando avistaram uma luz sobre o mar. Por volta das 18h55, o imediato Fernando Fangueiro passou a observá-la com binóculos, enquanto o marinheiro Ivan de Souza Melo descreveu um objeto ovalado, com luz branca na parte superior, pairando entre 10 e 15 metros acima da água. Como o objeto estava na rota da embarcação, os motores foram colocados em ponto morto e o barco desviou para evitar colisão, ficando a cerca de 40 metros do fenômeno. A ocorrência gerou documentação oficial da Marinha do Brasil, da Força Aérea Brasileira e do Centro de Lançamento da Barreira do Inferno, somando dezenas de páginas.", "latitude": -5.3793865, "longitude": -35.336086, "map_latitude": -5.3793865, "map_longitude": -35.336086, "cor": "hsl(63.1, 88%, 58%)", "endereco": "Pititinga, Rio do Fogo, Rio Grande do Norte, Região Nordeste, Brasil"}, {"id": 81, "titulo": "Caso Elias Seixas", "ano": 1980, "decada": 1980, "data_ocorrencia": "1980-09-25", "cidade": "Conceição do Araguaia", "estado": "Pará", "pais": "Brasil", "tipo_objeto": "Não identificado", "tem_seres": true, "link": "https://fenomenum.com.br/caso-elias-seixas/", "resumo": "Em 25 de setembro de 1980, na região de Conceição do Araguaia (PA), o caminhoneiro Elias Seixas de Mattos viajava com o primo Alberto Seixas Vieira e o amigo Guaraci de Souza depois de deixar uma carga em Goiás. Durante a viagem, os faróis do caminhão piscaram mesmo desligados, os ocupantes sentiram desconforto e sonolência, e Elias parou após perceber pressão na nuca e uma possível voz chamando. Os companheiros teriam visto um feixe azulado atingi-lo, e mais tarde os três observaram uma claridade no mato antes de voltar ao veículo. Depois de uma segunda parada, envolvendo o chapéu de Guaraci lançado pela janela, os três perderam a lembrança clara da sequência e chegaram à parada seguinte cerca de cinco horas atrasados. Sessões de hipnose regressiva com Irene Granchi e Sylvio Lago trouxeram relatos de interior de nave, seres e procedimentos.", "latitude": -8.2696905, "longitude": -49.2676864, "map_latitude": -8.2696905, "map_longitude": -49.2676864, "cor": "hsl(200.6, 88%, 58%)", "endereco": "Conceição do Araguaia, Pará, Região Norte, 68540-000, Brasil"}, {"id": 80, "titulo": "Caso Délio – As influências do contato na psiquê do abduzido", "ano": 1980, "decada": 1980, "data_ocorrencia": "1980-12-31", "cidade": "Curitiba", "estado": "Paraná", "pais": "Brasil", "tipo_objeto": "Não identificado", "tem_seres": true, "link": "https://fenomenum.com.br/caso-delio-as-influencias-do-contato-na-psique-do-abduzido/", "resumo": "Em 31 de dezembro de 1980, em Curitiba (PR), Délio passou por uma experiência que ele interpretou inicialmente como encontro espiritual e que depois foi tratada como abdução. Antes do episódio, relatou aceleração mental, escrita compulsiva, sensação de morte iminente e peso extremo no corpo; para não ficar em casa, hospedou-se em um hotel próximo ao Passeio Público e saiu com o irmão em busca de locais iluminados. Na Praça Nossa Senhora de Salete, no Centro Cívico, ele viu uma luz muito grande e afirmou ter sido levado por uma experiência fora do comum. Ao retornar, sentia euforia, amor intenso e mudança de percepção, mas a dificuldade de explicar o ocorrido levou sua família a interná-lo em um hospital psiquiátrico. O caso passou a ser discutido pelo impacto psicológico e pelas supostas abduções posteriores.", "latitude": -25.4295963, "longitude": -49.2712724, "map_latitude": -25.4295963, "map_longitude": -49.2712724, "cor": "hsl(338.1, 88%, 58%)", "endereco": "Curitiba, Paraná, Região Sul, Brasil"}, {"id": 83, "titulo": "Caso Alienígenas Répteis", "ano": 1981, "decada": 1980, "data_ocorrencia": "1981-01-01", "cidade": "Florianópolis (aprox.)", "estado": "Santa Catarina", "pais": "Brasil", "tipo_objeto": "Não identificado", "tem_seres": true, "link": "https://fenomenum.com.br/caso-alienigenas-repteis/", "resumo": "Em 1981, no litoral catarinense, Fernando, então estudante de Biologia da Universidade Federal de Santa Catarina, teria passado por uma abdução em uma praia. À noite, ao atravessar uma ponte para visitar um amigo, viu uma luz refletida na água e perdeu os sentidos. Quando acordou na beira da ponte, já era cerca de 1h da madrugada, embora familiares e conhecidos afirmassem tê-lo procurado várias vezes sem encontrá-lo ali. Incomodado pelo lapso de tempo, procurou um dentista que realizava hipnose regressiva. Sob hipnose, relatou ter sido levado por seres de aspecto anfíbio ou reptiliano, semelhantes a sapos, com mau cheiro e comportamento agressivo. Dentro do objeto, teria sido despido, colocado em uma mesa e submetido a exames dolorosos com agulhas antes de ser devolvido ao mesmo local, sem lembrança consciente da experiência.", "latitude": -27.594869, "longitude": -48.548219, "map_latitude": -27.594869, "map_longitude": -48.548219, "cor": "hsl(115.7, 88%, 58%)", "endereco": "Florianópolis, Santa Catarina, Brasil (aproximado; fonte informa litoral catarinense/UFSC, sem praia exata)"}, {"id": 84, "titulo": "A Onda Ufológica de 1982", "ano": 1982, "decada": 1980, "data_ocorrencia": "1982-01-01", "cidade": "Curitiba", "estado": "Paraná", "pais": "Brasil", "tipo_objeto": "Disco voador", "tem_seres": false, "link": "https://fenomenum.com.br/a-onda-ufologica-de-1982/", "resumo": "Em 1982, uma série de avistamentos em formação foi relatada em várias cidades do Paraná, com destaque para Curitiba, Lupionópolis, Irati, Prudentópolis, Laranjeiras do Sul, Londrina e Cascavel. Em Lupionópolis, mais de 300 pessoas teriam visto uma frota de OVNIs durante um comício político. Em Irati e Prudentópolis, moradores observaram objetos cruzando o céu noturno, enquanto em Laranjeiras do Sul o advogado Ayrton Correa Rosa e outras testemunhas descreveram esferas luminosas em formação. Em Londrina, relatos mencionaram um objeto maior à frente e outros menores seguindo de modo simétrico. Em Curitiba, testemunhas no bairro Cidade Industrial falaram de um aparelho oval acompanhado por objetos menores que alternavam posição. Em Cascavel, integrantes da Turma do Lambe-Lambe, empresário e motorista disseram ter visto uma frota guiada por um disco maior.", "latitude": -25.4295963, "longitude": -49.2712724, "map_latitude": -25.4295963, "map_longitude": -49.2712724, "cor": "hsl(253.2, 88%, 58%)", "endereco": "Curitiba, Paraná, Região Sul, Brasil"}, {"id": 85, "titulo": "Caso Gustavo Salick", "ano": 1982, "decada": 1980, "data_ocorrencia": "1982-01-01", "cidade": "Antonina", "estado": "Paraná", "pais": "Brasil", "tipo_objeto": "Disco voador", "tem_seres": true, "link": "https://fenomenum.com.br/caso-gustavo-salick/", "resumo": "Em meados de julho de 1982, em um sítio na região de Antonina (PR), familiares de Gustavo Salick encontraram uma clareira circular em plena mata, com vegetação morta e seca até as raízes, formando uma área semelhante a um cone truncado, com cerca de 14 metros de diâmetro no círculo superior e 7 metros no inferior. Meses depois, no fim de outubro, a esposa de Gustavo, o filho Paulo e um visitante ouviram um zumbido desconhecido por volta das 22h. Segundo a narrativa, Paulo recebeu uma mensagem telepática informando que uma nave havia pousado a cerca de 60 metros da casa com três tripulantes chamados Zanatron, Monjuru e Norton, que diziam estar ali para recolher plantas. Um dos seres teria se aproximado da porta de tela e sido percebido apenas como vulto alto, de cerca de 1,90 metro, com algo semelhante a óculos de natação. Amostras do solo e da vegetação foram depois recolhidas pelo CIPEX para análise.", "latitude": -25.4298854, "longitude": -48.7125431, "map_latitude": -25.4298854, "map_longitude": -48.7125431, "cor": "hsl(30.7, 88%, 58%)", "endereco": "Antonina, Paraná, Região Sul, 83370-000, Brasil"}, {"id": 86, "titulo": "Caso VASP – Voo 169", "ano": 1982, "decada": 1980, "data_ocorrencia": "1982-02-08", "cidade": "Fortaleza", "estado": "Ceará", "pais": "Brasil", "tipo_objeto": "Objeto luminoso", "tem_seres": false, "link": "https://fenomenum.com.br/o-caso-vasp-voo-169/", "resumo": "Na madrugada de 8 de fevereiro de 1982, o voo VASP 169, um Boeing 727 que seguia de Fortaleza para o Rio de Janeiro, foi acompanhado por um objeto luminoso durante várias horas. O comandante Gerson Maciel de Britto, tripulantes e passageiros observaram a luz, que também foi comentada em comunicações com o controle de tráfego aéreo. O caso ganhou destaque por envolver uma aeronave comercial, muitas testemunhas a bordo e acompanhamento prolongado durante o trajeto.", "latitude": -3.7304512, "longitude": -38.5217989, "map_latitude": -3.7304512, "map_longitude": -38.5217989, "cor": "hsl(168.2, 88%, 58%)", "endereco": "Fortaleza, Ceará, Região Nordeste, Brasil"}, {"id": 86, "titulo": "Caso VASP – Voo 169", "ano": 1982, "decada": 1980, "data_ocorrencia": "1982-02-08", "cidade": "Petrolina", "estado": "Pernambuco", "pais": "Brasil", "tipo_objeto": "Objeto luminoso", "tem_seres": false, "link": "https://fenomenum.com.br/o-caso-vasp-voo-169/", "resumo": "Na madrugada de 8 de fevereiro de 1982, o voo VASP 169, um Boeing 727 que seguia de Fortaleza para o Rio de Janeiro, foi acompanhado por um objeto luminoso durante várias horas. O comandante Gerson Maciel de Britto, tripulantes e passageiros observaram a luz, que também foi comentada em comunicações com o controle de tráfego aéreo. O caso ganhou destaque por envolver uma aeronave comercial, muitas testemunhas a bordo e acompanhamento prolongado durante o trajeto.", "latitude": -9.3817334, "longitude": -40.4968875, "map_latitude": -9.3817334, "map_longitude": -40.4968875, "cor": "hsl(168.2, 88%, 58%)", "endereco": "Petrolina, Pernambuco, Região Nordeste, Brasil"}, {"id": 86, "titulo": "Caso VASP – Voo 169", "ano": 1982, "decada": 1980, "data_ocorrencia": "1982-02-08", "cidade": "Belo Horizonte", "estado": "Minas Gerais", "pais": "Brasil", "tipo_objeto": "Objeto luminoso", "tem_seres": false, "link": "https://fenomenum.com.br/o-caso-vasp-voo-169/", "resumo": "Na madrugada de 8 de fevereiro de 1982, o voo VASP 169, um Boeing 727 que seguia de Fortaleza para o Rio de Janeiro, foi acompanhado por um objeto luminoso durante várias horas. O comandante Gerson Maciel de Britto, tripulantes e passageiros observaram a luz, que também foi comentada em comunicações com o controle de tráfego aéreo. O caso ganhou destaque por envolver uma aeronave comercial, muitas testemunhas a bordo e acompanhamento prolongado durante o trajeto.", "latitude": -19.9227318, "longitude": -43.9450948, "map_latitude": -19.9227318, "map_longitude": -43.9450948, "cor": "hsl(168.2, 88%, 58%)", "endereco": "Belo Horizonte, Minas Gerais, Região Sudeste, Brasil"}, {"id": 86, "titulo": "Caso VASP – Voo 169", "ano": 1982, "decada": 1980, "data_ocorrencia": "1982-02-08", "cidade": "Rio de Janeiro", "estado": "Rio de Janeiro", "pais": "Brasil", "tipo_objeto": "Objeto luminoso", "tem_seres": false, "link": "https://fenomenum.com.br/o-caso-vasp-voo-169/", "resumo": "Na madrugada de 8 de fevereiro de 1982, o voo VASP 169, um Boeing 727 que seguia de Fortaleza para o Rio de Janeiro, foi acompanhado por um objeto luminoso durante várias horas. O comandante Gerson Maciel de Britto, tripulantes e passageiros observaram a luz, que também foi comentada em comunicações com o controle de tráfego aéreo. O caso ganhou destaque por envolver uma aeronave comercial, muitas testemunhas a bordo e acompanhamento prolongado durante o trajeto.", "latitude": -22.9110137, "longitude": -43.2093727, "map_latitude": -22.9110137, "map_longitude": -43.2093727, "cor": "hsl(168.2, 88%, 58%)", "endereco": "Rio de Janeiro, Região Sudeste, Brasil"}, {"id": 88, "titulo": "O Caso do OVNI do Morenão", "ano": 1982, "decada": 1980, "data_ocorrencia": "1982-03-06", "cidade": "Campo Grande", "estado": "Mato Grosso do Sul", "pais": "Brasil", "tipo_objeto": "Disco voador", "tem_seres": false, "link": "https://fenomenum.com.br/o-caso-do-ovni-do-morenao/", "resumo": "Na noite de 6 de março de 1982, durante a partida entre Operário e Vasco no Estádio Morenão, em Campo Grande (MS), milhares de torcedores, jogadores e jornalistas viram luzes incomuns cruzarem o céu logo no início do jogo. Por volta das 20h15, uma bola de fogo com forte facho luminoso apareceu sobre o estádio, assustando o público presente. As versões variaram quanto ao número de objetos, entre dois e quatro, mas os relatos concordaram na intensidade das luzes e nas cores variadas. Um agente da Base Aérea de Campo Grande também teria observado dois objetos e consultado o Cindacta, que informou não haver aeronave conhecida naquele horário. Entre as testemunhas lembradas estão o jogador Cocada, do Operário, que descreveu uma “roda de fogo” que partiu em velocidade incrível, e jogadores do Vasco que afirmaram ter parado para olhar o fenômeno durante a partida.", "latitude": -20.4640173, "longitude": -54.6162947, "map_latitude": -20.4640173, "map_longitude": -54.6162947, "cor": "hsl(305.7, 88%, 58%)", "endereco": "Campo Grande, Mato Grosso do Sul, Região Centro-Oeste, Brasil"}, {"id": 87, "titulo": "FAB Persegue UFOs em Anápolis (GO)", "ano": 1982, "decada": 1980, "data_ocorrencia": "1982-04-28", "cidade": "Anápolis", "estado": "Goiás", "pais": "Brasil", "tipo_objeto": "Objeto luminoso", "tem_seres": false, "link": "https://fenomenum.com.br/fab-persegue-ufos-em-anapolis-go/", "resumo": "Em 28 de abril de 1982, radares da Base Aérea de Anápolis (GO) passaram a registrar alvos não identificados por volta das 22h25, em deslocamento que inicialmente lembrou uma formação de helicópteros. Dois caças da FAB em treinamento foram enviados para interceptação, e os pilotos chegaram a avistar um objeto luminoso sobre a região, mas ele apagou as luzes e o contato visual foi perdido. Outros pilotos também foram acionados, com registros breves nos radares das aeronaves. Mais tarde, durante aproximação para pouso, um piloto recebeu alerta de alvo à frente, avistou uma luz oscilante na mesma altitude e manobrou para evitar possível colisão, enquanto o objeto também pareceu se mover. Os sinais continuaram sendo acompanhados por radares da base e, no dia seguinte, novos contatos motivaram o deslocamento de caças F-103 Mirage.", "latitude": -16.3332828, "longitude": -48.9525756, "map_latitude": -16.3332828, "map_longitude": -48.9525756, "cor": "hsl(83.2, 88%, 58%)", "endereco": "Anápolis, Região Geográfica Imediata de Anápolis, Região Geográfica Intermediária de Goiânia, Goiás, Região Centro-Oeste, Brasil"}, {"id": 89, "titulo": "O Misterioso Raio Azul", "ano": 1982, "decada": 1980, "data_ocorrencia": "1982-05-10", "cidade": "Ponta Grossa", "estado": "Paraná", "pais": "Brasil", "tipo_objeto": "Objeto luminoso", "tem_seres": false, "link": "https://fenomenum.com.br/o-misterioso-raio-azul/", "resumo": "Na noite de 9 para 10 de maio de 1982, nas proximidades de Ponta Grossa (PR), o promotor Nelson Lins e seu primo viajavam rumo a Arapongas quando um forte clarão azulado foi projetado sobre o automóvel por cerca de 10 a 15 segundos. Na mesma noite, o deputado estadual Floriswaldo Palácios e sua família relataram fenômeno parecido a cerca de 20 quilômetros de Ponta Grossa, seguido de defeito elétrico no carro, com queima do relê. Já na madrugada do dia 10, o desembargador Ocyan França e sua esposa, também em viagem para Arapongas, viram um clarão azul semelhante a faíscas de solda iluminar o interior do veículo entre 30 e 50 quilômetros da cidade. Nenhuma das testemunhas mencionou ver uma aeronave ou objeto definido, mas a repetição de clarões azuis na mesma região levou o episódio a ser incluído na casuística ufológica paranaense.", "latitude": -25.0891685, "longitude": -50.1601812, "map_latitude": -25.0891685, "map_longitude": -50.1601812, "cor": "hsl(220.7, 88%, 58%)", "endereco": "Ponta Grossa, Paraná, Região Sul, Brasil"}, {"id": 91, "titulo": "Caso Foto Batel", "ano": 1983, "decada": 1980, "data_ocorrencia": "1983-01-01", "cidade": "Curitiba", "estado": "Paraná", "pais": "Brasil", "tipo_objeto": "Disco voador", "tem_seres": true, "link": "https://fenomenum.com.br/caso-foto-batel/", "resumo": "Em agosto de 1983, no bairro Batel, em Curitiba (PR), Julio Bachtzen percebeu em uma fotografia já revelada a presença de um objeto que não havia visto no momento do disparo. A imagem mostrava um aparente OVNI em movimento, com aspecto borrado na parte inferior, como se girasse. Julio procurou a Aeronáutica, no Bacacheri, e foi atendido por oficiais que demonstraram interesse no negativo para análise em Brasília, mas ele não aceitou entregá-lo sem garantia de devolução. Cópias foram cedidas aos militares, enquanto o negativo permaneceu com pesquisadores civis. O caso passou a ser estudado por grupos ufológicos de Curitiba e cópias foram encaminhadas a entidades estrangeiras, como CUFOS e ICUFON, sem que os pesquisadores locais apontassem sinais de trucagem ou explicação atmosférica nas análises iniciais.", "latitude": -25.4295963, "longitude": -49.2712724, "map_latitude": -25.4295963, "map_longitude": -49.2712724, "cor": "hsl(358.2, 88%, 58%)", "endereco": "Curitiba, Paraná, Região Sul, Brasil"}, {"id": 90, "titulo": "Caso Antônio Nelso Tasca", "ano": 1983, "decada": 1980, "data_ocorrencia": "1983-12-14", "cidade": "Chapecó", "estado": "Santa Catarina", "pais": "Brasil", "tipo_objeto": "Não identificado", "tem_seres": true, "link": "https://fenomenum.com.br/caso-antonio-nelso-tasca/", "resumo": "Em 14 de dezembro de 1983, em Chapecó, Santa Catarina, antônio Nelso Tasca passa por uma abdução em 14 de dezembro de 1983. Após a experiência, ele descobre um ferimento indolor em suas costas. Em 14 de dezembro de 1983, o corretor de imóveis, Antônio Nelso Tasca, dirigia para sua casa, quando depara-se com um misterioso objeto, de formato retangular, pousado logo sobre uma estrada rural. Tasca é levado para bordo do objeto, onde mantém um contato muito amistoso com uma tripulante do aparelho, que lhe repassa uma mensagem para a humanidade. Por volta das 20 horas, quando ele encontrava-se nas proximidades da fábrica da Coca-cola, mais ou menos a 6 quilômetros de Chapecó, Tasca saiu do asfalto e entrou em uma estrada de terra, à direita da rodovia, que dá acesso à Granja do Sr. Tozzo.", "latitude": -27.1110472, "longitude": -52.5958977, "map_latitude": -27.1110472, "map_longitude": -52.5958977, "cor": "hsl(135.7, 88%, 58%)", "endereco": "Chapecó, Região Geográfica Imediata de Chapecó, Região Geográfica Intermediária de Chapecó, Santa Catarina, Região Sul, Brasil"}, {"id": 92, "titulo": "OVNIs em Laranjeiras do Sul (PR)", "ano": 1984, "decada": 1980, "data_ocorrencia": "1984-04-18", "cidade": "Laranjeiras do Sul", "estado": "Paraná", "pais": "Brasil", "tipo_objeto": "OVNI", "tem_seres": false, "link": "https://fenomenum.com.br/ovnis-em-laranjeiras-do-sul-pr/", "resumo": "Em 18 de abril de 1984, em Laranjeiras do Sul (PR), muitas pessoas relataram a passagem de um OVNI sobre a cidade, acompanhada por queda de energia elétrica. A partir desse episódio, pesquisadores do CIPEX passaram dois dias na região reunindo depoimentos de moradores sobre avistamentos recentes e antigos. Entre os relatos, Anália Melo contou que, anos antes, ela, o marido e empregados viram uma forte luz azulada aproximar-se da fazenda; o objeto teria cruzado a baixa altitude, silencioso, com janelas girando e silhuetas imóveis em seu interior. O advogado Ayrton C. Rosa relatou um objeto retangular visto com a esposa em 1974, e o padre Francisco Sozzi descreveu uma bola luminosa amarela que cruzou o céu, parou na direção da Usina de Salto Santiago por cerca de 30 minutos, emitiu luzes alaranjadas e desapareceu rumo ao norte.", "latitude": -25.4073197, "longitude": -52.4150132, "map_latitude": -25.4073197, "map_longitude": -52.4150132, "cor": "hsl(273.2, 88%, 58%)", "endereco": "Laranjeiras do Sul, Paraná, Região Sul, Brasil"}, {"id": 93, "titulo": "Caso Célia Santana", "ano": 1985, "decada": 1980, "data_ocorrencia": "1985-07-02", "cidade": "Curitiba", "estado": "Paraná", "pais": "Brasil", "tipo_objeto": "Não identificado", "tem_seres": true, "link": "https://fenomenum.com.br/caso-celia-santana/", "resumo": "Em 2 de julho de 1985, Célia Regina Santana, de 19 anos, saiu de casa em Curitiba (PR) para fazer uma ligação rápida em um telefone público, deixando a filha pequena no sofá. Sua lembrança seguinte foi estar perdida à noite na cidade do Rio de Janeiro, sem saber como havia chegado ali e sem dinheiro. Um desconhecido a ajudou a pegar um ônibus até uma delegacia, onde policiais conseguiram contatar sua família em Curitiba. De volta ao Paraná, Célia manteve a afirmação de que não lembrava do deslocamento. Em sessões de magnetismo e regressão realizadas depois, ela começou a relatar ter sido transportada do telefone para um ambiente desconhecido, onde duas criaturas a deitaram em uma maca ou cama metálica e fizeram exames em seu corpo antes de abandoná-la no Rio. Durante uma das sessões, a experiência foi interrompida porque familiares ficaram apreensivos com a reação da testemunha.", "latitude": -25.4295963, "longitude": -49.2712724, "map_latitude": -25.4295963, "map_longitude": -49.2712724, "cor": "hsl(50.7, 88%, 58%)", "endereco": "Curitiba, Paraná, Região Sul, Brasil"}, {"id": 94, "titulo": "A Noite Oficial dos OVNIs", "ano": 1986, "decada": 1980, "data_ocorrencia": "1986-05-20", "cidade": "São José dos Campos", "estado": "São Paulo", "pais": "Brasil", "tipo_objeto": "OVNI", "tem_seres": false, "link": "https://fenomenum.com.br/noite-oficial/", "resumo": "Na noite de 19 para 20 de maio de 1986, objetos não identificados foram detectados e perseguidos por caças da Força Aérea Brasileira em uma ocorrência que ficou conhecida como a Noite Oficial dos OVNIs. Os relatos envolveram pilotos, radares e centros de controle em regiões como o Vale do Paraíba, Anápolis e São José dos Campos. O episódio ganhou peso histórico porque autoridades da Aeronáutica reconheceram publicamente a interceptação e deram entrevista coletiva sobre o caso.", "latitude": -23.1867782, "longitude": -45.8854538, "map_latitude": -23.1867782, "map_longitude": -45.8854538, "cor": "hsl(188.2, 88%, 58%)", "endereco": "São José dos Campos, São Paulo, Região Sudeste, Brasil"}, {"id": 94, "titulo": "A Noite Oficial dos OVNIs", "ano": 1986, "decada": 1980, "data_ocorrencia": "1986-05-20", "cidade": "Anápolis", "estado": "Goiás", "pais": "Brasil", "tipo_objeto": "OVNI", "tem_seres": false, "link": "https://fenomenum.com.br/noite-oficial/", "resumo": "Na noite de 19 para 20 de maio de 1986, objetos não identificados foram detectados e perseguidos por caças da Força Aérea Brasileira em uma ocorrência que ficou conhecida como a Noite Oficial dos OVNIs. Os relatos envolveram pilotos, radares e centros de controle em regiões como o Vale do Paraíba, Anápolis e São José dos Campos. O episódio ganhou peso histórico porque autoridades da Aeronáutica reconheceram publicamente a interceptação e deram entrevista coletiva sobre o caso.", "latitude": -16.3332828, "longitude": -48.9525756, "map_latitude": -16.3332828, "map_longitude": -48.9525756, "cor": "hsl(188.2, 88%, 58%)", "endereco": "Anápolis, Região Geográfica Imediata de Anápolis, Região Geográfica Intermediária de Goiânia, Goiás, Região Centro-Oeste, Brasil"}, {"id": 96, "titulo": "O Caso do Cajuru", "ano": 1986, "decada": 1980, "data_ocorrencia": "1986-06-04", "cidade": "Curitiba", "estado": "Paraná", "pais": "Brasil", "tipo_objeto": "Disco voador", "tem_seres": false, "link": "https://fenomenum.com.br/o-caso-do-cajuru/", "resumo": "Em 4 de junho de 1986, por volta das 18h15, uma moradora de Curitiba (PR) dirigia pela Avenida Afonso Camargo, acompanhada de três filhos, quando percebeu motoristas no sentido contrário freando e apontando para cima de seu carro. Um dos filhos colocou a cabeça para fora e afirmou que havia um disco voador acompanhando o automóvel a baixa altura. A família seguiu até o conjunto residencial ao lado do Hospital Cajuru e, do apartamento, observou o objeto parado sobre um terreno baldio pertencente ao hospital. Vizinhos foram chamados e também acompanharam o fenômeno por alguns minutos. Depois, o disco teria se aproximado dos prédios, virado na vertical e passado entre eles, desaparecendo na direção de Pinhais, Piraquara e da Serra do Mar.", "latitude": -25.4295963, "longitude": -49.2712724, "map_latitude": -25.4295963, "map_longitude": -49.2712724, "cor": "hsl(325.8, 88%, 58%)", "endereco": "Curitiba, Paraná, Região Sul, Brasil"}, {"id": 95, "titulo": "Caso Bete e Débora", "ano": 1986, "decada": 1980, "data_ocorrencia": "1986-06-14", "cidade": "São Paulo", "estado": "São Paulo", "pais": "Brasil", "tipo_objeto": "Objeto luminoso", "tem_seres": true, "link": "https://fenomenum.com.br/caso-bete-e-debora/", "resumo": "Na noite de 14 de junho de 1986, Bete Rodrigues e a prima Débora voltavam de uma danceteria para a zona leste de São Paulo (SP) quando viram uma luz avermelhada acompanhando o ônibus. Ao descerem perto da casa de Débora, no Jardim Fernandes, perceberam um objeto em forma de disco parado silenciosamente sobre um campo de futebol no fim da rua. Por anos, as duas lembraram apenas do avistamento, até começarem a ter sonhos e lembranças envolvendo seres de olhos grandes. Em hipnose realizada por Mário Rangel, Bete relatou que as duas caminharam atraídas até o campo e encontraram um ser magro, de cerca de 1,30 m, cabeça grande, olhos escuros, braços longos, dedos finos e roupa verde-musgo. As primas teriam sido levadas a bordo de um UFO e examinadas. Em exames posteriores, foram identificados dois pequenos objetos metálicos em partes moles do dedão do pé direito de Bete.", "latitude": -23.5506507, "longitude": -46.6333824, "map_latitude": -23.5506507, "map_longitude": -46.6333824, "cor": "hsl(103.3, 88%, 58%)", "endereco": "São Paulo, Região Sudeste, Brasil"}, {"id": 97, "titulo": "Caso Carnaubinha", "ano": 1988, "decada": 1980, "data_ocorrencia": "1988-01-01", "cidade": "Paraipaba", "estado": "Ceará", "pais": "Brasil", "tipo_objeto": "OVNI", "tem_seres": true, "link": "https://fenomenum.com.br/caso-carnaubinha/", "resumo": "Em uma madrugada de novembro de 1988, na localidade de Carnaubinha, a cerca de 12 quilômetros de Paraipaba (CE), Joana Rodrigues Pereira e sua filha Maria Elisvalda, de 10 anos, saíram cedo para levar verduras à feira. No caminho, observaram uma esfera avermelhada voando lentamente a cerca de 6 metros de altura, mas continuaram andando apesar do medo da menina. Mais adiante, no local chamado Água dos Martins, o objeto reapareceu e posicionou-se a cerca de 2 metros acima delas. As testemunhas ouviram sons estranhos e viram duas figuras baixas, de aproximadamente 1,50 metro, aparência humana e roupas brancas muito brilhantes, próximas a um marmeleiro. O aparelho permaneceu sobre os seres por poucos minutos, e mãe e filha correram de volta para casa assustadas.", "latitude": -3.4321021, "longitude": -39.1446968, "map_latitude": -3.4321021, "map_longitude": -39.1446968, "cor": "hsl(240.8, 88%, 58%)", "endereco": "Centro Integrado de Ensino de Paraipaba - CIEP, 20, Rua Maria Clarice Moreira, Centro, Paraipaba, Região Nordeste, 62685-000, Brasil"}, {"id": 98, "titulo": "Caso Walter Correa", "ano": 1988, "decada": 1980, "data_ocorrencia": "1988-01-01", "cidade": "Curitiba", "estado": "Paraná", "pais": "Brasil", "tipo_objeto": "Não identificado", "tem_seres": true, "link": "https://fenomenum.com.br/caso-walter-correa/", "resumo": "Em julho de 1988, no bairro Boqueirão, em Curitiba (PR), Valter Correa do Prado estava em casa quando cães e gatos ficaram assustados e uma luz intensa surgiu na cozinha. Ao abrir a janela, ele ficou paralisado e viu uma claridade forte iluminar várias quadras; depois percebeu um objeto de forma discoidal a poucos metros. Ao fechar a janela, notou que havia perdido cerca de uma hora, pois a programação da televisão já havia mudado. Dias depois, Valter e a esposa Diva observaram uma névoa marrom ao redor das lâmpadas e, sobre um terreno vizinho do Exército, um objeto silencioso em forma de charuto, com janelas alaranjadas e verdes, parado a 20 ou 30 metros do chão. No dia seguinte, o capim no local apareceu queimado em círculo, área que depois teria sido isolada e revolvida. Em hipnose realizada anos mais tarde, Valter descreveu luz forte, vultos e instrumentos próximos à cabeça.", "latitude": -25.4295963, "longitude": -49.2712724, "map_latitude": -25.4295963, "map_longitude": -49.2712724, "cor": "hsl(18.3, 88%, 58%)", "endereco": "Curitiba, Paraná, Região Sul, Brasil"}, {"id": 100, "titulo": "Um OVNI Pousou ao Lado da Base Aérea de Pirassununga", "ano": 1988, "decada": 1980, "data_ocorrencia": "1988-03-02", "cidade": "Pirassununga", "estado": "São Paulo", "pais": "Brasil", "tipo_objeto": "OVNI", "tem_seres": false, "link": "https://fenomenum.com.br/um-ovni-pousou-ao-lado-da-base-aerea-de-pirassununga/", "resumo": "Na manhã de 2 de março de 1988, ao lado da Base Aérea de Pirassununga (SP), militares da FAB encontraram uma marca circular em um canavial durante ronda de helicóptero. O UH-50 FAB 8768, pilotado pelo tenente Dieter com o terceiro-sargento Marano a bordo, sobrevoava a Zona E quando Marano percebeu plantas tombadas perto de uma área de eucaliptos. O piloto aproximou-se e os dois viram que a cana estava amassada como se algo pesado tivesse pousado ali. A observação gerou novos voos de inspeção, inclusive com o capitão Silva Pinto, o tenente Gilmar, o coronel Cardoso e o tenente Zogovich, que filmou a marca. A documentação citada na matéria inclui fotografias extraídas da filmagem e aponta divergências internas sobre o grau de análise que deveria ser feito no local.", "latitude": -21.9980468, "longitude": -47.4280861, "map_latitude": -21.9980468, "map_longitude": -47.4280861, "cor": "hsl(155.8, 88%, 58%)", "endereco": "Pirassununga, São Paulo, Região Sudeste, Brasil"}, {"id": 99, "titulo": "O Caso Guarapiranga", "ano": 1988, "decada": 1980, "data_ocorrencia": "1988-09-29", "cidade": "São Paulo", "estado": "São Paulo", "pais": "Brasil", "tipo_objeto": "OVNI", "tem_seres": false, "link": "https://fenomenum.com.br/o-caso-guarapiranga/", "resumo": "O Caso Guarapiranga envolve o cadáver de um homem encontrado em 29 de setembro de 1988 na região da represa de Guarapiranga, em São Paulo (SP), com marcas de mutilação que foram comparadas por alguns pesquisadores a casos de mutilação de animais associados a OVNIs. A divulgação ganhou força após matéria de Encarnación Zapata Garcia na Revista UFO, baseada em fotografias e documentos obtidos por meio de contatos com médicos, peritos e o promotor responsável. O corpo teria sido encontrado vestindo apenas cueca, sem sinais claros de luta corporal no boletim de ocorrência, e com lesões que defensores da hipótese ufológica aproximaram de padrões como retirada de mucosas, olhos e tecidos. O caso tornou-se altamente controverso: Encarnación e apoiadores defenderam anomalias sem explicação convencional, enquanto Claudeir e Paola Covo apresentaram investigação contrária, atribuindo as lesões à ação de animais, decomposição e circunstâncias forenses mal interpretadas.", "latitude": -23.5506507, "longitude": -46.6333824, "map_latitude": -23.5506507, "map_longitude": -46.6333824, "cor": "hsl(293.3, 88%, 58%)", "endereco": "São Paulo, Região Sudeste, Brasil"}, {"id": 101, "titulo": "Caso Cláudia", "ano": 1989, "decada": 1980, "data_ocorrencia": "1989-01-01", "cidade": "Curitiba", "estado": "Paraná", "pais": "Brasil", "tipo_objeto": "Objeto luminoso", "tem_seres": false, "link": "https://fenomenum.com.br/caso-claudia/", "resumo": "Em 1989, no bairro Mercês, em Curitiba (PR), Cláudia voltava da faculdade por volta de 23h30 quando encontrou jovens observando uma luz alaranjada parada no céu. Enquanto aguardava ônibus e tentava avisar amigos por telefone, o objeto se moveu rapidamente, aproximou-se e passou baixo sobre as testemunhas, a cerca de 60 metros de altura. Cláudia e os rapazes descreveram um aparelho grande, redondo, com luzes coloridas ao redor, predominando azul, vermelho e amarelo, além de pontas iluminadas e uma cúpula superior com fileiras de luzes intermitentes. O objeto seguiu em direção a Santa Felicidade e desapareceu sobre as casas. Depois do avistamento, Cláudia relatou dores fortes nas juntas por cerca de uma semana e perda de peso; outros jovens mencionaram luzes amarelas que saíram do objeto e retornaram.", "latitude": -25.4295963, "longitude": -49.2712724, "map_latitude": -25.4295963, "map_longitude": -49.2712724, "cor": "hsl(70.8, 88%, 58%)", "endereco": "Curitiba, Paraná, Região Sul, Brasil"}, {"id": 103, "titulo": "Piloto Avista OVNI em Arapongas (PR)", "ano": 1989, "decada": 1980, "data_ocorrencia": "1989-05-02", "cidade": "Arapongas", "estado": "Paraná", "pais": "Brasil", "tipo_objeto": "OVNI", "tem_seres": false, "link": "https://fenomenum.com.br/piloto-avista-ovni-em-arapongas-pr/", "resumo": "Em 2 de maio de 1989, a cerca de 10 quilômetros do Aeroporto Municipal Alberto Bertelli, em Arapongas (PR), o piloto civil Manoel Luiz Christovão preparava o pouso de um pequeno avião vindo de Iguatemi (MS) quando avistou uma enorme luz circular no céu. Ele contatou outro avião para tentar identificar o fenômeno, mas o outro piloto não via nenhum objeto na área. Ao prosseguir para o pouso, Manoel percebeu que a luz se posicionava à frente da aeronave, obrigando-o a fazer manobras bruscas para evitar uma colisão. A cada tentativa de desvio, o objeto teria voltado a se colocar em sua rota. Depois de cerca de 10 minutos, o piloto decidiu seguir diretamente na direção do OVNI, que acelerou repentinamente e desapareceu.", "latitude": -23.4152862, "longitude": -51.4293961, "map_latitude": -23.4152862, "map_longitude": -51.4293961, "cor": "hsl(208.3, 88%, 58%)", "endereco": "Arapongas, Região Geográfica Imediata de Londrina, Paraná, Região Sul, Brasil, Região Geográfica Intermediária de Londrina"}, {"id": 102, "titulo": "Caso TAM voo 573", "ano": 1989, "decada": 1980, "data_ocorrencia": "1989-05-30", "cidade": "Americana", "estado": "São Paulo", "pais": "Brasil", "tipo_objeto": "OVNI", "tem_seres": false, "link": "https://fenomenum.com.br/caso-tam-voo-573/", "resumo": "Em 30 de maio de 1989, nas proximidades de Americana (SP), o voo TAM 573 foi acompanhado por um objeto não identificado registrado pelo Controle de Aproximação de São Paulo. Às 06h46 UTC, controladores perguntaram à tripulação se havia algo visível no céu correspondente ao alvo captado por radar, mas os pilotos inicialmente não avistaram nada, apesar das boas condições visuais. Poucos minutos depois, às 06h52 UTC, o comandante informou um forte clarão próximo ao avião. O objeto manobrou nas imediações da aeronave, e um dos pilotos estimou tamanho aproximado de 50 metros. Por volta das 07h UTC, a tripulação perdeu o contato visual. O episódio ficou documentado no ofício CHF/S-0222, de 13 de junho de 1989, assinado pelo coronel aviador Hélio Pereira Rosa.", "latitude": -22.7392463, "longitude": -47.3306032, "map_latitude": -22.7392463, "map_longitude": -47.3306032, "cor": "hsl(345.8, 88%, 58%)", "endereco": "Americana, São Paulo, Região Sudeste, Brasil"}, {"id": 104, "titulo": "Caso Vanderlei", "ano": 1990, "decada": 1990, "data_ocorrencia": "1990-01-12", "cidade": "Pinhão", "estado": "Paraná", "pais": "Brasil", "tipo_objeto": "Objeto luminoso", "tem_seres": true, "link": "https://fenomenum.com.br/caso-vanderlei/", "resumo": "Em 12 de janeiro de 1990, na zona rural de Pinhão (PR), um jovem identificado como Vanderlei saiu à noite da casa da avó para usar o banheiro externo, localizado a alguns metros da residência. Ao se virar para voltar, viu uma esfera dourada metálica, com cerca de 4 metros de diâmetro, flutuando sobre a casa. Assustado, tentou correr, mas ficou paralisado e só se lembrou de ver o objeto subir rapidamente e desaparecer. Em outubro do mesmo ano, já morando em Curitiba, relatou acordar à noite e ver três vultos claros no quarto, ficando novamente paralisado quando um deles se aproximou. Em hipnose realizada em 2000, Vanderlei descreveu ter sido erguido por um feixe branco até a esfera, visto janelas redondas, uma porta e seres no interior do objeto.", "latitude": -25.6960895, "longitude": -51.6566366, "map_latitude": -25.6960895, "map_longitude": -51.6566366, "cor": "hsl(123.3, 88%, 58%)", "endereco": "Pinhão, Paraná, Região Sul, 85170-000, Brasil"}, {"id": 105, "titulo": "Caso Jerinaldo", "ano": 1991, "decada": 1990, "data_ocorrencia": "1991-01-01", "cidade": "Acari", "estado": "Rio Grande do Norte", "pais": "Brasil", "tipo_objeto": "Disco voador", "tem_seres": false, "link": "https://fenomenum.com.br/caso-jerinaldo/", "resumo": "Em 1991, na zona rural de Acari (RN), Jerinaldo Danes, de 18 anos, voltava de bicicleta pelo sítio Ingá quando viu uma bola luminosa multicolorida surgir por trás dos morros e vir em sua direção. Com a aproximação, seu walkman passou a apresentar estática e ele correu para se esconder sob uma árvore, abraçando o tronco enquanto o objeto parava sobre a copa. Jerinaldo relatou ondas de frio e calor intenso, com medo de que a árvore pegasse fogo. Após cerca de 20 minutos, atravessou uma cerca e se afastou; logo ouviu estalos e viu a árvore cair sobre a cerca, enquanto a luz ainda permanecia acima do local. A moradora Sebastiana Sales disse ter visto uma bola azulada soltando faíscas sobre a árvore e o jovem agachado abaixo dela. Jerinaldo chegou à casa dela muito perturbado, dizendo que havia um disco voador sobre a árvore.", "latitude": -6.4364689, "longitude": -36.6394777, "map_latitude": -6.4364689, "map_longitude": -36.6394777, "cor": "hsl(260.8, 88%, 58%)", "endereco": "Acari, Região Geográfica Intermediária de Caicó, Rio Grande do Norte, Região Nordeste, 59370-000, Brasil"}, {"id": 106, "titulo": "Caso Moisés Campelo", "ano": 1991, "decada": 1990, "data_ocorrencia": "1991-01-01", "cidade": "Campo Redondo", "estado": "Rio Grande do Norte", "pais": "Brasil", "tipo_objeto": "Não identificado", "tem_seres": true, "link": "https://fenomenum.com.br/caso-moises-campelo/", "resumo": "Em maio de 1991, em Campo Redondo (RN), o fazendeiro Moisés Campelo voltava da casa do irmão durante a noite quando viu uma luz intensa sobre uma montanha a alguns quilômetros de distância. Pouco depois, a luz apareceu sobre sua cabeça, grande como uma casa e aparentemente girando, e projetou um feixe que o envolveu. Moisés relatou paralisia, calor forte, ardência nos olhos e sensação de ser sugado para cima, ficando suspenso cerca de 1,5 metro do chão por vários minutos. Ao ser solto, caiu com tontura e tentou rastejar em direção à casa, mas afirmou ter sido novamente abordado quando saiu debaixo de uma árvore. O episódio deixou efeitos físicos e medo intenso na testemunha, que descreveu a experiência em entrevista ao pesquisador Bob Pratt cerca de 16 meses depois.", "latitude": -6.2420219, "longitude": -36.1829456, "map_latitude": -6.2420219, "map_longitude": -36.1829456, "cor": "hsl(38.3, 88%, 58%)", "endereco": "Campo Redondo, Rio Grande do Norte, Região Nordeste, 59230-000, Brasil"}, {"id": 107, "titulo": "Caso Piraquara", "ano": 1991, "decada": 1990, "data_ocorrencia": "1991-01-01", "cidade": "Piraquara", "estado": "Paraná", "pais": "Brasil", "tipo_objeto": "Objeto luminoso", "tem_seres": false, "link": "https://fenomenum.com.br/caso-piraquara/", "resumo": "Em agosto de 1991, na zona rural de Piraquara (PR), perto da Serra do Mar, o casal Valter e Joana observava o céu da varanda de uma chácara quando viu duas formas luminosas aproximarem-se da região. Com os óculos, Joana percebeu objetos em forma de disco, com brilho semelhante a diamante, luzes amarelas e reflexos prateados. Um dos discos permaneceu no ar, oscilando e girando sobre o próprio eixo, enquanto o outro pareceu pousar no solo, como se o maior vigiasse o menor. O casal sentiu medo e curiosidade, comentou a vontade de se aproximar e teve a impressão de estar sendo observado. Por volta das 22h30, ocorreu um blecaute; Joana continuou verificando os objetos por intervalos até cerca de 23h, enquanto usava velas dentro de casa.", "latitude": -25.4423273, "longitude": -49.0604473, "map_latitude": -25.4423273, "map_longitude": -49.0604473, "cor": "hsl(175.8, 88%, 58%)", "endereco": "Piraquara, Paraná, Região Sul, Brasil"}, {"id": 108, "titulo": "Caso São Jorge do Ivai", "ano": 1991, "decada": 1990, "data_ocorrencia": "1991-01-01", "cidade": "São Jorge do Ivaí", "estado": "Paraná", "pais": "Brasil", "tipo_objeto": "Não identificado", "tem_seres": false, "link": "https://fenomenum.com.br/caso-sao-jorge-do-ivai/", "resumo": "Em fevereiro de 1991, em São Jorge do Ivaí (PR), pesquisadores investigaram círculos surgidos em plantações de soja. O primeiro local apresentava uma área de soja seca que teria crescido de 8 para cerca de 30 metros de diâmetro em aproximadamente 20 dias, com três orifícios equidistantes no centro, formando um triângulo. Também havia um sulco em forma de V atravessando a marca, enquanto parte da soja no centro permanecia intacta. Nas proximidades, outros círculos foram encontrados, alguns com orifícios centrais e fileiras de soja verde cruzando a área seca. Testemunhas relataram que televisores e terminais de computador da COCAMAR queimaram no mesmo período. Testes simples com bússola nos orifícios apontaram forte interferência magnética, com a agulha girando quando aproximada do solo afetado.", "latitude": -23.4327325, "longitude": -52.2924553, "map_latitude": -23.4327325, "map_longitude": -52.2924553, "cor": "hsl(313.4, 88%, 58%)", "endereco": "São Jorge do Ivaí, Paraná, Região Sul, 87190-000, Brasil"}, {"id": 110, "titulo": "UFO na Barragem de Alagados", "ano": 1995, "decada": 1990, "data_ocorrencia": "1995-01-01", "cidade": "Ponta Grossa", "estado": "Paraná", "pais": "Brasil", "tipo_objeto": "Disco voador", "tem_seres": false, "link": "https://fenomenum.com.br/ufo-na-barragem-de-alagados/", "resumo": "Em maio de 1995, na região da Barragem de Alagados, entre Ponta Grossa e Carambeí (PR), um grupo de familiares jogava futebol em um sítio quando avistou uma luz vermelha fazendo movimentos circulares sobre a serra de São Miguel. A luz permaneceu na área por mais de meia hora, sem ruído de avião, e depois aumentou de tamanho, entrou entre as nuvens e produziu uma claridade avermelhada intensa, semelhante a uma explosão silenciosa. Mais tarde, a mesma luz redonda voltou a ser vista sobre a serra e a represa, repetindo trajetórias circulares por cerca de 40 minutos. Quando o grupo deixava o local, uma luz muito forte, comparada a farol de milha, teria surgido em sua direção. O relato chegou a pesquisadores em dezembro de 1997 por intermédio de uma vizinha de uma das testemunhas.", "latitude": -25.0891685, "longitude": -50.1601812, "map_latitude": -25.0891685, "map_longitude": -50.1601812, "cor": "hsl(90.9, 88%, 58%)", "endereco": "Ponta Grossa, Paraná, Região Sul, Brasil"}, {"id": 109, "titulo": "Caso Feira de Santana", "ano": 1995, "decada": 1990, "data_ocorrencia": "1995-01-12", "cidade": "Feira de Santana", "estado": "Bahia", "pais": "Brasil", "tipo_objeto": "OVNI", "tem_seres": true, "link": "https://fenomenum.com.br/caso-feira-de-santana/", "resumo": "Na madrugada de 12 de janeiro de 1995, na zona rural de Feira de Santana (BA), uma carta anônima atribuída a um militar relatou a queda ou pouso de um objeto em uma fazenda depois de um grande apagão que teria atingido a região. Segundo o documento, tropas do 35º Batalhão de Infantaria saíram por volta das 5h30 em três caminhões, armadas e com folgas canceladas, rumo a uma propriedade situada a cerca de 20 ou 25 quilômetros da cidade. Ao chegar, o grupo encontrou o local calmo, mas o comandante demonstrava saber que algo incomum havia ocorrido e ordenou buscas na área. A narrativa menciona um objeto encontrado em uma lagoa por um fazendeiro conhecido como Beto Lima e posterior movimentação militar ligada ao suposto resgate de tripulantes. O caso foi divulgado a pesquisadores baianos por meio da correspondência enviada à imprensa.", "latitude": -12.2578934, "longitude": -38.9598047, "map_latitude": -12.2578934, "map_longitude": -38.9598047, "cor": "hsl(228.4, 88%, 58%)", "endereco": "Feira de Santana, Bahia, Região Nordeste, Brasil"}, {"id": 115, "titulo": "Pouso de UFO em Base da Força Aérea Brasileira", "ano": 1996, "decada": 1990, "data_ocorrencia": "1996-01-01", "cidade": "Guaratinguetá", "estado": "São Paulo", "pais": "Brasil", "tipo_objeto": "Não identificado", "tem_seres": false, "link": "https://fenomenum.com.br/pouso-de-ufo-em-base-da-forca-aerea-brasileira/", "resumo": "Na madrugada de 2 de dezembro de 1996, moradores próximos à Escola de Especialistas da Aeronáutica, em Guaratinguetá (SP), relataram a presença de um objeto luminoso nas imediações da base. No dia seguinte, o ufólogo Walter de Oliveira, de Lorena, foi ao local e encontrou uma marca circular em uma área de charco a cerca de 100 metros das instalações da EEAR. A marca tinha aproximadamente 8 metros de diâmetro, com taboas amassadas em sentido horário, secas, sem clorofila e com sinais de exposição ao calor. Pontos queimados apareciam nas bordas e no interior do círculo, enquanto a vegetação externa permanecia intacta. Pesquisadores filmaram, fotografaram e recolheram amostras para análise na UNITAU, mas o local foi posteriormente aterrado sob justificativa de obra de divisa.", "latitude": -22.8057839, "longitude": -45.1908926, "map_latitude": -22.8057839, "map_longitude": -45.1908926, "cor": "hsl(5.9, 88%, 58%)", "endereco": "Guaratinguetá, São Paulo, Região Sudeste, Brasil"}, {"id": 116, "titulo": "Pouso de UFO em São Vicente", "ano": 1996, "decada": 1990, "data_ocorrencia": "1996-01-01", "cidade": "São Vicente", "estado": "São Paulo", "pais": "Brasil", "tipo_objeto": "Disco voador", "tem_seres": false, "link": "https://fenomenum.com.br/pouso-de-ufo-em-sao-vicente/", "resumo": "Em 1º de outubro de 1996, na Ilha do Major, em São Vicente (SP), os pescadores Fernando Bezerra e Wilson da Silva Oliveira recolhiam redes quando observaram a aterrissagem de um OVNI fortemente iluminado a poucos metros da embarcação. O objeto teria pousado na área de manguezal, perto do Rio Piaçabuçu, assustando as testemunhas. O caso ganhou destaque por envolver um pouso observado de curta distância no litoral paulista.", "latitude": -23.9664177, "longitude": -46.3861401, "map_latitude": -23.9664177, "map_longitude": -46.3861401, "cor": "hsl(143.4, 88%, 58%)", "endereco": "São Vicente, São Paulo, Região Sudeste, Brasil"}, {"id": 113, "titulo": "Caso Varginha", "ano": 1996, "decada": 1990, "data_ocorrencia": "1996-01-20", "cidade": "Varginha", "estado": "Minas Gerais", "pais": "Brasil", "tipo_objeto": "OVNI", "tem_seres": true, "link": "https://fenomenum.com.br/caso-varginha-sob-a-otica-dos-bastidores/\nhttps://fenomenum.com.br/caso-varginha-sob-a-otica-dos-holofotes/", "resumo": "Em 20 de janeiro de 1996, em Varginha (MG), o Caso Varginha reúne relatos públicos e de bastidores sobre uma sequência de avistamentos, supostas capturas e mobilização de bombeiros, policiais e militares. A narrativa menciona luzes vistas antes do episódio, possível rastreamento militar e rápida movimentação da Escola de Sargentos das Armas, em Três Corações. Na manhã do dia 20, moradores teriam acionado os bombeiros após avistarem uma criatura próxima ao bosque do Jardim Andere; entre o fim da manhã e o início da tarde, outros relatos falam em perseguição e captura de seres semelhantes. Às 15h30, as jovens Kátia, Valquíria e Liliane afirmaram ter visto uma entidade a poucos metros enquanto voltavam para casa. Os seres foram descritos como humanoides, sem pelos, de pele marrom oleosa, olhos grandes e vermelhos, três protuberâncias na cabeça, três dedos nas mãos e forte odor. O caso ganhou repercussão também por alegações de acobertamento, pressão sobre testemunhas, transporte das criaturas por agentes públicos e pela morte posterior do policial Marco Eli Chereze, frequentemente citada nas discussões sobre o episódio.", "latitude": -21.5565914, "longitude": -45.4340674, "map_latitude": -21.5565914, "map_longitude": -45.4340674, "cor": "hsl(280.9, 88%, 58%)", "endereco": "Varginha, Minas Gerais, Região Sudeste, Brasil"}, {"id": 112, "titulo": "Caso Haroldo Westendorff", "ano": 1996, "decada": 1990, "data_ocorrencia": "1996-10-05", "cidade": "São José do Norte", "estado": "Rio Grande do Sul", "pais": "Brasil", "tipo_objeto": "OVNI", "tem_seres": false, "link": "https://fenomenum.com.br/caso-haroldo-westendorff/", "resumo": "Em 5 de outubro de 1996, o empresário e piloto Haroldo Westendorff voava em um monomotor Tupy sobre a Lagoa dos Patos, perto de São José do Norte (RS), quando encontrou um objeto gigantesco. A nave foi descrita como piramidal, de oito lados, com cerca de 50 metros de altura e tamanho comparável a um estádio de futebol, girando lentamente em torno do próprio eixo enquanto seguia em direção ao mar. Haroldo acompanhou o objeto por cerca de 12 minutos e viu uma escotilha abrir-se na parte superior, de onde saíram três discos menores que inclinaram e desapareceram rapidamente. Ao tentar observar melhor o interior, o objeto maior emitiu raios avermelhados, levando o piloto a se afastar. Depois, a nave subiu em alta velocidade. Durante o episódio, Haroldo manteve contato com familiares, com o controle da Infraero em Pelotas e com o CINDACTA 2; operadores em Pelotas confirmaram visualmente o objeto.", "latitude": -32.0145182, "longitude": -52.0406082, "map_latitude": -32.0145182, "map_longitude": -52.0406082, "cor": "hsl(58.4, 88%, 58%)", "endereco": "São José do Norte, Rio Grande do Sul, Região Sul, 96225-000, Brasil"}, {"id": 111, "titulo": "A Queda do Tucano da FAB", "ano": 1996, "decada": 1990, "data_ocorrencia": "1996-11-16", "cidade": "Santos", "estado": "São Paulo", "pais": "Brasil", "tipo_objeto": "Sonda", "tem_seres": false, "link": "https://fenomenum.com.br/a-queda-do-tucano-da-fab/", "resumo": "Em 16 de novembro de 1996, durante apresentação da Esquadrilha da Fumaça em Santos (SP), uma aeronave Tucano teve a asa rompida enquanto saía de um rasante, caiu e provocou a morte de um banhista atingido por parte da estrutura. Filmagens exibidas posteriormente mostraram uma pequena esfera aproximando-se por trás do avião e passando sob a asa no ponto em que ocorreu a ruptura. Análises citadas na matéria indicaram que o vídeo não teria sido manipulado, enquanto investigações aeronáuticas apontaram fadiga de material em uma chapa estrutural do Tucano como explicação técnica para o acidente. O episódio foi incluído no banco ufológico pela coincidência visual entre a passagem da pequena esfera e o momento da quebra da asa, embora a própria matéria registre a explicação oficial ligada à estrutura da aeronave.", "latitude": -23.9609448, "longitude": -46.3166316, "map_latitude": -23.9609448, "map_longitude": -46.3166316, "cor": "hsl(195.9, 88%, 58%)", "endereco": "Santos, São Paulo, Região Sudeste, Brasil"}, {"id": 117, "titulo": "Caso Colombo", "ano": 1997, "decada": 1990, "data_ocorrencia": "1997-05-18", "cidade": "Praia de Leste", "estado": "Paraná", "pais": "Brasil", "tipo_objeto": "Sonda", "tem_seres": true, "link": "https://fenomenum.com.br/caso-colombo/", "resumo": "Em 1997, em Praia de Leste (PR), o Caso Colombo reuniu dois episódios ligados pela proximidade entre as testemunhas. Em abril, a moradora identificada como M. relatou que estava com familiares na praia quando surgiu um objeto silencioso, iluminado e semelhante a um ônibus. Ela e a filha sentiram zumbido no ouvido direito, e M. afirmou ter sido compelida a caminhar até uma praia deserta, onde o objeto desceu e três seres de pele esverdeada, olhos grandes vermelhos e protuberâncias na cabeça disseram telepaticamente que a levariam. Ela perdeu a consciência e foi encontrada na manhã seguinte, desorientada, com manchas alinhadas no joelho. Em 14 de maio, o menino Rafael e sua irmã viram uma pequena sonda vermelha atravessar o quintal, deixar uma marca que queimava com fogo azulado e seguir em direção à casa de M.; amostras de grama, solo, PVC e fruta coletadas no local apresentaram sinais de aquecimento e alterações incomuns.", "latitude": -25.6973436, "longitude": -48.4672228, "map_latitude": -25.6973436, "map_longitude": -48.4672228, "cor": "hsl(333.4, 88%, 58%)", "endereco": "Praia de Leste, Praia do Leste, Pontal do Paraná, Paraná, Região Sul, Brasil, Região Geográfica Intermediária de Curitiba"}, {"id": 119, "titulo": "Fenômenos Luminosos na Lapa (PR)", "ano": 1998, "decada": 1990, "data_ocorrencia": "1998-01-01", "cidade": "Lapa", "estado": "Paraná", "pais": "Brasil", "tipo_objeto": "Objeto luminoso", "tem_seres": false, "link": "https://fenomenum.com.br/fenomenos-luminosos-na-lapa-pr/", "resumo": "Em outubro de 1998, na zona rural da Lapa (PR), o senhor Pedro e outras pessoas que estavam em sua propriedade observaram um objeto luminoso com cauda evoluindo sobre as árvores logo após o anoitecer. Antes da aparição, a testemunha ouviu um zumbido incomum; em seguida, a luz surgiu por trás de um morro, passou sobre a casa, pairou sobre uma pereira e depois se posicionou sobre um pinheiro. Alguns dias mais tarde, a árvore teria começado a secar gradualmente, com folhas murchas e sinais de exposição a calor, embora sem marcas claras de queima. Durante investigação realizada por Julio Cesar Godard, outras árvores na rota atribuída ao objeto também apresentavam danos. O caso faz parte de uma sequência de relatos luminosos registrados na zona rural do município naquele período.", "latitude": -25.76709, "longitude": -49.716777, "map_latitude": -25.76709, "map_longitude": -49.716777, "cor": "hsl(110.9, 88%, 58%)", "endereco": "Lapa, Paraná, Região Sul, Brasil"}, {"id": 120, "titulo": "O Mistério da Biscaia", "ano": 1998, "decada": 1990, "data_ocorrencia": "1998-01-01", "cidade": "Ponta Grossa", "estado": "Paraná", "pais": "Brasil", "tipo_objeto": "Não identificado", "tem_seres": false, "link": "https://fenomenum.com.br/o-misterio-da-biscaia/", "resumo": "Em março de 1998, na localidade de Biscaia, zona rural de Ponta Grossa (PR), os geólogos Clóvis e Paulo encontraram duas marcas circulares no solo enquanto trabalhavam em uma área de reflorestamento. As marcas tinham cerca de 80 centímetros de diâmetro e estavam em uma estrada rural próxima a uma área de extração de talco. O caso chamou atenção por envolver vestígios físicos sem uma explicação imediata e por ter sido observado por profissionais ligados à geologia.", "latitude": -25.0891685, "longitude": -50.1601812, "map_latitude": -25.0891685, "map_longitude": -50.1601812, "cor": "hsl(248.4, 88%, 58%)", "endereco": "Ponta Grossa, Paraná, Região Sul, Brasil"}, {"id": 121, "titulo": "O OVNI de Timburi (SP)", "ano": 1998, "decada": 1990, "data_ocorrencia": "1998-01-01", "cidade": "Timburi", "estado": "São Paulo", "pais": "Brasil", "tipo_objeto": "OVNI", "tem_seres": false, "link": "https://fenomenum.com.br/o-ovni-de-timburi-sp/", "resumo": "Em 1998, em Timburi (SP), um estudante universitário fotografou um objeto metálico no céu poucos dias depois de encontrar um bezerro de sua propriedade morto em condições incomuns. O animal estava em terreno urbano da família, e a testemunha afirmou que ninguém ouviu ruídos durante a noite; pela manhã, o bezerro apareceu com vísceras ao lado do corpo e sinais de dilaceração, mas sem pegadas, marcas de luta ou indícios claros de predador. Dias depois, no mesmo quintal, o estudante viu um objeto metálico estático no céu e fez uma fotografia; ao preparar uma segunda imagem, percebeu que o objeto começava a se deslocar e registrou a aceleração. As análises feitas pelos pesquisadores consideraram as fotos autênticas e compararam o objeto a uma imagem obtida em Florida, no Uruguai, em 1977, apontando semelhanças como uma haste projetada na base.", "latitude": -23.2064076, "longitude": -49.6045576, "map_latitude": -23.2064076, "map_longitude": -49.6045576, "cor": "hsl(25.9, 88%, 58%)", "endereco": "Timburi, São Paulo, Região Sudeste, Brasil"}, {"id": 118, "titulo": "A Sonda de Capão Redondo", "ano": 1998, "decada": 1990, "data_ocorrencia": "1998-01-02", "cidade": "São Paulo", "estado": "São Paulo", "pais": "Brasil", "tipo_objeto": "Sonda", "tem_seres": false, "link": "https://fenomenum.com.br/a-sonda-de-capao-redondo/", "resumo": "Em 2 de janeiro de 1998, por volta de 21h30, moradores do Capão Redondo, em São Paulo (SP), observaram uma pequena sonda luminosa evoluindo sobre casas da região. O objeto era esférico, com cerca de 20 cm de diâmetro, brilho comparável ao de uma lâmpada pública e movimentos rápidos de subida e descida sobre os telhados, sem produzir ruído. Dois irmãos conseguiram filmar a trajetória do objeto por alguns minutos, depois que familiares foram chamados para acompanhar a observação. A fita chegou à imprensa e posteriormente a pesquisadores do INFA, que foram ao local, entrevistaram as testemunhas e encontraram outras pessoas que também haviam visto as evoluções da sonda.", "latitude": -23.5506507, "longitude": -46.6333824, "map_latitude": -23.5506507, "map_longitude": -46.6333824, "cor": "hsl(163.5, 88%, 58%)", "endereco": "São Paulo, Região Sudeste, Brasil"}, {"id": 123, "titulo": "O Mistério de Vorstadt", "ano": 1999, "decada": 1990, "data_ocorrencia": "1999-01-01", "cidade": "Blumenau", "estado": "Santa Catarina", "pais": "Brasil", "tipo_objeto": "Não identificado", "tem_seres": true, "link": "https://fenomenum.com.br/o-misterio-de-vorstadt/", "resumo": "Entre janeiro e maio de 1999, no bairro Vorstadt, em Blumenau (SC), moradores das ruas Urubici e Humaitá relataram desaparecimento de animais, passos ao redor das casas, batidas em portas e janelas, alarmes disparando sem causa aparente e pedras arremessadas sem que o autor fosse identificado. A situação ganhou força na noite de 23 de maio, quando Márcio Poli ouviu passos, viu um vulto correndo para o matagal e fotografou o que pensou ser um ladrão. A imagem ampliada mostrou uma figura difícil de identificar, alimentando a dúvida entre animal, pessoa ou algo incomum. Moradores chamaram a polícia, cercaram áreas próximas ao mato e fizeram buscas com lanternas, mas não encontraram vestígios. Crianças da região apelidaram o personagem de \"Cambuí\", nome ligado a uma das buscas feitas por um morador armado com um pedaço dessa madeira.", "latitude": -26.9195567, "longitude": -49.0658025, "map_latitude": -26.9195567, "map_longitude": -49.0658025, "cor": "hsl(301.0, 88%, 58%)", "endereco": "Blumenau, Santa Catarina, Região Sul, Brasil"}, {"id": 122, "titulo": "Caso General Carneiro", "ano": 1999, "decada": 1990, "data_ocorrencia": "1999-08-13", "cidade": "União da Vitória", "estado": "Paraná", "pais": "Brasil", "tipo_objeto": "Disco voador", "tem_seres": false, "link": "https://fenomenum.com.br/caso-general-carneiro/", "resumo": "Em 13 de agosto de 1999, na Fazenda Tarumã, em General Carneiro (PR), o pecuarista Ernesto Eleotério Maciel relatou ter visto um disco voador pousar em sua propriedade. Outros moradores e professores da região também relataram avistamentos de objetos em forma de disco durante deslocamentos noturnos pelo sul do Paraná. O caso ficou associado a uma sequência de observações na região, com pouso próximo e forte reação das testemunhas.", "latitude": -26.228596, "longitude": -51.0869796, "map_latitude": -26.228596, "map_longitude": -51.0869796, "cor": "hsl(78.5, 88%, 58%)", "endereco": "União da Vitória, Paraná, Região Sul, Brasil"}, {"id": 124, "titulo": "O Caso Sítio Feliz", "ano": 2003, "decada": 2000, "data_ocorrencia": "2003-04-25", "cidade": "Antonina", "estado": "Paraná", "pais": "Brasil", "tipo_objeto": "OVNI", "tem_seres": false, "link": "https://fenomenum.com.br/o-caso-sitio-feliz/", "resumo": "Em 25 de abril de 2003, por volta de 1h, no Sítio Feliz, bairro São João, em Antonina (PR), Lígia Muraro estava deitada assistindo televisão quando uma forte luz branca entrou pela janela acompanhada de um estalo. A luz se apagou em seguida, sugerindo uma queda de energia, mas a testemunha não viu nenhum objeto ao sair para verificar. Na manhã seguinte, encontrou marcas estranhas no gramado ao redor da casa. No mesmo dia, 9 perus e 3 gansos morreram sem causa conhecida. Pesquisadores do CIPEX foram ao local em 7 de maio, mediram as marcas e coletaram amostras de plantas e solo para análise. Os exames laboratoriais não apontaram anormalidades no material coletado, mas o episódio permaneceu registrado pela combinação de luz intensa, marcas no terreno e morte súbita das aves.", "latitude": -25.4298854, "longitude": -48.7125431, "map_latitude": -25.4298854, "map_longitude": -48.7125431, "cor": "hsl(216.0, 88%, 58%)", "endereco": "Antonina, Paraná, Região Sul, 83370-000, Brasil"}, {"id": 125, "titulo": "Caso do Rio Pequeno", "ano": 2007, "decada": 2000, "data_ocorrencia": "2007-01-01", "cidade": "Antonina", "estado": "Paraná", "pais": "Brasil", "tipo_objeto": "OVNI", "tem_seres": true, "link": "https://fenomenum.com.br/caso-do-rio-pequeno/", "resumo": "Em 2007, na região do Rio Pequeno, zona rural de Antonina (PR), o sitiante Antônio Pinheiro dos Santos e sua esposa Ângela Viana Pinheiro relataram uma série de aparições noturnas de um grande objeto sobre áreas de mata da Serra do Mar. O aparelho foi descrito como redondo, cinza-escuro, silencioso, com cerca de 80 metros de diâmetro, luzes piscantes na parte inferior e uma luz superior capaz de iluminar as montanhas. Segundo o casal, ele surgia principalmente em noites sem Lua, entre 18h e 3h. Em uma ocasião, Antônio piscou uma lanterna em direção ao objeto, que apagou as luzes imediatamente. Em outra, os dois viram uma espécie de varanda na estrutura, onde apareceram dois tripulantes de aparência humana observando a região. As aparições coincidiram com lâmpadas externas queimadas e mortes de animais, incluindo um cavalo encontrado sem os olhos, o que levou a família a buscar ajuda do IBGE local e depois de pesquisadores do CIPEX.", "latitude": -25.4298854, "longitude": -48.7125431, "map_
